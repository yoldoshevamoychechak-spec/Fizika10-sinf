(function(){
const pages={
51:{title:'Tokli o‘tkazgichni magnit maydonda ko‘chirishda bajarilgan ish',plan:['Magnit oqim va uning o‘zgarishi','Amper kuchining bajargan ishi','Ish, tok va magnit oqim orasidagi bog‘lanish'],theory:[
['Magnit oqim',`Magnit oqim — sirt orqali o‘tayotgan magnit maydonning miqdoriy tavsifi. Bir jinsli maydonda Φ = B·S·cosα. Bu yerda B — magnit induksiya, S — kontur yuzasi, α — B vektori bilan sirtga o‘tkazilgan normal orasidagi burchak. Oqim birligi — veber (Wb).`],
['O‘tkazgichni siljitish',`Magnit maydonda tokli o‘tkazgichga Amper kuchi ta’sir qiladi. O‘tkazgich siljiganda kuch ish bajaradi. Zanjir sharoitiga ko‘ra bu ish mexanik energiya va elektr energiya almashinuvi bilan bog‘liq.`],
['Asosiy formula',`A = I·ΔΦ. Bu yerda A — ish (J), I — tok kuchi (A), ΔΦ — magnit oqim o‘zgarishi (Wb). Oqim o‘zgarishi kattalashsa yoki tok kuchi ortsa, ishning moduli ortadi.`]],formula:'A = I·ΔΦ',controls:[['I','Tok I (A)',1,10,3],['B','Magnit induksiya B (T)',0.1,1,0.4],['S','Yuza o‘zgarishi ΔS (m²)',0.01,0.2,0.05]],sim:'work',tests:[['Magnit oqim birligi qaysi?',['Tesla','Veber','Joul','Amper'],1],['Bir jinsli maydonda oqim formulasi qaysi?',['Φ=BS cosα','Φ=I/R','Φ=mv','Φ=F/S'],0],['Ishni topish formulasi qaysi?',['A=IΔΦ','A=U/I','A=mcΔt','A=q/t'],0],['Tok kuchi ikki marta ortsa, ΔΦ o‘zgarmasa ish…',['2 marta ortadi','2 marta kamayadi','o‘zgarmaydi','nol bo‘ladi'],0],['Magnit oqimning SI birligi…',['N','Wb','T/m','Ω'],1]]},
52:{title:'Magnit maydonda zaryad harakati',plan:['Lorens kuchi','Zaryad trayektoriyasi','Aylana radiusi va davri'],theory:[
['Lorens kuchi',`Magnit maydonda harakatlanayotgan zaryadga Lorens kuchi ta’sir qiladi. Kuch tezlik vektori va magnit induksiya vektoriga tik yo‘naladi. Uning moduli F = |q|vB·sinα. Zaryad tinch tursa yoki v va B parallel bo‘lsa, magnit Lorens kuchi nol bo‘ladi.`],
['Trayektoriya',`Agar v ⟂ B bo‘lsa, Lorens kuchi markazga intilma kuch vazifasini bajaradi va zaryad aylana bo‘ylab harakatlanadi. Agar tezlikning B ga parallel tashkil etuvchisi ham bo‘lsa, trayektoriya vint chizig‘iga o‘xshaydi. Magnit kuch tezlikka tik bo‘lgani uchun ish bajarmaydi, tezlik modulini o‘zgartirmaydi.`],
['Radius va davr',`Aylana bo‘ylab harakatda |q|vB = mv²/r, bundan r = mv/(|q|B). Aylanish davri T = 2πm/(|q|B). Massa va tezlik oshsa radius ortadi; B yoki |q| oshsa radius kamayadi.`]],formula:'F = |q|vB·sinα;  r = mv/(|q|B);  T = 2πm/(|q|B)',controls:[['v','Tezlik v (10⁶ m/s)',1,10,4],['B','Magnit induksiya B (T)',0.1,1,0.5],['q','|q| (10⁻¹⁹ C)',1,5,2],['m','Massa (10⁻²⁷ kg)',1,10,3]],sim:'charge',tests:[['Lorens kuchi tezlikka nisbatan qanday?',['Parallel','Tik','Har doim qarama-qarshi','Nol emas'],1],['v ⟂ B bo‘lganda zaryad trayektoriyasi…',['To‘g‘ri chiziq','Aylana','Parabola','Harakatsiz'],1],['Magnit kuch qanday ish bajaradi?',['Musbat ish','Manfiy ish','Ish bajarmaydi','Cheksiz ish'],2],['Radius formulasi qaysi?',['r=mv/(|q|B)','r=|q|B/mv','r=mvB','r=q/v'],0],['B ortsa radius…',['ortadi','kamayadi','o‘zgarmaydi','nol bo‘lmaydi'],1]]},
53:{title:'O‘zgarmas tok elektr dvigateli',plan:['Dvigatelning tuzilishi','Aylantiruvchi moment','Kollektor va energiya aylanishi'],theory:[
['Tuzilishi va ishlash prinsipi',`O‘zgarmas tok elektr dvigateli stator magnit maydoni, rotor (yakor) chulg‘ami, kollektor va cho‘tkalardan tashkil topadi. Chulg‘amdan tok o‘tganda uning qarama-qarshi tomonlariga qarama-qarshi yo‘nalgan Amper kuchlari ta’sir qilib, aylantiruvchi moment hosil qiladi.`],
['Aylantiruvchi moment',`Tokli ramkaga ta’sir qiluvchi moment soddalashtirilgan holda M = N·I·B·S·sinα. N — o‘ramlar soni, I — tok, B — magnit induksiya, S — ramka yuzi. Tok yoki magnit maydon kuchaysa, moment odatda ortadi.`],
['Kollektor va energiya',`Kollektor ramka yarim aylanish qilganda chulg‘amdagi tok yo‘nalishini almashtiradi. Shuning uchun aylantiruvchi moment rotorni bir tomonga aylantirishda davom etadi. Dvigatel elektr energiyasini mexanik energiyaga aylantiradi; real qurilmada energiyaning bir qismi issiqlikka ketadi.`]],formula:'M = N·I·B·S·sinα',controls:[['I','Tok I (A)',1,10,4],['B','Magnit induksiya B (T)',0.1,1,0.5],['S','Ramka yuzi S (m²)',0.01,0.2,0.08],['N','O‘ramlar soni N',1,100,20]],sim:'motor',tests:[['Dvigatel nimani aylantiradi?',['Rotor/yakor','Faqat batareya','Faqat magnit qutbi','Kollektorning o‘zi'],0],['Dvigatel elektr energiyasini nimaga aylantiradi?',['Faqat kimyoviy','Mexanik','Yadro','Faqat yorug‘lik'],1],['Moment nimaga bog‘liq?',['Tok va magnit maydonga','Faqat rangga','Faqat sim uzunligiga','Havo bosimiga'],0],['Kollektor vazifasi…',['Tok yo‘nalishini mos vaqtda almashtirish','Magnit maydonni yo‘qotish','Qarshilikni nol qilish','Rotorni sovitish'],0],['Tok oshsa, boshqa kattaliklar o‘zgarmasa moment…',['ortadi','kamayadi','nol bo‘ladi','o‘zgarmaydi'],0]]},
54:{title:'Elektromagnit induksiya',plan:['Induksiya hodisasi','Faradey qonuni','Lents qoidasi'],theory:[
['Induksiya hodisasi',`Yopiq kontur orqali o‘tuvchi magnit oqim o‘zgarganda konturda induksion elektr toki paydo bo‘lishi elektromagnit induksiya deyiladi. Oqim magnitni g‘altakka kiritish yoki chiqarish, magnit maydonni o‘zgartirish, kontur yuzasi yoki yo‘nalishini o‘zgartirish orqali o‘zgarishi mumkin.`],
['Faradey qonuni',`Induksion EYuK magnit oqimning vaqt bo‘yicha o‘zgarish tezligiga proporsional. N o‘ramli g‘altak uchun ε = −N·ΔΦ/Δt. Oqim tezroq o‘zgarsa yoki o‘ramlar soni ko‘paysa, EYuK moduli kattalashadi.`],
['Lents qoidasi',`Induksion tokning yo‘nalishi o‘zi hosil qilgan magnit maydon bilan magnit oqimdagi o‘zgarishga qarshilik ko‘rsatadigan qilib yo‘naladi. Formuladagi minus ishora shu qoidani bildiradi. Induksiya energiyaning saqlanish qonuniga mos keladi.`]],formula:'ε = −N·ΔΦ/Δt',controls:[['N','O‘ramlar soni N',1,200,50],['dF','Oqim o‘zgarishi ΔΦ (mWb)',1,20,5],['dt','Vaqt Δt (ms)',1,100,20]],sim:'induction',tests:[['Induksion tok qachon paydo bo‘ladi?',['Magnit oqim o‘zgarganda','Oqim doimiy bo‘lganda','Faqat sim qiziganda','Zanjir uzilganida doim'],0],['Faradey qonuni nimani bog‘laydi?',['EYuK va oqim o‘zgarish tezligini','Massa va hajmni','Bosim va haroratni','Kuch va yelkani'],0],['Lents qoidasi nimani aniqlaydi?',['Induksion tok yo‘nalishini','Qarshilik birligini','Zaryad massasini','Haroratni'],0],['Oqim tezroq o‘zgarsa EYuK…',['ortadi','kamayadi','o‘zgarmaydi','doim nol'],0],['EYuK birligi…',['Volt','Tesla','Veber','Nyuton'],0]]},
55:{title:'Amaliy mashg‘ulot: elektromagnit induksiya hodisasini o‘rganish',plan:['Asboblar va xavfsizlik','Tajriba bajarish','Natijalarni tahlil qilish'],theory:[
['Maqsad va asboblar',`Maqsad — magnit oqim o‘zgarishi induksion tok hosil qilishini tajribada ko‘rish. Kerakli asboblar: g‘altak, tayoqcha magnit, galvanometr yoki sezgir ampermetr, ulash simlari. Qurilmalarni past kuchlanishli, xavfsiz tajriba tarzida ulang.`],
['Tajriba tartibi',`1) Magnitni g‘altakka yaqinlashtiring va galvanometr strelkasini kuzating. 2) Magnitni to‘xtating — strelka nolga qaytishini kuzating. 3) Magnitni teskari tomonga harakatlantiring — tok yo‘nalishi almashadi. 4) Magnitni tezroq harakatlantiring — strelkaning og‘ishi kattalashadi.`],
['Xulosa va jadval',`Kuzatuv jadvalida magnit yo‘nalishi, harakat tezligi va strelka og‘ishini yozing. Magnit harakatsiz turganda oqim o‘zgarmaydi va induksion EYuK kuzatilmaydi. Harakat yo‘nalishi o‘zgarsa tok yo‘nalishi ham o‘zgaradi.`]],formula:'|ε| = N·|ΔΦ|/Δt',controls:[['speed','Magnit harakat tezligi',0,10,5],['N','O‘ramlar soni N',10,200,100],['direction','Harakat yo‘nalishi: 0 yoki 1',0,1,0]],sim:'lab',tests:[['Magnit g‘altakka nisbatan tinch tursa…',['Induksiya doim kuchli','Oqim o‘zgarmasa induksiya yo‘q','Tok cheksiz ortadi','Galvanometr sinadi'],1],['Magnitni teskari harakatlantirsak tok…',['Yo‘nalishini o‘zgartiradi','Har doim bir xil','Yo‘qolmaydi va o‘zgarmaydi','Faqat qiziydi'],0],['Tezroq harakat odatda…',['EYuKni oshiradi','EYuKni nol qiladi','Qarshilikni nol qiladi','Zaryadni yo‘q qiladi'],0],['Asbob sifatida nima ishlatiladi?',['Galvanometr','Termometr','Dinamometr','Barometr'],0],['Tajriba nimani tekshiradi?',['Faradey qonunini','Nyutonning 3-qonunini','Boyl qonunini','Arximed qonunini'],0]]},
56:{title:'O‘zinduksiya. Induktivlik',plan:['O‘zinduksiya hodisasi','Induktivlik kattaligi','O‘zinduksiya EYuK'],theory:[
['O‘zinduksiya hodisasi',`Zanjirdagi tok kuchi o‘zgarsa, shu zanjirning o‘z magnit oqimi ham o‘zgaradi. Natijada shu zanjirning o‘zida induksion EYuK hosil bo‘ladi. Bu o‘zinduksiya deyiladi. U tokning o‘zgarishiga qarshilik ko‘rsatadi.`],
['Induktivlik',`Induktivlik L g‘altakning tok hosil qilgan magnit oqimi bilan bog‘liq xususiyatini ifodalaydi. U o‘ramlar soni, g‘altak o‘lchami, shakli va o‘zak materialiga bog‘liq. SI birligi — genri (H).`],
['O‘zinduksiya EYuK',`εL = −L·ΔI/Δt. Minus ishora Lents qoidasini bildiradi. Tok kuchi qanchalik tez o‘zgarsa va induktivlik qanchalik katta bo‘lsa, EYuK moduli shunchalik katta bo‘ladi. Tok o‘zgarmas bo‘lsa, ideal holatda o‘zinduksiya EYuK nol.`]],formula:'εL = −L·ΔI/Δt',controls:[['L','Induktivlik L (H)',0.1,5,1],['dI','Tok o‘zgarishi ΔI (A)',0.1,10,3],['dt','Vaqt Δt (s)',0.01,1,0.2]],sim:'self',tests:[['O‘zinduksiya qachon yuz beradi?',['Tok o‘zgarganda','Tok o‘zgarmaganda doim','Faqat ochiq havoda','Faqat zaryad yo‘q bo‘lsa'],0],['Induktivlik birligi…',['Genri','Veber','Amper','Joul'],0],['O‘zinduksiya EYuK formulasi…',['εL=−LΔI/Δt','ε=IR','F=ma','P=UI'],0],['Tok tezroq o‘zgarsa EYuK…',['ortadi','kamayadi','nol bo‘ladi','o‘zgarmaydi'],0],['Induktivlik nimaga bog‘liq?',['G‘altak tuzilishi va o‘zakka','Faqat xona rangiga','Faqat tok yo‘nalishiga','Faqat vaqtga'],0]]},

/* ---- HARD QUIZ ---- */
function startHardQuiz(idx){
  const qz = BRAIN.hardQuizzes[idx];
  let cur=0, score=0, answers=[], left=qz.time, timerId=null;
  const app=document.getElementById('app');
  function renderQ(){
    if(cur>=qz.qs.length){ finish(); return; }
    const qq=qz.qs[cur];
    app.innerHTML=`
    <div class="brain-hub">
      <div class="nav">
        <button class="s" onclick="clearInterval(timerId);brainHome()">← Orqaga</button>
        <span class="timer" id="tmr">${left}s</span>
        <span class="score-pill">${cur+1}/${qz.qs.length} · ${score} ball</span>
      </div>
      <div class="card">
        <h3>${qz.title}</h3>
        <p><b>${cur+1}. ${qq.q}</b></p>
        ${qq.opts.map((o,j)=>`<button class="opt s" data-a="${j}">${'ABCD'[j]}) ${o}</button>`).join('')}
        <div id="feed" class="out"></div>
      </div>
    </div>`;
    app.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{
        if(b.disabled)return;
        app.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        const ok = +b.dataset.a === qq.a;
        b.classList.add(ok?'ok':'bad');
        if(!ok) app.querySelectorAll('.opt')[qq.a].classList.add('ok');
        if(ok){ score+=10; brainScore+=10; saveBrain(); }
        answers.push(ok);
        document.getElementById('feed').innerHTML = (ok?'✅ To‘g‘ri! ':'❌ Noto‘g‘ri. ')+`<span class="hint">${qq.e}</span>`;
        setTimeout(()=>{cur++;renderQ()}, 1600);
      };
    });
  }
  function tick(){
    left--;
    const el=document.getElementById('tmr');
    if(el) el.textContent=left+'s';
    if(left<=0){ clearInterval(timerId); finish(); }
  }
  function finish(){
    clearInterval(timerId);
    const okc=answers.filter(Boolean).length;
    app.innerHTML=`
    <div class="brain-hub">
      <div class="nav"><button class="s" onclick="brainHome()">← Hub</button></div>
      <div class="hero"><h1>Natija</h1>
        <p class="timer">${okc}/${qz.qs.length} to‘g‘ri</p>
        <p>+${okc*10} ball · Jami: ${brainScore}</p>
        <p class="stars">${'★'.repeat(Math.min(5,Math.ceil(okc/2)))}${'☆'.repeat(Math.max(0,5-Math.ceil(okc/2)))}</p>
      </div>
      <button onclick="startHardQuiz(${idx})">↻ Qayta</button>
      <button class="s" onclick="brainHome()">Hubga qaytish</button>
    </div>`;
  }
  renderQ();
  timerId=setInterval(tick,1000);
}

function gameMatch(){
  const pairs=[
    ['F = ma','Nyuton 2-qonuni'],
    ['F = mv²/R','Markazga intilma kuch'],
    ['T = 2π√(l/g)','Matematik mayatnik'],
    ['F = BIl·sinα','Amper kuchi'],
    ['ε = −ΔΦ/Δt','Faradey qonuni'],
    ['W = LI²/2','Magnit maydon energiyasi'],
    ['η = A_f/A_t','Foydali ish koeffitsiyenti'],
    ['P = m(g±a)','Liftdagi og‘irlik']
  ];
  let left=[...pairs], right=pairs.map(p=>p[1]).sort(()=>Math.random()-0.5);
  let selected=null, matched=0, t0=Date.now(), done=false;
  const app=document.getElementById('app');
  function draw(){
    if(done)return;
    const sec=Math.floor((Date.now()-t0)/1000);
    app.innerHTML=`
    <div class="brain-hub">
      <div class="nav">
        <button class="s" onclick="brainHome()">← Hub</button>
        <span class="timer">${sec}s</span>
        <span class="score-pill">${matched}/${pairs.length}</span>
      </div>
      <div class="card"><h3>🧩 Formula juftlash</h3>
        <p class="mu">Chapdan formulani, o‘ngdan ta’rifni tanlang.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div>${left.map((p,i)=>p?`<button class="s opt" data-side="L" data-i="${i}">${p[0]}</button>`:'').join('')}</div>
          <div>${right.map((t,i)=>t?`<button class="s opt" data-side="R" data-i="${i}">${t}</button>`:'').join('')}</div>
        </div>
        <div id="msg" class="out"></div>
      </div>
    </div>`;
    app.querySelectorAll('.opt').forEach(b=>{
      b.onclick=()=>{
        const side=b.dataset.side, i=+b.dataset.i;
        if(!selected){ selected={side,i,el:b}; b.style.outline='2px solid var(--ac)'; return; }
        if(selected.side===side){ selected.el.style.outline=''; selected={side,i,el:b}; b.style.outline='2px solid var(--ac)'; return; }
        // check match
        let ok=false;
        if(selected.side==='L'){
          ok = left[selected.i] && left[selected.i][1]===right[i];
          if(ok){ left[selected.i]=null; right[i]=null; matched++; }
        } else {
          ok = left[i] && left[i][1]===right[selected.i];
          if(ok){ left[i]=null; right[selected.i]=null; matched++; }
        }
        if(ok){
          brainScore+=5; saveBrain();
          document.getElementById('msg').textContent='✅ Juft topildi! +5';
          if(matched===pairs.length){
            done=true;
            const bonus=Math.max(0,30-sec);
            brainScore+=bonus; saveBrain();
            setTimeout(()=>app.innerHTML=`
              <div class="brain-hub"><div class="nav"><button class="s" onclick="brainHome()">← Hub</button></div>
              <div class="hero"><h1>Yutuq!</h1><p>Vaqt: ${sec}s · Bonus: +${bonus}</p>
              <p>Jami ball: ${brainScore}</p></div>
              <button onclick="gameMatch()">↻ Qayta</button></div>`,400);
          } else setTimeout(draw,400);
        } else {
          document.getElementById('msg').textContent='❌ Mos kelmadi';
          selected.el.style.outline=''; selected=null;
        }
        selected=null;
      };
    });
  }
  draw();
}

function gameMemory(){
  const cards=[
    ['Kuch','Vektor kattalik'],['Davr','Bir to‘liq tebranish vaqti'],
    ['FIK','A_f / A_t'],['Tesla','B birligi'],['Veber','Φ birligi'],
    ['Genri','L birligi'],['Amper kuchi','F=BIl sinα'],['Faradey','ε=−ΔΦ/Δt']
  ];
  let deck=[];
  cards.forEach((c,i)=>{deck.push({t:c[0],id:i});deck.push({t:c[1],id:i})});
  deck=deck.sort(()=>Math.random()-0.5);
  let open=[], matched=new Set(), moves=0, lock=false;
  const app=document.getElementById('app');
  function draw(){
    app.innerHTML=`
    <div class="brain-hub">
      <div class="nav"><button class="s" onclick="brainHome()">← Hub</button>
        <span class="score-pill">Yurish: ${moves} · Juft: ${matched.size/2}/${cards.length}</span></div>
      <div class="card"><h3>🧠 Xotira</h3>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
          ${deck.map((c,i)=>`
            <button class="s" style="min-height:64px;font-size:.9rem;${matched.has(i)?'opacity:.35':''}"
              data-i="${i}" ${matched.has(i)||open.includes(i)?'disabled':''}>
              ${open.includes(i)||matched.has(i)?c.t:'❓'}
            </button>`).join('')}
        </div>
      </div>
    </div>`;
    if(matched.size===deck.length){
      const bonus=Math.max(5,40-moves);
      brainScore+=bonus; saveBrain();
      setTimeout(()=>app.innerHTML=`
        <div class="brain-hub"><div class="nav"><button class="s" onclick="brainHome()">← Hub</button></div>
        <div class="hero"><h1>Yodda saqladingiz!</h1><p>${moves} yurish · +${bonus} ball</p></div>
        <button onclick="gameMemory()">↻</button></div>`,600);
      return;
    }
    app.querySelectorAll('[data-i]').forEach(b=>{
      b.onclick=()=>{
        if(lock||open.length>=2)return;
        const i=+b.dataset.i;
        open.push(i); draw();
        if(open.length===2){
          moves++; lock=true;
          const [a,b2]=open;
          if(deck[a].id===deck[b2].id){
            matched.add(a); matched.add(b2);
            open=[]; lock=false; setTimeout(draw,300);
          } else {
            setTimeout(()=>{open=[];lock=false;draw()},800);
          }
        }
      };
    });
  }
  draw();
}

function gameOrbit(){
  const app=document.getElementById('app');
  let m=2, R=120, v=4, running=true, angle=0, score=0, last=performance.now();
  let needed = m*v*v/(R/40); // rough F needed in sim units
  app.innerHTML=`
  <div class="brain-hub">
    <div class="nav"><button class="s" onclick="running=false;brainHome()">← Hub</button>
      <span class="score-pill" id="oscore">Ball: 0</span></div>
    <div class="card">
      <h3>🪐 Orbitani ushla</h3>
      <p class="mu">Markazga intilma kuchni sozlang: F = mv²/R. Jism doira bo‘ylab barqaror qolsin.</p>
      <canvas class="game-cv" id="ocv" width="640" height="320"></canvas>
      <label class="mu">F (N): <b id="fval">10</b></label>
      <input type="range" id="fsl" min="1" max="40" value="10" step="0.5">
      <label class="mu">v (m/s): <b id="vval">4</b></label>
      <input type="range" id="vsl" min="1" max="10" value="4" step="0.5">
      <div class="out" id="omsg">F kerak ≈ ${(m*16/(R/40)).toFixed(1)} N</div>
      <button class="s" id="orestart">↻ Qayta</button>
    </div>
  </div>`;
  const cv=document.getElementById('ocv'), ctx=cv.getContext('2d');
  const fsl=document.getElementById('fsl'), vsl=document.getElementById('vsl');
  fsl.oninput=()=>{document.getElementById('fval').textContent=fsl.value};
  vsl.oninput=()=>{v=+vsl.value; document.getElementById('vval').textContent=v;
    document.getElementById('omsg').textContent=`F kerak ≈ ${(m*v*v/(R/40)).toFixed(1)} N`;};
  document.getElementById('orestart').onclick=()=>{angle=0;score=0;running=true;loop(performance.now())};
  function loop(now){
    if(!running||!document.getElementById('ocv'))return;
    const dt=(now-last)/1000; last=now;
    const F=+fsl.value;
    const a_c = v*v/(R/40);
    const Fneed = m*a_c;
    const err = Math.abs(F-Fneed);
    // stability: if close, stay circular; else drift
    let rr = R;
    if(err>3) rr = R + (F-Fneed)*4;
    rr = Math.max(40, Math.min(150, rr));
    angle += (v/(rr/40))*dt;
    if(err<2){ score+=dt*5; document.getElementById('oscore').textContent='Ball: '+Math.floor(score); }
    ctx.clearRect(0,0,640,320);
    ctx.strokeStyle='#8b9bd8'; ctx.beginPath(); ctx.arc(320,160,R,0,7); ctx.stroke();
    const x=320+rr*Math.cos(angle), y=160+rr*Math.sin(angle);
    ctx.fillStyle='#22d3ee'; ctx.beginPath(); ctx.arc(x,y,10,0,7); ctx.fill();
    // force arrow to center
    ctx.strokeStyle='#ef4444'; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(320,160); ctx.stroke();
    ctx.fillStyle='#e6eaff'; ctx.fillText('F='+F.toFixed(1)+'  kerak≈'+Fneed.toFixed(1), 20, 24);
    if(score>80){
      running=false;
      brainScore+=30; saveBrain();
      document.getElementById('omsg').textContent='🎉 Barqaror orbitada ushladingiz! +30 ball';
    } else requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

<script>
(function(){

const CHN=["I BOB. Dinamika. Statika elementlari","II BOB. Mexanik tebranishlar va to‘lqinlar","III BOB. Gidrodinamika va aerodinamika","IV BOB. Elektrostatik maydon","V BOB. O‘zgarmas tok qonunlari","VI BOB. Turli muhitlarda elektr toki","VII BOB. Magnit maydon"];

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mkM=(r,bob)=>{const o=shuf(r.slice(1,5).map((t,i)=>({t,ok:i==0})));return {k:'m',q:r[0],o,e:r[5],bob,pt:1}};
const mkN=(r,bob)=>({k:'n',q:r[0],ans:r[1],u:r[2],e:r[3],bob,pt:2});
function build(spec){
  let L=[];
  spec.ch.forEach(b=>{BANK[b].m.forEach(r=>L.push(mkM(r,b)));BANK[b].n.forEach(r=>L.push(mkN(r,b)))});
  (spec.ex||[]).forEach(b=>{shuf(BANK[b].m).slice(0,2).forEach(r=>L.push(mkM(r,b)))});
  // tartib: avval test savollari, so‘ng hisoblash masalalari
  return shuf(L.filter(x=>x.k=='m')).concat(L.filter(x=>x.k=='n'));
}

function start(key){
  const isB=key.startsWith('bsb'),i=+key.replace(/\D/g,'');
  const spec=isB?{t:'BSB-'+(i+1),d:CHN[i],ch:[i],ex:[],time:25}:QT[i];
  const Q=build(spec),A=new Array(Q.length).fill(null);
  let cur=0,left=spec.time*60,done=false;
  function draw(){
    const q=Q[cur],ans=A.filter(x=>x!==null&&x!=='').length;
    app().innerHTML=`<div class="nav"><button class="s" id="bx">✕ Chiqish</button><span class="timer" id="tm" style="align-self:center;padding:0 8px">${fmt(left)}</span><span class="score-pill" style="align-self:center">${ans}/${Q.length} javob</span></div>
    <div class="card"><div class="tag" style="color:var(--cy)">${spec.t} · ${cur+1}/${Q.length} · ${q.pt} ball${q.k=='n'?' · hisoblash':''}</div>
    <p style="margin:8px 0"><b>${q.q}</b></p>
    ${q.k=='m'?q.o.map((o,j)=>`<button class="s" style="display:block;width:100%;text-align:left;margin:6px 0;${A[cur]===j?'outline:2px solid var(--ac)':''}" data-j="${j}">${'ABCD'[j]}) ${o.t}</button>`).join(''):
    `<input id="ni" inputmode="decimal" placeholder="Javobni son bilan yozing (${q.u})" value="${A[cur]??''}"><p class="mu">Birlik: ${q.u}. Vergul yoki nuqta ishlatish mumkin.</p>`}
    </div>
    <div class="row"><button class="s" id="pv" ${cur?'':'disabled'}>← Oldingi</button><button class="s" id="nx" ${cur<Q.length-1?'':'disabled'}>Keyingi →</button></div>
    <div class="card" style="padding:8px"><div style="display:flex;flex-wrap:wrap;gap:5px">${Q.map((_,k)=>`<button class="s" style="min-width:38px;padding:6px 8px;${k==cur?'outline:2px solid var(--ac);':''}${A[k]!==null&&A[k]!==''?'background:var(--ac);color:#fff':''}" data-g="${k}">${k+1}</button>`).join('')}</div></div>
    <button style="width:100%" id="fn">✔ Topshirish</button>`;
    document.getElementById('bx').onclick=()=>{if(confirm('Chiqsangiz natija saqlanmaydi. Chiqasizmi?')){clearInterval(tid);hub()}};
    app().querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{A[cur]=+b.dataset.j;draw()});
    const ni=document.getElementById('ni');if(ni)ni.oninput=()=>{A[cur]=ni.value.trim()===''?null:ni.value;};
    app().querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{cur=+b.dataset.g;draw()});
    document.getElementById('pv').onclick=()=>{cur--;draw()};
    document.getElementById('nx').onclick=()=>{cur++;draw()};
    document.getElementById('fn').onclick=()=>{const m=A.filter(x=>x===null).length;if(!m||confirm('Javobsiz '+m+' ta topshiriq bor. Topshirasizmi?'))finish()};
    window.scrollTo(0,0);
  }
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  function finish(){
    if(done)return;done=true;clearInterval(tid);
    let sc=0,mx=0;const res=Q.map((q,k)=>{mx+=q.pt;let ok=false;
      if(q.k=='m')ok=A[k]!==null&&q.o[A[k]].ok;
      else if(A[k]!==null){const v=parseFloat(String(A[k]).replace(',','.'));ok=isFinite(v)&&Math.abs(v-q.ans)<=Math.max(Math.abs(q.ans)*0.02,0.011)}
      if(ok)sc+=q.pt;return ok});
    const p=Math.round(sc/mx*100),g=GR(p),h=H[key]||{n:0,best:0};
    H[key]={n:h.n+1,best:Math.max(h.best,p),last:p,g,date:new Date().toISOString().slice(0,10)};sv();
    // bob bo‘yicha tahlil
    const by={};Q.forEach((q,k)=>{by[q.bob]=by[q.bob]||[0,0];by[q.bob][1]+=q.pt;if(res[k])by[q.bob][0]+=q.pt});
    const col=g==5?'#16a34a':g==4?'#0ea5e9':g==3?'#f59e0b':'#ef4444';
    app().innerHTML=`<div class="nav"><button class="s" onclick="bsbHub()">← BSB/CHSB</button><button class="s" onclick="home()">☰ Mundarija</button></div>
    <div class="hero"><div class="tag">${spec.t} NATIJASI</div><h1 style="color:${col}">${g} baho</h1><p class="timer">${sc}/${mx} ball · ${p} %</p>
    <p class="mu">${g==5?'A’lo! Mavzularni mukammal o‘zlashtirgansiz.':g==4?'Yaxshi natija. Xatolarni tahlil qiling.':g==3?'Qoniqarli. Qiyin mavzularni takrorlang.':'Mavzularni qayta o‘rganib, yana urinib ko‘ring.'}</p></div>
    <div class="card"><b>Boblar bo‘yicha o‘zlashtirish</b>${Object.keys(by).map(b=>{const r=Math.round(by[b][0]/by[b][1]*100);return `<p style="margin:8px 0 2px">${CHN[b]} — <b>${by[b][0]}/${by[b][1]}</b></p><div class="bar"><i style="width:${r}%;background:${r>=70?'#16a34a':r>=50?'#f59e0b':'#ef4444'}"></i></div>`}).join('')}</div>
    <div class="card"><b>Xatolar tahlili</b>${Q.map((q,k)=>res[k]?'':`<div class="card" style="border-left:4px solid #ef4444"><p style="margin:0 0 6px"><b>${k+1}. ${q.q}</b></p><p class="mu" style="margin:2px 0">Sizning javobingiz: ${A[k]===null?'—':q.k=='m'?q.o[A[k]].t:A[k]+' '+q.u}</p><p style="margin:2px 0;color:#16a34a"><b>To‘g‘ri javob: ${q.k=='m'?q.o.find(o=>o.ok).t:q.ans+' '+q.u}</b></p><p class="mu" style="margin:2px 0">Yechim: ${q.e}</p></div>`).join('')||'<p>Barcha javoblar to‘g‘ri! 🎉</p>'}</div>
    <button style="width:100%" onclick="bsbStart('${key}')">↻ Qayta topshirish</button>`;
    window.scrollTo(0,0);
  }
  tid=setInterval(()=>{left--;const t=document.getElementById('tm');if(t)t.textContent=fmt(left);if(left<=0){alert('Vaqt tugadi!');finish()}},1000);
  draw();
}
window.bsbClear=function(){if(confirm('Natijalar tarixini o‘chirasizmi?')){H={};try{localStorage.removeItem(LS)}catch(e){}hub()}};window.bsbHub=hub;window.bsbStart=start;
// bosh sahifaga tugma qo‘shish
const _h=home;
home=function(){
  _h();
  const hero=document.querySelector('.hero');
  if(hero&&!document.getElementById('bsbBtn')){
    const b=document.createElement('button');b.id='bsbBtn';b.style.cssText='margin:10px 6px 0;background:linear-gradient(135deg,#f59e0b,#ef4444)';
    b.textContent='📝 BSB va CHSB — summativ baholash';b.onclick=hub;hero.appendChild(b);
  }
};
home();
})();

</script>
</body></html>
