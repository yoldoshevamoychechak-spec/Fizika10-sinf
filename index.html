cons:{n:'ish trayektoriyaga bog‘liq emas',p:[['Zaryad q (µC)','q',10,200,100,10],['E (kN/C)','E',1,10,4],['Yo‘l: 0 to‘g‘ri · 1 siniq (1-2-3) · 2 egri','w',0,2,0]],d(c,P,t,Ac){const a=[100,220],b=[350,100],m=[350,220],pt=(w,u)=>w==0?[a[0]+250*u,a[1]-120*u]:w==1?(u<.5?[a[0]+500*u,a[1]]:[m[0],m[1]-240*(u-.5)]):[(1-u)*(1-u)*100+2*u*(1-u)*100+u*u*350,(1-u)*(1-u)*220+2*u*(1-u)*40+u*u*100],u=Math.min((t%4)/3,1);for(let i=0;i<4;i++)ar(c,440,50+i*55,570,50+i*55,'#fbbf24');c.setLineDash([4,5]);c.beginPath();for(let s=0;s<=1.001;s+=.02){const p=pt(P.w,s);s?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])}c.stroke();c.setLineDash([]);const p=pt(P.w,u);c.fillStyle='#ef4444';c.beginPath();c.arc(a[0],a[1],6,0,7);c.fill();c.fillStyle=Ac;c.beginPath();c.arc(p[0],p[1],9,0,7);c.fill();const A=P.q*1e-6*P.E*1e3*.5;return `Δd = 0,5 m (maydon yo‘nalishidagi ko‘chish) · A = q·E·Δd = ${A.toFixed(3)} J<br>Yo‘l shakli o‘zgarsa ham ish o‘zgarmaydi: elektrostatik kuch konservativ`}},
wfl:{n:'maydonda zaryadni ko‘chirishda ish',p:[['Zaryad q (µC)','q',10,200,100,10],['E (kN/C)','E',1,10,4],['Ko‘chish l (m)','l',.2,1,.5,.1],['Burchak α (°)','a',0,180,0,15]],d(c,P,t,Ac){const r=P.a*Math.PI/180,u=Math.min((t%4)/3,1),L=P.l*400,x0=100,y0=220,x1=x0+L*Math.cos(r),y1=y0-L*Math.sin(r);for(let i=0;i<4;i++)ar(c,380,40+i*55,540,40+i*55,'#fbbf24');ar(c,x0,y0,x1,y1,'#22d3ee');c.setLineDash([4,5]);c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y0);c.lineTo(x1,y1);c.stroke();c.setLineDash([]);c.fillStyle=Ac;c.beginPath();c.arc(x0+(x1-x0)*u,y0+(y1-y0)*u,9,0,7);c.fill();const A=P.q*1e-6*P.E*1e3*P.l*Math.cos(r);return `Δd = l·cosα = ${(P.l*Math.cos(r)).toFixed(2)} m · A = q·E·l·cosα = ${A.toFixed(3)} J`+(A>0?' (maydon musbat ish bajaradi)':A<0?' (maydon manfiy ish bajaradi)':' (ish nolga teng)')}},
loop:{n:'yopiq kontur bo‘ylab ish',p:[['Zaryad q (µC)','q',10,200,100,10],['E (kN/C)','E',1,10,4]],d(c,P,t,Ac){const pts=[[100,230],[350,230],[350,110],[100,230]],s=(t%6)/2,k=Math.min(2,Math.floor(s)),f=s-k,p=[pts[k][0]+(pts[k+1][0]-pts[k][0])*f,pts[k][1]+(pts[k+1][1]-pts[k][1])*f];for(let i=0;i<4;i++)ar(c,420,50+i*55,560,50+i*55,'#fbbf24');c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<4;i++)c.lineTo(pts[i][0],pts[i][1]);c.stroke();c.fillStyle=Ac;c.beginPath();c.arc(p[0],p[1],9,0,7);c.fill();const W=P.q*1e-6*P.E*1e3*.625;c.fillStyle=c.strokeStyle;c.fillText('1',90,245);c.fillText('2',355,245);c.fillText('3',355,105);return `A₁₂ = qEΔd = ${W.toFixed(3)} J · A₂₃ = 0 · A₃₁ = −${W.toFixed(3)} J<br>Yopiq kontur: A = A₁₂ + A₂₃ + A₃₁ = 0`}},
pe:{n:'potensial energiya va maydon ishi',p:[['Maydon zaryadi q (nC)','q',1,20,10],['Sinov zaryadi q₀ (nC)','z',-10,10,5],['Boshlang‘ich r₁ (m)','a',.1,1,.8,.1],['Oxirgi r₂ (m)','b',.1,1,.2,.1]],d(c,P,t,Ac){const k=9e9,u=Math.min((t%4)/3,1),r=P.a+(P.b-P.a)*u,x=r=>100+r*480,w=r=>k*P.q*1e-9*P.z*1e-9/r,W1=w(P.a),W2=w(P.b);c.fillStyle='#ef4444';c.beginPath();c.arc(100,150,16,0,7);c.fill();c.setLineDash([4,5]);c.beginPath();c.moveTo(x(P.a),110);c.lineTo(x(P.a),190);c.moveTo(x(P.b),110);c.lineTo(x(P.b),190);c.stroke();c.setLineDash([]);c.fillStyle=P.z>=0?Ac:'#0ea5e9';c.beginPath();c.arc(x(r),150,10,0,7);c.fill();c.fillStyle=c.strokeStyle;c.fillText('r₁',x(P.a)-6,105);c.fillText('r₂',x(P.b)-6,105);return `W = kqq₀/r = ${(w(r)*1e6).toFixed(3)} µJ (hozir r = ${r.toFixed(2)} m)<br>W₁ = ${(W1*1e6).toFixed(3)} µJ · W₂ = ${(W2*1e6).toFixed(3)} µJ · A = W₁ − W₂ = ${((W1-W2)*1e6).toFixed(3)} µJ`}},
phi:{n:'maydon potensiali φ = kq/r',p:[['Zaryad q (nC)','q',-20,20,10,2],['Zaryad q₀ (nC)','z',1,10,2]],d(c,P,t,Ac){const X=r=>40+r*560,F=r=>9*P.q/r,m=Math.max(1,Math.abs(9*P.q/.05)),rm=.05+((t%6)/6)*.95;c.beginPath();c.moveTo(40,150);c.lineTo(610,150);c.moveTo(40,20);c.lineTo(40,280);c.stroke();c.strokeStyle='#22d3ee';c.beginPath();for(let r=.05;r<=1;r+=.01)r>.05?c.lineTo(X(r),150-120*F(r)/m):c.moveTo(X(r),150-120*F(r)/m);c.stroke();c.fillStyle=Ac;c.beginPath();c.arc(X(rm),150-120*F(rm)/m,7,0,7);c.fill();return `φ = kq/r = ${F(rm).toFixed(1)} V (r = ${rm.toFixed(2)} m)<br>W = φ·q₀ = ${(F(rm)*P.z*1e-3).toFixed(3)} µJ · φ skalyar kattalik: q > 0 da φ > 0, q < 0 da φ < 0`}},
eqp:{n:'potensiallar farqi va ekvipotensial sirtlar',p:[['Zaryad q (nC)','q',1,20,10],['1-nuqta r₁ (m)','a',.1,1,.2,.05],['2-nuqta r₂ (m)','b',.1,1,.6,.05]],d(c,P,t,Ac){const cx=200,cy=150,k=150;c.fillStyle='#ef4444';c.beginPath();c.arc(cx,cy,12,0,7);c.fill();c.strokeStyle='#8b9bd8';[.2,.4,.6,.8,1].forEach(r=>{c.beginPath();c.arc(cx,cy,r*k,0,7);c.stroke()});c.strokeStyle='#fbbf24';[P.a,P.b].forEach(r=>{c.beginPath();c.arc(cx,cy,r*k,0,7);c.stroke()});for(let i=0;i<8;i++){const a=i*Math.PI/4+.3;ar(c,cx+20*Math.cos(a),cy+20*Math.sin(a),cx+P.b*k*Math.cos(a),cy+P.b*k*Math.sin(a),'#22d3ee')}const u=Math.min((t%4)/3,1),r=P.a+(P.b-P.a)*u;c.fillStyle=Ac;c.beginPath();c.arc(cx+r*k,cy,8,0,7);c.fill();const f1=9*P.q/P.a,f2=9*P.q/P.b;return `φ₁ = kq/r₁ = ${f1.toFixed(1)} V · φ₂ = kq/r₂ = ${f2.toFixed(1)} V<br>Δφ = φ₁ − φ₂ = ${(f1-f2).toFixed(1)} V · A = q₀Δφ (q₀ = 1 nC) = ${((f1-f2)*1e-3).toFixed(3)} µJ<br>Bir sferada φ = const (ekvipotensial sirt); E sirtga tik`}}});

26:{s:[
['Kuchlanganlik masalalari',`<p><b>1-masala.</b> q = 10 nC, r = 0,3 m. E = ? Sinov zaryadi q_s = 2 nC ga ta’sir kuchi F = ?</p><div class=f>E = kq/r² = 9·10⁹·10·10⁻⁹/0,09 = 1000 N/C</div><div class=f>F = q_s·E = 2·10⁻⁹·1000 = 2·10⁻⁶ N = 2 µN</div>`,'fld'],
['Superpozitsiya masalalari',`<p><b>2-masala.</b> E₁ = 300 N/C va E₂ = 400 N/C o‘zaro tik. E = ?</p><div class=f>E = √(E₁² + E₂²) = √(90000 + 160000) = 500 N/C</div><p>Qarama-qarshi yo‘nalgan E₁ = 5, E₂ = 3 N/C bo‘lsa, E = |E₁ − E₂| = 2 N/C.</p>`,'sup'],

27:{s:[
['Konservativ va nokonservativ kuchlar',`<p>Mexanik ish kuch va kuch yo‘nalishidagi ko‘chish ko‘paytmasi bilan ifodalanadi: A = F·l·cosα.</p><p><b>Ta’rif.</b> Ishi trayektoriya shakliga bog‘liq bo‘lmagan kuch <b>konservativ kuch</b> deyiladi (og‘irlik, elastiklik, gravitatsion, elektrostatik kuch). Ishi trayektoriya shakliga bog‘liq bo‘lgan kuch <b>nokonservativ kuch</b> (ishqalanish kuchi, uyurmaviy elektr kuchlari).</p><div class=f>A = F·l·cosα</div>`,'cons'],
['Bir jinsli maydonda zaryadni ko‘chirishda bajarilgan ish',`<p>Bir jinsli maydonda zaryadga F = qE kuch ta’sir qiladi. Zaryad l masofaga ko‘chganda, Δd = l·cosα — maydon yo‘nalishidagi ko‘chish:</p><div class=f>A = F·l·cosα = q·E·Δd</div><ul><li>α = 0°: A = qEΔd (musbat)</li><li>α = 90°: A = 0</li><li>α = 180°: A = −qEΔd (manfiy)</li></ul><p>Misol: q = 100 µC, E = 4 kN/C, Δd = 0,5 m → A = 10⁻⁴·4000·0,5 = 0,2 J.</p>`,'wfl'],
['Yopiq kontur bo‘ylab ish. Gravitatsion maydon bilan o‘xshashlik',`<p>Bir jinsli maydonda ish zaryadning harakat trayektoriyasi shakliga emas, faqat <b>boshlang‘ich va oxirgi vaziyatlarga</b> bog‘liq. Bu har qanday elektrostatik maydon uchun to‘g‘ri. Shuning uchun zaryadni yopiq kontur bo‘ylab ko‘chirishda ish doim nolga teng:</p><div class=f>A₁₋₂₋₃₋₁ = A₁₂ + A₂₃ + A₃₁ = qEΔd + 0 − qEΔd = 0</div><p>Elektrostatik maydon xuddi gravitatsion maydon kabi <b>potensial maydon</b> bo‘lib, unda zaryad potensial energiyaga ega bo‘ladi.</p>`,'loop']]},
28:{s:[
['Maydondagi nuqtaviy zaryadning potensial energiyasi',`<p>Maydon ishi hisobiga zaryadning potensial energiyasi kamayadi: ish potensial energiyalar farqiga teng.</p><div class=f>A₁₂ = −ΔW<sub>p</sub> = W<sub>p1</sub> − W<sub>p2</sub></div><p>q₁ va q₂ zaryadlarning o‘zaro ta’sir potensial energiyasi:</p><div class=f>W = k·q₁q₂/r</div><div class=f>A = kqq₀/r₁ − kqq₀/r₂</div>`,'pe'],
['Nuqtaviy zaryad maydonining potensiali',`<p><b>Ta’rif.</b> Maydonning biror nuqtasidagi <b>potensial</b> — shu nuqtaga kiritilgan birlik musbat sinov zaryadining potensial energiyasiga son jihatdan teng kattalik. Potensial <b>skalyar</b> kattalik, birligi — volt (1 V = 1 J/C).</p><div class=f>φ = W<sub>p</sub>/q₀;   W<sub>p</sub> = φ·q₀</div><p>Nuqtaviy q zaryad maydonida:</p><div class=f>φ = k·q/r</div>`,'phi'],
['Potensiallar farqi. Ekvipotensial sirtlar',`<p>Maydonda q₀ zaryadni ko‘chirishda bajarilgan ish A = q₀(φ₁ − φ₂).</p><div class=f>Δφ = φ₁ − φ₂ = A/q₀</div><p>Potensiallar farqi — birlik musbat zaryadni maydonning bir nuqtasidan ikkinchisiga ko‘chirishda maydon bajargan ishga teng. Bir jinsli maydonda Δφ = E·d.</p><p><b>Ekvipotensial sirt</b> — barcha nuqtalarida potensial bir xil bo‘lgan sirt. Nuqtaviy zaryad uchun u konsentrik sfera; kuchlanganlik vektori sirtga tik yo‘nalgan, ekvipotensial sirt bo‘ylab zaryad ko‘chirilganda ish nolga teng.</p>`,'eqp']]}});

chg:{n:'o‘tkazgichni zaryadlash: W = qφ/2',p:[['Sig‘im C (µF)','C',1,50,10],['Kuchlanish U (V)','U',10,300,100,10]],d(c,P,t,Ac){const f=Math.min((t%5)/3,1),q=P.C*P.U*f,u=P.U*f;c.beginPath();c.moveTo(60,260);c.lineTo(60,30);c.moveTo(60,260);c.lineTo(580,260);c.stroke();c.strokeStyle='#22d3ee';c.beginPath();c.moveTo(60,260);c.lineTo(560,40);c.stroke();c.fillStyle=Ac;c.globalAlpha=.5;c.beginPath();c.moveTo(60,260);c.lineTo(60+500*f,260);c.lineTo(60+500*f,260-220*f);c.closePath();c.fill();c.globalAlpha=1;return `φ q ga proporsional; yuza = ish: A = qφ/2<br>q = ${q.toFixed(0)} µC · φ = ${u.toFixed(0)} V · W = qφ/2 = ${(P.C*1e-6*P.U*P.U/2*f*f).toFixed(4)} J (to‘liq: ${(P.C*1e-6*P.U*P.U/2).toFixed(4)} J)`}},
cap:{n:'zaryadlangan kondensator energiyasi',p:[['Sig‘im C (µF)','C',1,50,10],['Kuchlanish U (V)','U',10,300,100,10]],d(c,P,t,Ac){const g=Math.min(t/2,1),q=P.C*P.U,n=Math.max(1,Math.round(12*q/15000*g)),W=P.C*1e-6*P.U*P.U/2;c.fillRect(160,100,320,6);c.fillRect(160,200,320,6);for(let i=0;i<n;i++){const x=180+i*(280/Math.max(n,2));c.fillStyle='#ef4444';c.fillText('+',x,94);c.fillStyle='#0ea5e9';c.fillText('−',x,226);ar(c,x+4,112,x+4,194,'#fbbf24')}c.fillStyle=Ac;const h=Math.min(200,W*40*g);c.fillRect(540,270-h,40,h);return `q = CU = ${q} µC · W = qU/2 = CU²/2 = q²/2C = ${W.toFixed(4)} J`}},
den:{n:'maydon energiyasining zichligi',p:[['Kuchlanganlik E (kV/m)','E',1,100,20],['Singdiruvchanlik ε','e',1,10,1],['Yuza S (sm²)','S',10,100,50,10],['Oraliq d (mm)','d',1,10,5]],d(c,P,t,Ac){const E=P.E*1e3,w=8.85e-12*P.e*E*E/2,V=P.S*1e-4*P.d*1e-3,g=.5+.5*Math.sin(3*t),y2=80+P.d*14+40;c.fillRect(160,80,320,6);c.fillRect(160,y2,320,6);c.globalAlpha=.25+.25*g;c.fillStyle=Ac;c.fillRect(160,86,320,y2-86);c.globalAlpha=1;return `ω = ε₀εE²/2 = ${w.toFixed(4)} J/m³ · V = S·d = ${(V*1e6).toFixed(1)} sm³<br>W = ω·V = ${(w*V).toExponential(2)} J (ε₀ = 8,85·10⁻¹² F/m)`}},
flw:{n:'disk-maxovik: kinetik energiya',p:[['Aylanish chastotasi (ayl/s)','n',0,10,5,.5]],d(c,P,t,Ac){const th=2*Math.PI*P.n*t,w=2*Math.PI*P.n,I=5.8e-5;c.beginPath();c.arc(320,150,100,0,7);c.stroke();c.beginPath();c.arc(320,150,20,0,7);c.stroke();for(let i=0;i<6;i++){const a=th+i*Math.PI/3;c.beginPath();c.moveTo(320+20*Math.cos(a),150+20*Math.sin(a));c.lineTo(320+100*Math.cos(a),150+100*Math.sin(a));c.stroke()}c.fillStyle=Ac;c.beginPath();c.arc(320+80*Math.cos(th),150+80*Math.sin(th),9,0,7);c.fill();return `ω = 2πn = ${w.toFixed(1)} rad/s · E_kin = Iω²/2 = ${(I*w*w/2).toFixed(4)} J (ikki DVD disk, I ≈ 5,8·10⁻⁵ kg·m²)`}},
gen:{n:'mexanik energiya → elektr → yorug‘lik',p:[['Aylantirish tezligi (ayl/s)','n',0,10,4,.5]],d(c,P,t,Ac){const th=2*Math.PI*P.n*t,b=Math.min(1,P.n/6),U=.45*P.n;c.beginPath();c.arc(160,150,60,0,7);c.stroke();c.beginPath();c.moveTo(160,150);c.lineTo(160+60*Math.cos(th),150+60*Math.sin(th));c.stroke();c.beginPath();c.moveTo(220,150);c.lineTo(400,150);c.stroke();c.strokeRect(400,120,60,60);c.fillText('dvigatel',405,200);c.fillStyle='rgba(255,220,60,'+b+')';c.beginPath();c.arc(540,150,28,0,7);c.fill();c.strokeStyle='#fbbf24';c.beginPath();c.arc(540,150,28,0,7);c.stroke();return `Aylantirish: mexanik energiya → dvigatel generator bo‘lib elektr energiya beradi → diod yonadi<br>U ≈ ${U.toFixed(2)} V; tezlik ortsa, diod yorqinroq`}},
flo:{n:'energiyaning saqlanishi va aylanishi',p:[['Mexanik energiya E (J)','E',1,100,50],['Elektrga aylanish ulushi (%)','p',10,90,60,5]],d(c,P,t,Ac){const g=Math.min(t/2,1),e=P.E*P.p/100,q=P.E-e;c.fillStyle=Ac;c.fillRect(60,60,300,40);c.fillStyle='#22d3ee';c.fillRect(380,40,200*P.p/100*g,40);c.fillStyle='#ef4444';c.fillRect(380,100,200*(1-P.p/100)*g,40);c.fillStyle=c.strokeStyle;c.fillText('mexanik',60,52);c.fillText('elektr',382,34);c.fillText('issiqlik (ishqalanish)',382,158);return `E = E_el + Q: ${P.E} J = ${e.toFixed(1)} J + ${q.toFixed(1)} J<br>Energiya yo‘qolmaydi, faqat bir turdan boshqasiga o‘tadi`}},
ke:{n:'maydonda zaryadli sharchaning tezligi',p:[['Zaryad q (nC)','q',1,20,10],['Potensiallar farqi Δφ (V)','u',10,200,100,10],['Massa m (g)','m',5,50,10,5],['Boshlang‘ich tezlik v_A (sm/s)','v',0,10,2]],d(c,P,t,Ac){const A=P.q*1e-9*P.u,m=P.m/1e3,vA=P.v/100,vB=Math.sqrt(vA*vA+2*A/m),u=Math.min((t%4)/3,1),x=80+u*440,v=Math.sqrt(vA*vA+2*A/m*u);c.fillRect(80,200,440,4);c.fillStyle='#ef4444';c.fillRect(70,170,16,60);c.fillStyle='#0ea5e9';c.fillRect(514,170,16,60);c.fillStyle=Ac;c.beginPath();c.arc(x,180,10,0,7);c.fill();ar(c,x,150,x+Math.min(150,v*3000),150,'#fbbf24');return `A = qΔφ = ${(A*1e6).toFixed(2)} µJ = ΔE_k → v_B = √(v_A² + 2qΔφ/m) = ${(vB*100).toFixed(2)} sm/s<br>Hozir v = ${(v*100).toFixed(2)} sm/s`}},
cur:{n:'tok kuchi I = q/t',p:[['Tok kuchi I (A)','I',1,10,3],['Vaqt t (s)','t',1,10,5]],d(c,P,t,Ac){c.strokeRect(60,100,500,80);c.setLineDash([4,4]);c.beginPath();c.moveTo(310,90);c.lineTo(310,190);c.stroke();c.setLineDash([]);for(let i=0;i<20;i++){const x=60+((i*26-t*P.I*20)%500+500)%500,y=115+((i*37)%50);c.fillStyle='#0ea5e9';c.beginPath();c.arc(x,y,4,0,7);c.fill()}ar(c,100,240,300,240,'#ef4444');c.fillStyle='#cbd5ff';c.fillText('tok yo‘nalishi (+)',110,262);c.fillText('elektronlar ←',400,262);return `q = I·t = ${P.I}·${P.t} = ${P.I*P.t} C · I = q/t = ${P.I} A (1 A = 1 C/s)<br>1 s da kesimdan ${(P.I/1.6e-19).toExponential(2)} ta elektron o‘tadi`}},
drf:{n:'zaryad tashuvchilar dreyf tezligi',p:[['Tok I (A)','I',1,20,5],['Kesim yuzi S (mm²)','S',1,10,2]],d(c,P,t,Ac){const v=P.I/(8.5e28*1.6e-19*P.S*1e-6);c.strokeRect(60,100,500,100);for(let i=0;i<24;i++){const x=60+((i*21+t*60*P.I/P.S*.3)%500),y=115+((i*53)%70)+4*Math.sin(9*t+i);c.fillStyle='#0ea5e9';c.beginPath();c.arc(560-(x-60),y,4,0,7);c.fill()}ar(c,100,240,400,240,'#ef4444');return `I = n·q₀·v·S → v = I/(nq₀S) = ${(v*1e3).toFixed(3)} mm/s (mis, n = 8,5·10²⁸ m⁻³)<br>Elektronlar juda sekin siljiydi, maydon esa deyarli yorug‘lik tezligida tarqaladi`}},
jd:{n:'tok zichligi j = I/S',p:[['Tok kuchi I (A)','I',1,20,10],['S₁ (mm²)','a',1,10,2],['S₂ (mm²)','b',1,10,8]],d(c,P,t,Ac){[[P.a,60],[P.b,170]].forEach(w=>{const S=w[0],y=w[1],h=S*10;c.strokeRect(60,y+(100-h)/2,500,h);const j=P.I/S,n=Math.round(4+j*3);c.fillStyle=Ac;for(let i=0;i<n;i++){const x=60+((i*500/n-t*P.I*10)%500+500)%500,yy=y+(100-h)/2+4+((i*37)%Math.max(1,h-8));c.beginPath();c.arc(x,yy,3,0,7);c.fill()}});return `j₁ = I/S₁ = ${(P.I/P.a).toFixed(2)} A/mm² = ${(P.I/P.a*1e6).toExponential(2)} A/m²<br>j₂ = I/S₂ = ${(P.I/P.b).toFixed(2)} A/mm² · ingichka o‘tkazgichda tok zichligi katta (kuchliroq qiziydi)`}}});
Object.assign(X,{
29:{s:[
['Elektr maydon energiyasi (yakkalangan o‘tkazgich)',`<p>O‘tkazgichni zaryadlash uchun zaryadlar orasidagi itarish kuchini yengishda ish bajariladi. Bu ish hisobiga zaryadlangan o‘tkazgich <b>elektr maydon energiyasi</b> W<sub>el</sub> ga ega bo‘ladi; zaryadsizlanganda u shu energiyani sarflaydi: W<sub>el</sub> = A.</p><p>Potensial noldan φ gacha o‘sadi, o‘rtacha potensial φ<sub>o‘rt</sub> = φ/2, shuning uchun A = q·φ<sub>o‘rt</sub>:</p><div class=f>W<sub>el</sub> = qφ/2 = Cφ²/2 = q²/(2C)</div><p>Grafikda (φ — q) ish uchburchak yuzasiga teng.</p>`,'chg'],
['Kondensatorning elektr maydon energiyasi',`<p>Kondensatorda zaryad q, qoplamalar orasidagi kuchlanish U (potensiallar farqi):</p><div class=f>W = qU/2 = CU²/2 = q²/(2C)</div><p>Yassi kondensator sig‘imi:</p><div class=f>C = ε₀εS/d</div><p>Misol: C = 10 µF, U = 100 V → W = 10⁻⁵·10⁴/2 = 0,05 J.</p>`,'cap'],
['Elektr maydon energiyasining zichligi',`<p>Zaryadlangan yassi kondensatorning energiyasi maydon kuchlanganligining kvadratiga va maydon egallagan hajmga (V = S·d) to‘g‘ri proporsional:</p><div class=f>W = ε₀εE²·V/2</div><p><b>Energiya zichligi</b> — maydonning hajm birligiga to‘g‘ri kelgan energiyasi:</p><div class=f>ω = W/V = ε₀εE²/2   (J/m³)</div><p>Energiya zaryadlarda emas, <b>maydonning o‘zida</b> mujassamlangan.</p>`,'den']]},
30:{s:[
['Maqsad, jihozlar, xavfsizlik va qurilmani yig‘ish',`<p><b>Xavfsizlik:</b> elektr kavsharlash va yelimlash jarayonida ehtiyot bo‘ling.</p><p><b>Mashg‘ulotning maqsadi:</b> energiyaning saqlanish va aylanish qonunini o‘rganish.</p><p><b>Jihozlar:</b> yog‘och brusok, chizg‘ich, 2 ta DVD disk, qopqoqlar, bolt-gayka, ruchka qismi, elektr dvigatel, yorug‘lik diodi, termoyelim, kavsharlagich, karton, rezina halqa.</p><p><b>Yig‘ish:</b> chizg‘ichni brusokka mahkamlang, ikki diskni karton disk orasiga yelimlab, bolt bilan chizg‘ichga mahkamlang; ikkinchi tomonga dvigatelni o‘rnating, diodni dvigatel qutblariga ulang, rezina halqani dvigatel shkifi va karton disk ustiga kiydiring.</p><div class=f>E<sub>kin</sub> = Iω²/2   (aylanayotgan disk energiyasi)</div>`,'flw'],
['Mexanik energiya → elektr energiya → yorug‘lik',`<p>Bolt ustidagi ushlagichdan diskni aylantiring. Disk rezina halqa orqali dvigatel valini aylantiradi; dvigatel <b>generator</b> vazifasini bajarib elektr toki hosil qiladi va yorug‘lik diodi yonadi. Disklar qanchalik tez aylansa, diod shunchalik yorqin yonadi.</p><p>Kuzatilgan energiya zanjiri: mexanik → elektr → yorug‘lik (va qisman issiqlik).</p>`,'gen'],
['Energiyaning saqlanish va aylanish qonuni',`<p><b>Xulosa.</b> Energiya yo‘qolmaydi va yo‘qdan paydo bo‘lmaydi, faqat bir turdan boshqa turga aylanadi. Mexanik energiyaning bir qismi ishqalanish tufayli issiqlikka o‘tadi:</p><div class=f>E<sub>mex</sub> = E<sub>el</sub> + Q</div><div class=f>η = E<sub>el</sub>/E<sub>mex</sub>·100%</div><p>Energiyaning bir turdan boshqasiga o‘tishiga boshqa misollar: quyosh batareyasi (yorug‘lik → elektr), batareya (kimyoviy → elektr), elektr plita (elektr → issiqlik).</p>`,'flo']]},
31:{s:[
['Energiya va ish masalasi (kitob namunasi)',`<p><b>Masala.</b> m = 10 g sharcha potensiali 100 V bo‘lgan A nuqtadan potensiali 0 bo‘lgan B nuqtaga ko‘chiriladi. q = 10 nC, v<sub>A</sub> = 2 sm/s. v<sub>B</sub> = ?</p><div class=f>A = q(φ<sub>A</sub> − φ<sub>B</sub>) = 10⁻⁸·100 = 10⁻⁶ J;   A = ΔE<sub>k</sub> = m v<sub>B</sub>²/2 − m v<sub>A</sub>²/2</div><div class=f>v<sub>B</sub> = √(v<sub>A</sub>² + 2A/m) = √(4·10⁻⁴ + 2·10⁻⁴) ≈ 2,45·10⁻² m/s</div>`,'ke'],
['Potensial va potensiallar farqi masalasi',`<p>q = 10 nC zaryaddan r₁ = 0,2 m va r₂ = 0,6 m masofalarda φ₁, φ₂, Δφ va q₀ = 1 nC ni ko‘chirishdagi A = ?</p><div class=f>φ₁ = kq/r₁ = 450 V;  φ₂ = 150 V;  Δφ = 300 V;  A = q₀Δφ = 0,3 µJ</div>`,'eqp'],
['Kondensator energiyasi masalasi',`<p>C = 10 µF, U = 100 V. q va W = ?</p><div class=f>q = CU = 10⁻³ C = 1000 µC;   W = CU²/2 = 0,05 J</div>`,'cap']]},
32:{s:[
['Tok kuchi va uning birligi',`<p>Elektr toki — zaryadli zarralarning tartibli harakati. Zaryad tashuvchilar: metallarda erkin elektronlar, elektrolitlarda ionlar, gazlarda elektron va ionlar, yarimo‘tkazgichlarda elektron va kovaklar.</p><p><b>Ta’rif.</b> O‘tkazgich ko‘ndalang kesimidan birlik vaqtda oqib o‘tgan zaryad miqdoriga son jihatdan teng kattalik <b>tok kuchi</b> deyiladi (skalyar, birligi — amper).</p><div class=f>I = q/t;   1 A = 1 C/s</div><p>Tok yo‘nalishi sifatida musbat zarralar harakati yo‘nalishi olinadi (elektronlarga teskari). Tok o‘zgaruvchan bo‘lsa (chiziqli): I<sub>o‘rt</sub> = (I + I₀)/2, q = I<sub>o‘rt</sub>·t.</p><p>Tok ta’sirlari: issiqlik, kimyoviy (faqat elektrolitlarda), magnit (har qanday muhitda).</p>`,'cur'],
['Zaryad tashuvchilarning tartibli harakati va tok zichligi',`<p>Tok kuchi zaryad tashuvchilar konsentratsiyasi n, zaryadi q₀, tartibli harakat tezligi v va kesim yuzi S ga bog‘liq:</p><div class=f>I = n·q₀·v·S</div><p><b>Tok zichligi</b> — kesim yuzi birligiga to‘g‘ri keladigan tok kuchi (birligi A/m²):</p><div class=f>j = I/S = n·q₀·v</div><p>Metallarda tartibli harakat tezligi juda kichik (mm/s tartibida), lekin elektr maydon deyarli yorug‘lik tezligida tarqaladi.</p>`,'drf'],
['Sanoatda va texnikada tok zichligining ahamiyati',`<p>Tok kuchi bir xil bo‘lsa, ingichka o‘tkazgichda tok zichligi katta bo‘ladi va u kuchliroq qiziydi. Shuning uchun simlar uchun tok zichligining <b>ruxsat etilgan qiymati</b> belgilanadi (kesim yuzini tanlashda hisobga olinadi).</p><div class=f>S = I/j<sub>ruxsat</sub></div><p>Texnikada tok zichligi: elektr simlari, saqlagichlar, payvandlash, elektroliz jarayonlarida muhim.</p>`,'jd']]}});

29:`W = qφ|W = q/φ|W = qφ/2|W = φ/q|3\nW =|Cφ²|C²φ/2|Cφ²/2|φ²/C|3\nKondensator energiyasi W =|q²/2C|q²C/2|2q²/C|qC/2|1\nC = 10 µF, U = 100 V bo‘lsa W =|0,5 J|0,005 J|0,05 J|5 J|3\nYassi kondensator sig‘imi C =|ε₀εd/S|εS/ε₀d|ε₀S/εd|ε₀εS/d|4\nEnergiya zichligi ω =|ε₀εE²/2|ε₀εE/2|ε₀E²/ε|εE²/ε₀|1\nω birligi:|J·m³|J/m³|J/m|J|2\nMaydon energiyasi mujassamlangan:|maydonda (qoplamalar orasida)|faqat qoplamada|simda|yo‘q|1\nE 2 marta ortsa ω:|2 marta ortadi|4 marta ortadi|o‘zgarmaydi|2 marta kamayadi|2\nW = ωV da V =|S/d|d/S|S·d|S + d|3`.split('\n'),

sc:{n:'qisqa tutashuv: I = ε/r',p:[['EYuK ε (V)','e',1,12,6],['Ichki qarshilik r (Ω)','r',.1,3,.5,.1]],d(c,P,t,Ac){const f=R=>P.e/(R+P.r),Iq=P.e/P.r,X=R=>40+R*56,Y=I=>270-220*I/Iq,Rm=10*(1-(t%6)/6);c.beginPath();c.moveTo(40,30);c.lineTo(40,270);c.lineTo(610,270);c.stroke();c.strokeStyle='#22d3ee';c.beginPath();for(let R=0;R<=10;R+=.1)R?c.lineTo(X(R),Y(f(R))):c.moveTo(X(R),Y(f(R)));c.stroke();c.fillStyle=Ac;c.beginPath();c.arc(X(Rm),Y(f(Rm)),7,0,7);c.fill();return `R = ${Rm.toFixed(2)} Ω → I = ε/(R + r) = ${f(Rm).toFixed(2)} A<br>R = 0 (qisqa tutashuv): I_q = ε/r = ${Iq.toFixed(1)} A — manba bera oladigan eng katta tok`}},

rt:{n:'qarshilikning temperaturaga bog‘liqligi',p:[['α (10⁻³ °C⁻¹): nixrom 0,2 · mis 3,9 · temir 6,2','a',.2,6.5,3.9,.1],['R₀ (0 °C da), Ω','R',10,100,30,10]],d(c,P,t,Ac){const a=P.a*1e-3,f=T=>P.R*(1+a*T),X=T=>40+T*2.7,Y=r=>270-200*(r-P.R*.8)/(P.R*1.6),Tm=(t%6)/6*200;c.beginPath();c.moveTo(40,30);c.lineTo(40,270);c.lineTo(610,270);c.stroke();c.strokeStyle='#22d3ee';c.beginPath();c.moveTo(X(0),Y(f(0)));c.lineTo(X(200),Y(f(200)));c.stroke();c.fillStyle=Ac;c.beginPath();c.arc(X(Tm),Y(f(Tm)),7,0,7);c.fill();return `R = R₀(1 + αΔt): t = ${Tm.toFixed(0)} °C → R = ${f(Tm).toFixed(2)} Ω (R₀ = ${P.R} Ω)<br>Ko‘pchilik metallar uchun α ≈ 1/273 °C⁻¹`}},
lamp:{n:'lampochka spiralining temperaturasi',p:[['Tok kuchi I (A)','I',.1,1,.6,.05],['R(20 °C) (Ω)','R',10,60,30,5]],d(c,P,t,Ac){const U=220,a=.005,R0=P.R/(1+a*20),R=U/P.I,T=(R/R0-1)/a,b=Math.min(1,T/2800);c.fillStyle='rgba(255,220,60,'+(.2+.8*b)+')';c.beginPath();c.arc(200,130,60,0,7);c.fill();c.strokeStyle='#fbbf24';c.beginPath();c.arc(200,130,60,0,7);c.stroke();c.beginPath();c.moveTo(170,130);for(let i=0;i<8;i++)c.lineTo(170+i*8+4,130+(i%2?10:-10));c.stroke();c.strokeStyle='#e6eaff';c.strokeRect(400,40,30,200);c.fillStyle='#ef4444';const h=Math.min(196,200*T/3000);c.fillRect(402,240-h,26,h);c.fillStyle='#cbd5ff';c.fillText('t, °C',436,60);return `R = U/I = ${R.toFixed(1)} Ω · R₀ = R(20 °C)/(1 + α·20) = ${R0.toFixed(2)} Ω<br>t = (R/R₀ − 1)/α ≈ ${T.toFixed(0)} °C (α = 0,005 °C⁻¹, U = 220 V)`}},
sup2:{n:'o‘ta o‘tkazuvchanlik (simob, T_k = 4,1 K)',p:[['Kritik temperatura T_k (K)','k',1,20,4.1,.1]],d(c,P,t,Ac){const T=10-(t%8)/8*10,f=x=>x<P.k?0:.1+.9*x/10,X=x=>40+x*54,Y=r=>270-220*r;c.beginPath();c.moveTo(40,30);c.lineTo(40,270);c.lineTo(600,270);c.stroke();c.strokeStyle='#22d3ee';c.beginPath();c.moveTo(X(0),Y(0));c.lineTo(X(P.k),Y(0));c.lineTo(X(P.k),Y(f(P.k+.01)));c.lineTo(X(10),Y(f(10)));c.stroke();c.fillStyle=Ac;c.beginPath();c.arc(X(T),Y(f(T)),7,0,7);c.fill();const sc=T<P.k;c.strokeStyle=sc?'#16a34a':'#ef4444';c.beginPath();c.arc(500,100,40,0,7);c.stroke();return `T = ${T.toFixed(1)} K → `+(sc?'R = 0: o‘ta o‘tkazuvchan holat, halqadagi tok so‘nmaydi':'R > 0: oddiy o‘tkazgich')+`<br>Kamerling Onnes (1911): simob T_k ≈ 4,1 K da qarshiligi sakrab nolga tushadi (sxematik grafik)`}}});
Object.assign(X,{
33:{s:[
['Tok manbalari, chet kuchlar va elektr yurituvchi kuch',`<p>Tok manbalarida musbat va manfiy zaryadlar ajratiladi; ular manbaning qutblarida to‘planadi. Zaryadlarni ajratadigan, tabiati elektrostatik kuchlardan farq qiladigan kuchlar <b>chet kuchlar</b> deyiladi. Chet kuchlar tabiati xilma-xil: elektrofor mashinasida mexanik, termoelementda ichki, fotoelementda yorug‘lik, galvanik element va akkumulyatorda kimyoviy energiya elektr energiyaga aylanadi.</p><p><b>Ta’rif.</b> Chet kuchlarning berk zanjir bo‘ylab birlik musbat zaryadni ko‘chirishda bajargan ishiga teng kattalik manbaning <b>elektr yurituvchi kuchi (EYuK)</b> deyiladi:</p><div class=f>ε = A<sub>ch</sub>/q;   1 V = 1 J/1 C</div><p>Zanjir ochiq bo‘lganda EYuK manba qutblaridagi potensiallar farqiga teng.</p>`,'emf'],
['Ichki qarshilik. To‘liq zanjir uchun Om qonuni',`<p>Zanjirning tashqi qismi — iste’molchilar, o‘lchov asboblari, ulovchi simlar (qarshiligi R); ichki qismi — tok manbaining o‘zi (ichki qarshiligi r). Berk zanjirda ε = IR + Ir:</p><div class=f>I = ε/(R + r)</div><p><b>To‘liq zanjir uchun Om qonuni:</b> tok kuchi manba EYuKiga to‘g‘ri, zanjirning to‘la qarshiligiga teskari proporsional. Manba qutblaridagi kuchlanish:</p><div class=f>U = ε − Ir = IR</div>`,'ohm'],
['Tok manbaida qisqa tutashuv',`<p>Tashqi zanjir uzilib, manba qutblari o‘zaro ulansa (R = 0), <b>qisqa tutashuv</b> yuz beradi. Qisqa tutashuv toki — manba bera oladigan eng katta tok:</p><div class=f>I<sub>q.t</sub> = ε/r</div><p>Ichki qarshilik kichik bo‘lgani uchun bu tok juda katta bo‘lib, simlar qizishi va yong‘inga olib kelishi mumkin; shuning uchun saqlagichlar o‘rnatiladi.</p><p><b>Masala namunasi.</b> Manba qisqichlariga avval R₁ = 2 Ω, so‘ng R₂ = 4 Ω ulanganda tok I₁ = 0,5 A, I₂ = 0,3 A. r va ε = ?</p><div class=f>0,5 = ε/(2 + r);  0,3 = ε/(4 + r)  ⟹  r = 1 Ω;  ε = 0,5·(2 + 1) = 1,5 V</div>`,'sc']]},
34:{s:[
['Masalalar: EYuK va ichki qarshilikni topish',`<p><b>1-masala.</b> Tok manbai R₁ = 1,8 Ω tashqi qarshilikka ulanganda I₁ = 0,7 A tok beradi. Tashqi qarshilik R₂ = 2,3 Ω bo‘lganda tok kuchi I₂ = 0,56 A ga kamaydi. Manbaning ε va r ni toping. <span class=mu>(Kitobda I₁ = 1,7 A deb bosilgan, lekin yechimda 0,7 A olingan; 0,7 A to‘g‘ri.)</span></p><p><b>Berilgan:</b> R₁ = 1,8 Ω, I₁ = 0,7 A, R₂ = 2,3 Ω, I₂ = 0,56 A. <b>ε = ?  r = ?</b></p><div class=f>ε = I₁R₁ + I₁r = I₂R₂ + I₂r  ⟹  r = (I₂R₂ − I₁R₁)/(I₁ − I₂)</div><div class=f>r = (0,56·2,3 − 0,7·1,8)/(0,7 − 0,56) = 0,028/0,14 = 0,2 Ω;   ε = I₁(R₁ + r) = 0,7·2 = 1,4 V</div><p><b>Javob:</b> r = 0,2 Ω; ε = 1,4 V.</p><p><b>2-masala.</b> Ichki qarshiligi 2 Ω bo‘lgan tok manbaiga 5 Ω tashqi qarshilik ulanganda manba qisqichlaridagi kuchlanish 10 V gacha pasaydi. ε = ?</p><div class=f>I = U/R = 10/5 = 2 A;   ε = U + Ir = 10 + 2·2 = 14 V</div><p><b>Javob:</b> 14 V.</p><p><b>3-masala.</b> Zanjirning tashqi qarshiligi 1,5 Ω bo‘lganda tok kuchi I ga, 4 Ω bo‘lganda I/2 ga teng bo‘ldi. r = ?</p><div class=f>I(1,5 + r) = (I/2)(4 + r)  ⟹  3 + 2r = 4 + r  ⟹  r = 1 Ω</div><p><b>Javob:</b> 1 Ω.</p>`,'ohm'],
['Masalalar: tok zichligi va tok kuchi',`<p><b>4-masala.</b> Diametri D = 2 mm bo‘lgan o‘tkazgichdan I = 3,14 A tok o‘tmoqda. Tok zichligi j = ? (A/m²)</p><div class=f>S = πD²/4;   j = I/S = 4I/(πD²) = 4·3,14/(3,14·(2·10⁻³)²) = 10⁶ A/m²</div><p><b>Javob:</b> j = 1·10⁶ A/m².</p><p><b>5-masala.</b> Kesim yuzi S = 4 mm² bo‘lgan o‘tkazgichdagi tok kuchi 5 µA. j = ?</p><div class=f>j = I/S = 5·10⁻⁶/(4·10⁻⁶) = 1,25 A/m²</div><p><b>6-masala.</b> Kesim yuzi 10 mm², elektronlar konsentratsiyasi 5·10²⁸ m⁻³, I = 10 A. Elektronlarning o‘rtacha tezligi v = ?</p><div class=f>v = I/(n·e·S) = 10/(5·10²⁸·1,6·10⁻¹⁹·10⁻⁵) = 1,25·10⁻⁴ m/s</div>`,'jd'],
['Masalalar: to‘liq zanjir va qisqa tutashuv',`<p><b>7-masala.</b> ε = 12 V, r = 1 Ω manbaga R = 2 Ω rezistor ulangan. I = ?</p><div class=f>I = ε/(R + r) = 12/3 = 4 A</div><p><b>8-masala.</b> Tashqi qarshilik ichki qarshilikdan 4 marta katta, ε = 12,5 V. Tashqi qarshilikdagi kuchlanish U = ?</p><div class=f>I = ε/(5r);  U = I·4r = 4ε/5 = 10 V</div><p><b>9-masala.</b> ε = 5 V, r = 0,5 Ω akkumulyatorga R = 19,5 Ω lampochka ulangan. Qisqa tutashuv toki?</p><div class=f>I<sub>q.t</sub> = ε/r = 5/0,5 = 10 A</div><p><b>10-masala.</b> r = 0,01 Ω manbaning qisqa tutashuv toki 1200 A. ε = ?</p><div class=f>ε = I<sub>q.t</sub>·r = 1200·0,01 = 12 V</div><p><b>11-masala.</b> ε = 12 V, r = 2 Ω akkumulyatorga R = 4 Ω lampa ulandi. Qutblardagi kuchlanish U = ?</p><div class=f>I = 12/6 = 2 A;   U = IR = 8 V</div><p><b>12-masala.</b> EYuK 3 V, ichki qarshiligi 0,6 Ω bo‘lgan batareya qisqichlari juda kichik qarshilikli o‘tkazgich bilan tutashtirildi. Undan o‘tuvchi tok kuchi?</p><div class=f>I<sub>q.t</sub> = ε/r = 3/0,6 = 5 A</div><p><b>13-masala.</b> Akkumulyatorning ichki qarshiligi 0,2 Ω, EYuK 5 V. Unga ulangan o‘tkazgichdagi kuchlanish tushuvi 4,5 V. O‘tkazgich qarshiligi R = ?</p><div class=f>I = (ε − U)/r = (5 − 4,5)/0,2 = 2,5 A;   R = U/I = 4,5/2,5 = 1,8 Ω</div><p><b>Javob:</b> 1,8 Ω.</p>`,'sc']]},
35:{s:[
['Ishning maqsadi, asboblar va zanjirni yig‘ish',`<p><b>Ishning maqsadi:</b> ampermetr va voltmetr yordamida tok manbaining EYuKi va ichki qarshiligini aniqlash.</p><p><b>Asboblar:</b> laboratoriya universal tok manbai yoki akkumulyator, ampermetr, voltmetr, kalit, ulovchi simlar, 10 Ω va 20 Ω rezistorlar.</p><p><b>1-qadam.</b> Manba, kalit, rezistor va ampermetrni ketma-ket, voltmetrni manba qutblariga parallel ulang. Dastlab 10 Ω rezistorni ulang.</p><div class=f>ε = U<sub>V</sub> (kalit ochiq);   I = ε/(R + r)</div>`,'ohm'],
['Voltmetr va ampermetr ko‘rsatishlarini o‘lchash',`<p><b>2-qadam.</b> Kalit ochiq holda voltmetr ko‘rsatishi U<sub>V</sub> ni yozing; U<sub>V</sub> = ε deb oling.</p><p><b>3-qadam.</b> Kalitni ulab, ampermetr ko‘rsatishi I<sub>A</sub> va voltmetr ko‘rsatishi U₂ ni yozing. Keyin 20 Ω rezistor bilan takrorlang. Slayder bilan rezistorni tanlang:</p><div class=row style='flex-wrap:wrap'><button class=s onclick=le(2)>1. U_V ni yozib olish (kalit ochiq)</button><button onclick=le(1)>2. Kalitni ulash / uzish</button><button class=s onclick=le(3)>3. I_A va U₂ ni yozib olish</button><button onclick=le(4)>4. Jadvalga qo‘shish</button></div>`,'emfl'],
['Hisoblash, jadval va xulosa',`<p><b>5-qadam.</b> Ichki qarshilikni hisoblang:</p><div class=f>r = (ε − U₂)/I</div><p><b>6–7-qadam.</b> 20 Ω rezistor bilan takrorlab, r₁ va r₂ ni solishtiring.</p><p><b>Savollar:</b> zanjirning ichki qismi — manbaning o‘zi, tashqi qismi — iste’molchilar, asboblar va simlar; ichki qarshilik manba ichidagi elektrolit, elektrodlar va zaryad tashuvchilar harakatiga qarshilik tufayli hosil bo‘ladi.</p><div id=elt></div>`,'sc']]},
36:{s:[
['Metall o‘tkazgichlar qarshiligining temperaturaga bog‘liqligi',`<p>Temperatura ortsa, metallarda kristall panjara ionlarining tebranish amplitudasi va ularning erkin elektronlar bilan to‘qnashuvlari soni ortadi; elektronlarning tartibli harakat tezligi kamayadi, qarshilik ortadi. Erkin elektronlar konsentratsiyasi esa deyarli o‘zgarmaydi.</p><p><b>Qarshilikning temperatura koeffitsiyenti</b> α (°C⁻¹):</p><div class=f>α = (ρ − ρ₀)/(ρ₀·(T − T₀))</div><div class=f>ρ = ρ₀(1 + αΔT);   R = R₀(1 + αΔT)</div><p>ρ₀, R₀ — 0 °C (273 K) dagi qiymatlar, ΔT = Δt. Formulalar metallar uchun T > 140 K da o‘rinli; ko‘pchilik metallar uchun α ≈ 1/273 °C⁻¹. α: mis 0,0039; temir 0,0062; volfram 0,0045; nikel 0,0065; nixrom 0,0002 °C⁻¹. Qarshilik termometrlari shu bog‘lanishga asoslangan.</p>`,'rt'],
['Masala namunasi: lampochka spiralining temperaturasi',`<p><b>Masala.</b> Volfram spiralning 20 °C dagi qarshiligi R₁ = 30 Ω. Lampochka U = 220 V ga ulanganda tok I = 0,6 A. Yonish vaqtida spiral temperaturasi? Volfram uchun α = 0,005 °C⁻¹.</p><div class=f>R₀ = R₁/(1 + αt₁) = 30/1,1 ≈ 27 Ω;   R = U/I = 220/0,6 ≈ 367 Ω</div><div class=f>Δt = (R/R₀ − 1)/α = (367 − 27)/(27·0,005) ≈ 2518 °C</div><p>(R₀ ni aniqroq 27,27 Ω olsak, ≈ 2490 °C chiqadi; kitob javobi 2518 °C.)</p>`,'lamp'],
['O‘ta o‘tkazuvchanlik',`<p>Ayrim sof metallarning (Al, Pb, Zn va b.) qarshiligi juda past <b>kritik temperatura</b> T<sub>k</sub> = 0,14–20 K da sakrab nolga tushadi — <b>o‘ta o‘tkazuvchanlik</b>. Uni 1911-yil 28-aprelda G. Kamerling Onnes kashf etdi: simob suyuq geliyda sovitilganda T = 4,1 K da qarshiligi birdan nolga tushdi.</p><p>O‘ta o‘tkazuvchan halqada hosil qilingan tok manba uzilgandan keyin ham so‘nmaydi (Onnes qo‘rg‘oshinda 7 K da tok 4 sutka o‘tib turganini kuzatgan). Amaliy qo‘llashga T_k ning pastligi to‘sqinlik qilmoqda.</p>`,'sup2']]}});

sol:{n:'quyosh paneli (fotoelement)',p:[['Quyosh balandligi h (°)','h',10,90,50,5],['Panel qiyaligi β (°)','b',0,90,30,5]],d(c,P,t,Ac){const r=Math.PI/180,cs=Math.max(0,Math.sin((P.h+P.b)*r)),W=1000*1.6*.2*cs,sx=260+200*Math.cos(P.h*r),sy=230-200*Math.sin(P.h*r);c.save();c.translate(260,230);c.rotate(P.b*r);c.fillStyle='#1e40af';c.fillRect(-90,-6,180,12);c.restore();c.fillStyle='#fbbf24';c.beginPath();c.arc(sx,sy,18,0,7);c.fill();for(let i=0;i<4;i++){const u=(t*.8+i/4)%1,px=sx+(260-sx)*u+(i-1.5)*14*Math.sin(P.h*r),py=sy+(230-sy)*u-(i-1.5)*14*Math.cos(P.h*r);ar(c,px,py,px+(260-sx)*.12,py+(230-sy)*.12,'#fbbf24')}return `cosθ = sin(h + β) = ${cs.toFixed(2)} · P = η·E·S·cosθ = ${W.toFixed(0)} W (E = 1000 W/m², S = 1,6 m², η = 20 %)<br>Panel nurga tik bo‘lganda (h + β = 90°) quvvat eng katta`}},
wnd:{n:'shamol generatori',p:[['Shamol tezligi v (m/s)','v',1,20,8],['Parrak radiusi R (m)','R',1,30,5]],d(c,P,t,Ac){const A=Math.PI*P.R*P.R,Pw=.5*1.2*A*P.v**3,Pe=.35*Pw,th=t*P.v*.6;c.beginPath();c.moveTo(300,260);c.lineTo(310,100);c.stroke();for(let i=0;i<3;i++){const a=th+i*2*Math.PI/3;c.beginPath();c.moveTo(310,100);c.lineTo(310+90*Math.cos(a),100+90*Math.sin(a));c.lineWidth=4;c.stroke();c.lineWidth=2}c.fillStyle=Ac;c.beginPath();c.arc(310,100,8,0,7);c.fill();for(let i=0;i<4;i++){const o=(t*P.v*20+i*40)%100;ar(c,40+o,60+i*40,100+o,60+i*40,'#22d3ee')}c.fillStyle='rgba(255,220,60,'+Math.min(1,Pe/20000)+')';c.beginPath();c.arc(520,180,26,0,7);c.fill();return `Shamol quvvati P = ρAv³/2 = ${(Pw/1000).toFixed(2)} kW (A = πR², ρ = 1,2 kg/m³) · generator (η ≈ 35 %) ≈ ${(Pe/1000).toFixed(2)} kW<br>Quvvat tezlikning kubiga proporsional: v 2 marta ortsa P 8 marta ortadi`}},
ion:{n:'ionli bog‘lanish: Na + Cl → Na⁺Cl⁻',p:[['Atomlar orasidagi masofa r (nm)','r',.2,1,.28,.02]],d(c,P,t,Ac){const cx=320,d=P.r*300,xN=cx-d/2,xC=cx+d/2,tr=P.r<=.5,u=tr?Math.min((t%4)/1.5,1):0;c.fillStyle='#0ea5e9';c.beginPath();c.arc(xN,150,38,0,7);c.fill();c.fillStyle='#16a34a';c.beginPath();c.arc(xC,150,52,0,7);c.fill();c.fillStyle='#fff';c.fillText('Na'+(u>=1?'⁺':''),xN-10,155);c.fillText('Cl'+(u>=1?'⁻':''),xC-10,155);c.fillStyle='#fbbf24';c.beginPath();c.arc(xN+38+(xC-xN-90)*u,150,6,0,7);c.fill();const F=9e9*(1.6e-19)**2/((P.r*1e-9)**2);return (tr?'Na atomi 1 ta tashqi elektronini Cl atomiga beradi: Na → Na⁺ + e⁻, Cl + e⁻ → Cl⁻':'Atomlar uzoq: elektron almashinuvi yuz bermaydi, ikkalasi neytral')+`<br>Ionlar orasidagi Kulon kuchi F = ke²/r² = ${(F*1e9).toFixed(2)} nN → ionli bog‘lanish`}},
dis:{n:'distillangan suv va tuz eritmasi: lampa sinovi',p:[['Suyuqlik: 0 distillangan suv · 1 tuz eritmasi','m',0,1,1],['Tuz miqdori (%)','c',1,20,5]],d(c,P,t,Ac){const n=P.m?Math.round(2+P.c*1.2):0;c.strokeRect(160,90,300,150);c.fillStyle='rgba(56,189,248,.25)';c.fillRect(161,130,298,109);c.fillStyle='#64748b';c.fillRect(200,60,12,140);c.fillRect(410,60,12,140);for(let i=0;i<n;i++){const x=230+((i*53+t*(20+P.c*3))%160),y=150+((i*37)%70)+5*Math.sin(5*t+i);c.fillStyle=i%2?'#0ea5e9':'#16a34a';c.beginPath();c.arc(x,y,i%2?4:6,0,7);c.fill()}const b=P.m?Math.min(1,.2+P.c/20):0;c.fillStyle='rgba(255,220,60,'+b+')';c.beginPath();c.arc(540,110,28,0,7);c.fill();c.strokeStyle='#fbbf24';c.beginPath();c.arc(540,110,28,0,7);c.stroke();return P.m?'Tuz eritmasida ionlar bor (Na⁺, Cl⁻) → tok o‘tadi, lampa yonadi. Tuz ko‘p bo‘lsa, ionlar ko‘p, lampa yorqinroq':'Distillangan suvda erkin ionlar deyarli yo‘q → tok o‘tmaydi, lampa yonmaydi'}},
elc:{n:'elektrolitda tok: anod va katod',p:[['Kuchlanish U (V)','U',1,12,6],['Konsentratsiya (%)','c',1,20,8]],d(c,P,t,Ac){const v=P.U*14;c.strokeRect(120,80,360,160);c.fillStyle='rgba(56,189,248,.25)';c.fillRect(121,120,358,119);c.fillStyle='#ef4444';c.fillRect(150,70,14,150);c.fillStyle='#0ea5e9';c.fillRect(436,70,14,150);c.fillStyle='#cbd5ff';c.fillText('katod (−)',120,64);c.fillText('anod (+)',410,64);for(let i=0;i<12;i++){const y=140+((i*41)%80),a=i%2,x=a?164+((i*70+t*v)%272):436-((i*70+t*v)%272);c.fillStyle=a?'#16a34a':'#0ea5e9';c.beginPath();c.arc(x,y,a?6:4,0,7);c.fill()}return `Na⁺ (ko‘k) katodga, Cl⁻ (yashil) anodga tomon harakatlanadi: tok — ikkala ishorali ionlar oqimi<br>Tok kuchi I ∝ U·konsentratsiya ≈ ${(P.U*P.c/40).toFixed(2)} (nisbiy birlik)`}},
elz:{n:'elektroliz: katodda mis ajralishi',p:[['Tok kuchi I (A)','I',.5,5,2,.5],['Vaqt t (min)','t',1,60,20]],d(c,P,t,Ac){const q=P.I*P.t*60,m=.329e-3*q,g=Math.min(1,(t%6)/5);c.strokeRect(140,80,340,160);c.fillStyle='rgba(56,189,248,.25)';c.fillRect(141,110,338,129);c.fillStyle='#64748b';c.fillRect(190,60,14,150);c.fillRect(416,60,14,150);c.fillStyle='#b45309';c.fillRect(204,110,4+16*g,100);c.fillStyle='#cbd5ff';c.fillText('katod (−)',150,55);c.fillText('anod (+)',390,55);for(let i=0;i<10;i++){const a=i%2,x=a?210+((i*50+t*60)%200):410-((i*50+t*60)%200),y=130+((i*31)%90);c.fillStyle=a?'#16a34a':'#b45309';c.beginPath();c.arc(x,y,a?6:5,0,7);c.fill()}return `Katodda: Cu²⁺ + 2e⁻ → Cu (mis o‘tiradi) · q = It = ${q.toFixed(0)} C<br>Ajralgan mis massasi m = kq = ${m.toFixed(3)} g (k = 0,329 mg/C)`}},
par:{n:'Faradeyning 1-qonuni: m_A = m_B + m_C',p:[['I_B (A)','b',.5,5,1.5,.5],['I_C (A)','c',.5,5,2,.5],['Vaqt t (min)','t',1,60,20]],d(c,P,t,Ac){const k=.329e-3,Ia=P.b+P.c,s=P.t*60,m=I=>k*I*s,M=Math.max(m(Ia),1e-9),g=Math.min(1,t/2);[[Ia,'A',140,'#ef4444'],[P.b,'B',300,'#22d3ee'],[P.c,'C',440,Ac]].forEach(w=>{const h=180*m(w[0])/M*g;c.fillStyle=w[3];c.fillRect(w[2],260-h,70,h);c.fillStyle='#cbd5ff';c.fillText('vanna '+w[1],w[2]+4,280)});return `I_A = I_B + I_C = ${Ia.toFixed(1)} A · m_A = kI_A·t = ${m(Ia).toFixed(3)} g<br>m_B = ${m(P.b).toFixed(3)} g, m_C = ${m(P.c).toFixed(3)} g → m_A = m_B + m_C`}},
far2:{n:'Faradeyning 2-qonuni: k = M/(F·Z)',p:[['Tok kuchi I (A)','I',.5,5,2,.5],['Vaqt t (min)','t',1,60,20]],d(c,P,t,Ac){const F=96500,L=[['Ag',107.9,1,'#e5e7eb'],['Cu',63.5,2,'#b45309'],['Ni',58.7,2,'#94a3b8'],['Zn',65.4,2,'#60a5fa'],['Al',27,3,'#cbd5e1']],q=P.I*P.t*60,g=Math.min(1,t/2),mx=L[0][1]/L[0][2]*q/F;let tx='';L.forEach((e,i)=>{const k=e[1]/(F*e[2]),m=k*q,h=190*m/mx*g;c.fillStyle=e[3];c.fillRect(50+i*110,265-h,70,h);c.fillStyle='#cbd5ff';c.fillText(e[0],70+i*110,282);tx+=e[0]+': k = '+(k*1e3).toFixed(3)+' mg/C, m = '+m.toFixed(3)+' g · '});return `q = ${q.toFixed(0)} C (hamma vannadan bir xil) · m = kq, k = M/(F·Z), F ≈ 96500 C/mol<br>`+tx}}});

37:{s:[
['Qarshilikning temperaturaga bog‘liqligi masalalari (namunalar)',`<p><b>1-masala.</b> Cho‘g‘lanma lampochka volfram tolasining t₁ = 20 °C dagi qarshiligi R₁ = 40 Ω. 0 °C dagi R₀ ni toping. Lampochka U = 120 V ga ulanganda tolada I = 0,3 A tok o‘tsa, qizigan tolaning R₂ qarshiligi va t₂ temperaturasi? α = 4,6·10⁻³ °C⁻¹.</p><p><b>Berilgan:</b> t₁ = 20 °C, R₁ = 40 Ω, U = 120 V, I = 0,3 A, α = 4,6·10⁻³ °C⁻¹. <b>R₀, R₂, t₂ = ?</b></p><div class=f>R₀ = R₁/(1 + αt₁) = 40/1,092 = 36,63 Ω;   R₂ = U/I = 120/0,3 = 400 Ω</div><div class=f>t₂ = (R₂ − R₀)/(R₀α) = (400 − 36,63)/(36,63·4,6·10⁻³) ≈ 2157 °C</div><p><b>Javob:</b> R₀ = 36,63 Ω, R₂ = 400 Ω, t₂ ≈ 2157 °C.</p><p><b>2-masala.</b> Volfram tolaning 20 °C dagi qarshiligi 35,8 Ω. Lampochka 120 V tarmoqqa ulanganda toladan 0,33 A tok o‘tadi. Tola temperaturasi? (α = 4,6·10⁻³ °C⁻¹)</p><div class=f>R₀ = 35,8/1,092 = 32,78 Ω;  R = 120/0,33 = 363,6 Ω;  t = (R/R₀ − 1)/α ≈ 2194 °C</div><p><span class=mu>Kitobda javob 1935 °C deb berilgan; formula bo‘yicha mening hisobim ≈ 2194 °C chiqdi.</span></p>`,'lamp'],
['Mashqlar (30-mashq) — shartlari va yechimlari',`<p><b>1.</b> Volfram tolaning 0 °C dagi qarshiligi 300 Ω, yonganda 2400 Ω. α = 0,005 °C⁻¹. t = ?</p><div class=f>t = (R/R₀ − 1)/α = (8 − 1)/0,005 = 1400 °C</div><p><b>2.</b> Temir reostat 0 °C da R₀ = 200 Ω, milliampermetr r = 20 Ω, I₀ = 30 mA, α = 6·10⁻³ °C⁻¹. Reostat 50 °C ga qizdirilsa, I = ? (manbaning ichki qarshiligi hisobga olinmaydi)</p><div class=f>ε = I₀(R₀ + r) = 6,6 V;  R = 200(1 + 0,3) = 260 Ω;  I = ε/(R + r) = 6,6/280 ≈ 23,6 mA</div><p><b>3.</b> Mis g‘altak chulg‘ami 14 °C da 10 Ω, tokka ulangach 12,2 Ω. α = 4,15·10⁻³ °C⁻¹. t = ?</p><div class=f>R₀ = 10/(1 + 0,0581) = 9,45 Ω;  t = (12,2/9,45 − 1)/0,00415 ≈ 70 °C</div><p><b>4.</b> Lampa balloni: 220 V, 100 W. Sovuq (0 °C) tolaga 2 V berilganda tok 54 mA. α = 4,8·10⁻³ °C⁻¹. Cho‘g‘lanish temperaturasi?</p><div class=f>R₀ = 2/0,054 = 37,0 Ω;  R = U²/P = 484 Ω;  t = (R/R₀ − 1)/α ≈ 2514 °C</div><p><b>5.</b> Platina simning 20 °C da qarshiligi 20 Ω, 500 °C da 59 Ω. α = ?</p><div class=f>(1 + 500α)/(1 + 20α) = 59/20  ⟹  α ≈ 4,4·10⁻³ °C⁻¹</div>`,'rt'],
['O‘ta o‘tkazuvchanlik va qarshilik termometri',`<p>Masalalarda R = R₀(1 + αΔt) formulasi 140 K dan yuqori temperaturalarda qo‘llanadi; T_k dan pastda qarshilik nolga teng. Qarshilik termometrlari (platina, mis) temperaturani qarshilik o‘zgarishi bo‘yicha 0,003 K gacha aniqlikda o‘lchaydi:</p><div class=f>t = (R/R₀ − 1)/α</div>`,'sup2']]},
38:{s:[
['Ionli bog‘lanish',`<p>Natriy (Na) atomida 11 ta elektron bor, tashqi qobiqda 1 tasi; xlor (Cl) atomida 17 ta elektron, tashqi qobiqda 7 tasi. Atomlar yaqinlashganda Cl atomi Na atomidan 1 ta elektronni tortib oladi: Na → Na⁺ + e⁻, Cl + e⁻ → Cl⁻. Qarama-qarshi zaryadli ionlar Kulon kuchi ta’sirida tortishib, NaCl kristall panjarasini hosil qiladi:</p><div class=f>2Na + Cl₂ = 2NaCl</div><p>Ionlar orasidagi Kulon kuchi tufayli vujudga keladigan kimyoviy bog‘lanish <b>ionli bog‘lanish</b> deyiladi (tuzlar, ishqorlar, kislotalar).</p>`,'ion'],
['Elektrolitlar va elektrolitik dissotsiatsiya',`<p>Toza (distillangan) suv elektr tokini o‘tkazmaydi; tuz, ishqor, kislotalarning suvdagi eritmasi esa <b>ionli o‘tkazuvchanlik</b> tufayli tokni yaxshi o‘tkazadi. Tuz suvga solinganda suv molekulalari kristall panjara sirtidagi ionlarni o‘rab oladi, ular orasidagi Kulon tortishish kuchi (ε = 81 marta) kamayadi va ionlar ajralib eritmaga o‘tadi.</p><p>Ionlarga <b>dissotsiatsiyalanishi</b> natijasida o‘zidan tok o‘tkazadigan ishqor, kislota, tuz va boshqa birikmalarning eritmalari <b>elektrolitlar</b> deyiladi.</p><div class=f>NaCl → Na⁺ + Cl⁻;   F = ke²/(εr²)</div>`,'dis'],
['Elektrolitda elektr toki',`<p>Elektrolitga ikkita elektrod tushirilib, manbaga ulanadi: manbaning musbat qutbiga ulangan elektrod — <b>anod</b>, manfiy qutbiga ulangani — <b>katod</b>. Musbat ionlar (kationlar) katodga, manfiy ionlar (anionlar) anodga tomon tartibli harakatlanadi. Elektrolitda tokni <b>ikkala ishorali ionlar</b> tashiydi.</p><p>Ionli o‘tkazuvchanlikda modda ko‘chadi (elektrodlarda ajraladi); metallardagi elektronli o‘tkazuvchanlikda esa modda ko‘chmaydi.</p>`,'elc']]},
39:{s:[
['Elektroliz hodisasi',`<p>Elektrolitdan tok o‘tganda elektrodlarda modda ajralib chiqish hodisasi <b>elektroliz</b> deyiladi. CuSO₄ eritmasida Cu²⁺ va SO₄²⁻ ionlari hosil bo‘ladi. Katodda: Cu²⁺ + 2e⁻ → Cu (mis katodga o‘tiradi); anodda suv molekulalari parchalanib kislorod ajraladi.</p><div class=f>Cu²⁺ + 2e⁻ → Cu</div><p>Elektroliz yordamida aralashmalardan toza modda (metall yoki gaz) ajratib olish mumkin.</p>`,'elz'],
['Faradeyning birinchi qonuni',`<p>Elektrodda ajralgan modda massasi elektrolitdan o‘tgan zaryad miqdoriga to‘g‘ri proporsional:</p><div class=f>m = k·q = k·I·Δt</div><p>k — <b>elektrokimyoviy ekvivalent</b>, [k] = kg/C: elektrolitdan 1 C zaryad o‘tganda ajralgan modda massasi. k (mg/C): kumush 1,118; xlor 0,367; mis 0,329; nikel 0,304; alyuminiy 0,094.</p><p>Tekshirish: uchta vanna parallel ulansa, I_A = I_B + I_C, shuning uchun m_A = m_B + m_C.</p>`,'par'],
['Faradeyning ikkinchi qonuni',`<p>Moddaning elektrokimyoviy ekvivalenti uning <b>kimyoviy ekvivalenti</b> M/Z ga to‘g‘ri proporsional (M — molyar massa, Z — valentlik):</p><div class=f>k = (1/F)·(M/Z)</div><div class=f>m = (1/F)·(M/Z)·I·Δt,   F ≈ 96500 C/mol</div><p>F — <b>Faradey doimiysi</b> (barcha moddalar uchun bir xil). Ketma-ket ulangan vannalardan bir xil zaryad o‘tadi, lekin massalar M/Z ga proporsional bo‘ladi.</p>`,'far2']]}});

['Quyosh energiyasi',`<p><b>Maqsad:</b> muqobil (noan’anaviy) energiya manbalarini o‘rganish: Quyosh, shamol, geliotermal, vodorod va boshqalar.</p><p><b>Quyosh energiyasi</b> — Quyoshdagi yadro reaksiyalari tufayli hosil bo‘ladigan nurlanish energiyasi. Undan elektr va issiqlik energiyasi olish usullari:</p><ul><li>fotoelement (quyosh paneli) yordamida elektr energiyasi olish;</li><li>geliotermal energiya — quyosh nuri ta’sirida sirtning isishi;</li><li>“quyosh yelkanlari” — havosiz bo‘shliqda nurning kinetik energiyaga aylanishi;</li><li>quyosh aerostat elektrostansiyasi.</li></ul><div class=f>P = η·E·S·cosθ</div>`,'sol'],
['Shamol energiyasi',`<p><b>Shamol energiyasi</b> — havo massasining harakati tufayli hosil bo‘ladigan energiya. Shamol ta’sirida aylangan parraklar val orqali harakatni elektr generatoriga uzatadi va elektr energiyasi ishlab chiqariladi.</p><div class=f>P = ρAv³/2,   A = πR²</div><p>Quvvat shamol tezligining kubiga va parrak yuziga proporsional.</p>`,'wnd'],
['Amaliy ish: shamol generatori modelini yasash',`<p><b>Jihozlar:</b> konserva yoki plastik idish, elektr dvigatel, yog‘och chizg‘ich, penoplast taglik, ulovchi simlar, soch quritkich (fen), elektr lampochka, termoyelim, qaychi, kavsharlagich.</p><ol><li>Idishdan uch yoki to‘rt parrakli aylanish qismini qaychi bilan yasang.</li><li>Elektr dvigatelni chizg‘ichga yelimlang.</li><li>Parrakni dvigatel o‘qiga yelimlang.</li><li>Chizg‘ichni penoplast taglikka tik holda mahkamlang. Dvigatel simlariga lampochkani ulab, fen bilan shamol hosil qiling.</li></ol><p>Mexanik energiya dvigatelda (generator vazifasida) elektr energiyaga, so‘ng yorug‘likka aylanadi. Natijani taqdim eting.</p>`,'gen']]};

gst:{n:'galvanostegiya: kumush bilan qoplash',p:[['Tok I (A)','I',.5,10,3,.5],['Vaqt t (min)','t',1,120,30],['Yuza S (sm²)','S',10,100,25,5]],d(c,P,t,Ac){const m=1.118e-6*P.I*P.t*60,dd=m/(10.5e3*P.S*1e-4),g=Math.min(1,(t%6)/5),L=Math.min(14,dd*1e6*.4)*g;c.strokeRect(120,60,380,180);c.fillStyle='rgba(56,189,248,.2)';c.fillRect(121,90,378,149);c.fillStyle='#64748b';c.fillRect(250,70,90,150);c.fillStyle='#e5e7eb';c.fillRect(250-L,70,L,150);c.fillRect(340,70,L,150);c.fillRect(135,100,10,120);c.fillStyle='#cbd5ff';c.fillText('buyum = katod (−)',230,255);c.fillText('Ag anod (+)',130,92);return `m = kIt = ${(m*1e3).toFixed(2)} g · qatlam qalinligi d = m/(ρS) = ${(dd*1e6).toFixed(1)} µm (k = 1,118 mg/C, ρ = 10,5·10³ kg/m³)`}},
ref:{n:'misni elektrolitik tozalash',p:[['Tok I (A)','I',1,20,8],['Vaqt t (soat)','t',1,10,3]],d(c,P,t,Ac){const m=.329e-6*P.I*P.t*3600,g=Math.min(1,(t%6)/5),w=Math.min(30,m*1e3*.6)*g;c.strokeRect(100,80,420,170);c.fillStyle='rgba(56,189,248,.2)';c.fillRect(101,110,418,139);c.fillStyle='#b45309';c.fillRect(160,100,40-w*.5,130);c.fillStyle='#fcd34d';c.fillRect(410,100,20+w*.5,130);c.fillStyle='#78350f';c.fillRect(160,236,60,6);c.fillStyle='#cbd5ff';c.fillText('anod (tozalanmagan Cu): yupqalashadi',110,72);c.fillText('katod (sof Cu): qalinlashadi',330,72);for(let i=0;i<8;i++){const x=205+((i*45+t*50)%200);c.fillStyle='#b45309';c.beginPath();c.arc(x,140+(i*13)%80,4,0,7);c.fill()}return `Anoddan Cu → Cu²⁺ eriydi, katodda Cu²⁺ + 2e⁻ → Cu o‘tiradi · m = kIt = ${(m*1e3).toFixed(1)} g<br>Aralashmalar vanna tubiga cho‘kadi (shlam)`}},
glp:{n:'galvanoplastika: naqshdan nusxa olish',p:[['Vaqt t (min)','t',1,60,30]],d(c,P,t,Ac){const g=Math.min(1,(t%6)/5),th=3+P.t*.35*g;c.fillStyle='#8b5a2b';c.fillRect(120,200,380,40);for(let i=0;i<6;i++)c.fillRect(150+i*55,180,25,20);c.fillStyle='#b45309';c.beginPath();c.moveTo(120,200-th);for(let x=120;x<=500;x+=5){const bump=(((x-150)%55+55)%55)<25&&x>=150&&x<=450?20:0;c.lineTo(x,200-bump-th)}c.lineTo(500,200);c.lineTo(120,200);c.closePath();c.fill();c.fillStyle='#cbd5ff';c.fillText('grafit surtilgan naqsh (katod −)',130,255);c.fillText('anod: mis plastinka (+)',130,70);return `Mis qatlami qalinligi ≈ ${th.toFixed(1)} birlik: ${th<8?'o‘sib bormoqda':'yetarli'} · qatlam naqshning negativi (chuqur ↔ qavariq) bo‘ladi`}},
gaz:{n:'qizdirilgan havo tokni o‘tkazadi',p:[['Havo harorati (°C)','T',20,1500,20,20]],d(c,P,t,Ac){const k=Math.max(0,(P.T-100)/1400)*1.2,q=Math.exp(-k*t);c.fillRect(160,100,300,6);c.fillRect(160,200,300,6);const n=Math.round(10*q);for(let i=0;i<n;i++){c.fillStyle='#ef4444';c.fillText('+',175+i*28,94);c.fillStyle='#0ea5e9';c.fillText('−',175+i*28,222)}if(P.T>100)for(let i=0;i<Math.round((P.T-100)/60);i++){const x=170+((i*47)%280),y=110+((i*83+t*(20+P.T/20))%90);c.fillStyle=i%2?'#0ea5e9':'#ef4444';c.beginPath();c.arc(x,y,3,0,7);c.fill()}c.fillStyle='#fbbf24';c.beginPath();c.moveTo(300,290);c.lineTo(285,260);c.lineTo(300,235);c.lineTo(315,260);c.closePath();c.fill();return P.T<=100?'Oddiy sharoitda quruq havo dielektrik: zaryad saqlanadi (elektrometr strelkasi o‘zgarmaydi)':`Qizdirilgan havo ionlashadi → kondensator zaryadsizlanadi. Qolgan zaryad: ${(q*100).toFixed(0)} %`}},
ion2:{n:'gazning ionlanishi: Ar → Ar⁺ + e⁻',p:[['Zarb bergan elektron energiyasi E (10⁻¹⁸ J)','E',0,4,2.5,.1]],d(c,P,t,Ac){const io=P.E>=2.5,u=(t%4)/4;c.fillStyle=Ac;c.beginPath();c.arc(300,150,30,0,7);c.fill();c.fillStyle='#fbbf24';for(let i=0;i<8;i++){const a=i*Math.PI/4+t;c.beginPath();c.arc(300+55*Math.cos(a),150+55*Math.sin(a),4,0,7);c.fill()}c.fillStyle='#0ea5e9';c.beginPath();c.arc(60+u*(io?560:240),150,6,0,7);c.fill();if(io&&u>.45){c.beginPath();c.arc(300+(u-.45)*500,150-(u-.45)*160,5,0,7);c.fill()}c.fillStyle='#cbd5ff';c.fillText(io?'Ar⁺':'Ar',285,155);return `Ionlashtirish energiyasi ≈ 2,5·10⁻¹⁸ J → U = W/e = ${(2.5e-18/1.6e-19).toFixed(1)} V<br>`+(io?'E yetarli: Ar → Ar⁺ + e⁻ (musbat ion va erkin elektron)':'E yetarli emas: atom neytral qoladi')}},
rzd:{n:'gaz razryadi turlari',p:[['Turi: 0 miltillama · 1 uchqun · 2 toj · 3 yoy','k',0,3,1]],d(c,P,t,Ac){const k=P.k,fl=.5+.5*Math.sin(t*12);c.fillRect(120,140,10,60);c.fillRect(490,140,10,60);if(k==0){c.strokeRect(150,110,320,120);c.fillStyle='rgba(255,100,200,'+(.2+.3*fl)+')';c.fillRect(151,111,318,118)}else if(k==1){if(fl>.5){c.strokeStyle='#fbbf24';c.beginPath();c.moveTo(130,170);for(let i=1;i<12;i++)c.lineTo(130+i*31,170+(((i*37)%5)-2)*14);c.lineTo(490,170);c.stroke()}}else if(k==2){c.fillStyle='rgba(120,160,255,'+(.2+.3*fl)+')';c.beginPath();c.arc(125,140,40,0,7);c.fill();c.fillStyle='#e6eaff';c.beginPath();c.moveTo(125,200);c.lineTo(110,140);c.lineTo(125,120);c.lineTo(140,140);c.closePath();c.fill()}else{c.fillStyle='rgba(255,255,230,'+(.7+.3*fl)+')';c.beginPath();c.ellipse(310,170,170,18,0,0,7);c.fill()}return ['Miltillama: siyraklashgan gaz (~300–400 Pa), nay hajmi porlaydi; reklama chiroqlari','Uchqun: havoda E ≈ 30000 V/sm da chaqnash; chaqmoq, 10⁴ A gacha, 1–20 ms','Toj: o‘tkir uch atrofida E katta; sim, kema machtasi atrofida porlash','Yoy: ko‘mir elektrodlar, 40–50 V; juda yorqin va issiq — payvandlash, projektor'][k]}},
rtt:{n:'metall va yarimo‘tkazgich: tok va temperatura',p:[['Temperatura t (°C)','T',20,300,20,10]],d(c,P,t,Ac){const I1=1/(1+.004*(P.T-20)),I2=Math.exp(.012*(P.T-20)),h=Math.min(230,120*I2);c.fillStyle='#ef4444';c.fillRect(140,260-120*I1,80,120*I1);c.fillStyle='#22d3ee';c.fillRect(340,260-h,80,h);c.fillStyle='#cbd5ff';c.fillText('metall: I kamayadi',130,280);c.fillText('yarimo‘tkazgich: I ortadi',320,280);return `Qizdirilganda metallda tok kamayadi (I = ${I1.toFixed(2)} I₀), yarimo‘tkazgichda ortadi (I = ${I2.toFixed(2)} I₀)<br>Metallda to‘qnashuvlar ortadi; yarimo‘tkazgichda erkin zaryad tashuvchilar soni ortadi`}},
sem:{n:'yarimo‘tkazgichning sezgirligi',p:[['Yoritilganlik (%)','L',0,100,20,10],['Aralashma miqdori (%)','a',0,10,1,.5]],d(c,P,t,Ac){const s=1+.15*P.L+60*P.a,n=Math.round(Math.min(40,12*Math.log(1+s)));c.strokeRect(120,80,380,150);for(let i=0;i<n;i++){const x=130+((i*53+t*30)%360),y=90+((i*37)%130);c.fillStyle=i%2?'#0ea5e9':'#ef4444';c.beginPath();c.arc(x,y,3,0,7);c.fill()}c.fillStyle='#fbbf24';const h=Math.min(200,s*3);c.fillRect(540,260-h,40,h);return `Nisbiy o‘tkazuvchanlik σ/σ₀ ≈ ${s.toFixed(1)}<br>Yorug‘lik, qizdirish va aralashma yarimo‘tkazgich o‘tkazuvchanligini keskin o‘zgartiradi (metallarda deyarli o‘zgarmaydi)`}},
pho:{n:'fotoelement: tok va yoritilganlik',p:[['Yorug‘lik kuchi (%)','L',0,100,50,10],['Rang: 0 qizil · 1 yashil · 2 ko‘k','c',0,2,0]],d(c,P,t,Ac){const col=['#ef4444','#16a34a','#3b82f6'][P.c],rs=[.9,.7,.45][P.c],I=15*P.L/100*rs;c.fillStyle='#fbbf24';c.beginPath();c.arc(90,150,22,0,7);c.fill();c.fillStyle=col;c.globalAlpha=.6;c.fillRect(190,110,16,80);c.globalAlpha=1;for(let i=0;i<4;i++){const o=(t*60+i*35)%90;ar(c,115+o,130+i*14,150+o,130+i*14,col)}c.fillStyle='#1e3a8a';c.fillRect(320,120,100,60);c.strokeStyle='#e6eaff';c.strokeRect(500,60,40,180);c.fillStyle='#fbbf24';c.fillRect(502,238-I*10,36,I*10);return `Fotoelement toki I ≈ ${I.toFixed(1)} mA (yorug‘lik kuchi ${P.L} %, nur rangiga bog‘liq; qiymatlar sxematik)<br>Yoritilganlik ortsa fotoelement toki ortadi`}},
sil:{n:'kremniy: kovalent bog‘lar va erkin elektronlar',p:[['Temperatura T (K)','T',0,600,100,50],['Tashqi elektr maydon E','E',0,1,0]],d(c,P,t,Ac){const n=Math.round(P.T/70);for(let i=0;i<5;i++)for(let j=0;j<4;j++){c.fillStyle=Ac;c.beginPath();c.arc(120+i*80,70+j*60,10,0,7);c.fill();c.strokeStyle='#8b9bd8';if(i<4){c.beginPath();c.moveTo(130+i*80,70+j*60);c.lineTo(190+i*80,70+j*60);c.stroke()}if(j<3){c.beginPath();c.moveTo(120+i*80,80+j*60);c.lineTo(120+i*80,120+j*60);c.stroke()}}for(let k=0;k<n;k++){const x=130+((k*97+t*(25+80*P.E))%400),y=70+((k*61)%180)+6*Math.sin(5*t+k);c.fillStyle='#0ea5e9';c.beginPath();c.arc(x,y,4,0,7);c.fill()}return `Erkin elektronlar: ${n} ta (T = ${P.T} K). Past T da bog‘lar mustahkam: tok yo‘q; T ortsa bog‘lar uziladi → n-tur (elektron) o‘tkazuvchanlik`+(P.E>0?'<br>Tashqi maydonda elektronlar tartibli ko‘chadi → tok':'')}},
hol:{n:'kovak o‘tkazuvchanlik: kovakning ko‘chishi',p:[['Elektr maydon E','E',0,1,.5,.1]],d(c,P,t,Ac){const N=9,k=Math.floor(t*(1+4*P.E))%N;for(let i=0;i<N;i++){const x=80+i*60;c.fillStyle='#8b9bd8';c.beginPath();c.arc(x,150,10,0,7);c.fill();if(i!=k){c.fillStyle='#0ea5e9';c.beginPath();c.arc(x,125,5,0,7);c.fill()}else{c.strokeStyle='#ef4444';c.beginPath();c.arc(x,125,6,0,7);c.stroke();c.fillStyle='#ef4444';c.fillText('+',x-4,110)}}ar(c,80,230,80+60*P.E*6,230,'#fbbf24');return `Kovak — kovalent bog‘lanishdagi bo‘sh joy (q = +1,6·10⁻¹⁹ C). Qo‘shni elektron o‘rniga o‘tadi, kovak esa teskari tomonga ko‘chadi<br>I = I_e + I_k`}},
dop:{n:'aralashmali yarimo‘tkazgichlar (n va p tur)',p:[['Aralashma: 0 sof · 1 donor (P) · 2 akseptor','m',0,2,1],['Aralashma miqdori (%)','a',1,10,5]],d(c,P,t,Ac){const ne=P.m==1?4+P.a*3:P.m==2?2:4,nh=P.m==2?4+P.a*3:P.m==1?2:4;c.strokeRect(100,70,420,160);for(let i=0;i<ne;i++){const x=110+((i*61+t*40)%400),y=80+((i*43)%140);c.fillStyle='#0ea5e9';c.beginPath();c.arc(x,y,4,0,7);c.fill()}for(let i=0;i<nh;i++){const x=510-((i*67+t*25)%400),y=85+((i*59)%135);c.strokeStyle='#ef4444';c.beginPath();c.arc(x,y,5,0,7);c.stroke()}return ['Sof yarimo‘tkazgich: elektronlar va kovaklar teng (xususiy o‘tkazuvchanlik)','Donor aralashma (P, 5 valentli): ortiqcha elektron → erkin elektronlar ko‘p: n-tur','Akseptor aralashma (B, 3 valentli): kovaklar ko‘p: p-tur'][P.m]+`<br>Elektronlar (ko‘k): ${ne} · kovaklar (qizil): ${nh}`}}});
Object.assign(X,{
41:{s:[
['Qoplash masalasi (kumush qoshiq)',`<p><b>1-masala.</b> Sirt yuzi 25 sm² bo‘lgan temir qoshiqni qalinligi 0,08 mm kumush bilan qoplash uchun kumush tuzi eritmasidan qancha zaryad o‘tishi kerak? ρ = 10,5·10³ kg/m³, k = 1,118·10⁻⁶ kg/C.</p><p><b>Berilgan:</b> S = 2,5·10⁻³ m², d = 8·10⁻⁵ m, ρ = 10,5·10³ kg/m³, k = 1,118·10⁻⁶ kg/C. <b>q = ?</b></p><div class=f>m = ρ·V = ρ·S·d;   m = k·q  ⟹  q = ρSd/k</div><div class=f>q = 10,5·10³·2,5·10⁻³·8·10⁻⁵/(1,118·10⁻⁶) ≈ 1878 C</div><p><b>Javob:</b> q ≈ 1878 C.</p>`,'gst'],
['Elektroliz qurilmasining quvvati',`<p><b>2-masala.</b> 42 V ga mo‘ljallangan, foydali quvvati 10 kW elektroliz qurilmasida 2 soatda qancha mis ajraladi? k = 0,329·10⁻⁶ kg/C.</p><p><b>Berilgan:</b> U = 42 V, P = 10⁴ W, t = 7,2·10³ s. <b>m = ?</b></p><div class=f>A = qU = Pt  ⟹  q = Pt/U;   m = kq = kPt/U</div><div class=f>m = 0,329·10⁻⁶·10⁴·7,2·10³/42 ≈ 0,564 kg</div><p><b>Javob:</b> m ≈ 0,564 kg.</p>`,'far2'],
['Mashqlar (32-mashq): shartlari va yechimlari',`<p><b>1.</b> 2 soat davom etgan elektrolizda katodda 20 mg nikel yig‘ilgan. Tok kuchi? (k = 0,304 mg/C)</p><div class=f>I = m/(kt) = 20/(0,304·7200) ≈ 9,1·10⁻³ A ≈ 9 mA</div><p><b>2.</b> 12 V, 6 kW elektroliz qurilmasida 2 soatda qancha kumush? </p><div class=f>q = Pt/U = 6000·7200/12 = 3,6·10⁶ C;  m = kq = 1,118·10⁻⁶·3,6·10⁶ ≈ 4,0 kg</div><p><b>3.</b> Nikellashda 3 soat 5 A tok o‘tganda qatlam qalinligi 0,1 mm. Qoplangan yuza? (ρ = 8900 kg/m³)</p><div class=f>m = kIt = 0,304·10⁻⁶·5·10800 = 0,0164 kg;  S = m/(ρd) = 0,0164/(8900·10⁻⁴) ≈ 0,0185 m² ≈ 185 sm²</div><p><b>4.</b> Ikki valentli nikel bilan qoplash uchun 20 min 15 A. m = ?</p><div class=f>k = M/(FZ) = 58,7·10⁻³/(96500·2) = 3,04·10⁻⁷ kg/C;  m = kIt ≈ 5,5·10⁻³ kg = 5,5 g</div><p><b>5.</b> CuSO₄ elektrolitida mis uchun k = M/(FZ) = 63,5/(96500·2) ≈ 3,29·10⁻⁴ g/C = 0,329 mg/C.</p><p><b>6.</b> 12,5 C zaryad o‘tdi. Katodda mis?</p><div class=f>m = kq = 0,329·10⁻⁶·12,5 ≈ 4,1·10⁻⁶ kg = 4,1 mg</div>`,'elz']]},
42:{s:[
['Mis ajratib olish',`<p>Elektrotexnikada sof mis kerak (aralashmalar o‘tkazuvchanlikni pasaytiradi). Katta vanna mis kuporosi eritmasi bilan to‘ldiriladi. <b>Katod</b> — sof mis yupqa plastinkalar (manbaning manfiy qutbi), <b>anod</b> — tozalanmagan misdan qalin plastinkalar. Vaqt o‘tishi bilan katodlar qalinlashadi, anodlar yupqalashadi: katodda sof mis ajraladi.</p><div class=f>Cu²⁺ + 2e⁻ → Cu;   m = kIt</div><p>Alyuminiy, magniy, natriy, kaliy, kalsiy ham elektroliz bilan olinadi; eng ko‘pi — alyuminiy.</p>`,'ref'],
['Galvanostegiya',`<p>Elektrolizdan foydalanib buyum sirtini qiyin oksidlanadigan metallar (nikel, rux, kumush, oltin) bilan qoplash <b>galvanostegiya</b> deyiladi — zanglashdan himoya qiladi.</p><p>Kumush yugurtirish: elektrolit — kumush tuzi eritmasi, anod — kumush plastinka, buyum — katod. Qatlam massasi va qalinligi:</p><div class=f>m = kIt;   d = m/(ρS)</div>`,'gst'],
['Galvanoplastika',`<p>Elektroliz yordamida murakkab shakldagi buyum va sirtlarning aniq nusxalarini olish <b>galvanoplastika</b> deyiladi. Naqshli taxtaga grafit surtiladi (o‘tkazuvchan bo‘ladi), u manbaning manfiy qutbiga ulanib katod vazifasini bajaradi; anod — mis plastinka. Yetarli qalinlikdagi mis qatlami ajratib olinadi: u naqshning <b>negativi</b> bo‘ladi (chuqur joylar qavariq).</p>`,'glp']]},
43:{s:[
['Gazlarda elektr razryadi',`<p>Gaz orqali tok o‘tishi <b>gaz razryadi</b> deyiladi. Quruq havo xona temperaturasida <b>dielektrik</b>: zaryadlangan kondensator qoplamalari orasidagi havo tokni o‘tkazmaydi. Havo qizdirilsa, kuchli nurlansa yoki elektr maydon ta’sir etsa, gaz o‘tkazuvchan muhitga aylanadi: kondensator zaryadsizlanadi.</p>`,'gaz'],
['Gazlarning ionlanishi',`<p>Qizdirilganda neytral atom yoki molekulalar ionlashadi. Masalan, argon: Ar → Ar⁺ + e⁻ (elektron atomni tark etadi), ba’zi atomlar elektron biriktirib manfiy ion hosil qiladi: Ar + e⁻ → Ar⁻. Elektron va musbat ionning qo‘shilishi <b>rekombinatsiya</b> deyiladi.</p><div class=f>U = W<sub>ion</sub>/e;   W<sub>ion</sub>(Ar) ≈ 2,5·10⁻¹⁸ J → U ≈ 15,6 V</div><p>Tok hosil qilish uchun gazni ionlashtirish va ionlarni tartibli harakatga keltirish (tashqi maydon) kerak. Gazlarda tokni musbat va manfiy ionlar hamda erkin elektronlar tashiydi. Tashqi ionizator to‘xtasa so‘nadigan razryad — <b>nomustaqil</b>, tashqi ionizatorsiz davom etadigani — <b>mustaqil</b> razryad.</p>`,'ion2'],
['Gaz razryadi turlari',`<ul><li><b>Miltillama:</b> siyraklashgan gaz (~300–400 Pa), nay hajmi porlaydi; tok zichligi 1–5 mA/sm²; reklama chiroqlari.</li><li><b>Uchqun:</b> havoda E ≈ 30000 V/sm da chaqnash; chaqmoq (bulutlar orasida kuchlanish 10⁸ V dan ortiq, tok 10⁴ A gacha, 1–20 ms).</li><li><b>Toj:</b> o‘tkir uch atrofida E katta bo‘lganda porlash; sim, kema machtasi, samolyot uchlari.</li><li><b>Yoy:</b> ko‘mir elektrodlar (40–50 V); juda yorqin va issiq — projektor, payvandlash, po‘lat eritish.</li></ul><p><b>Masala.</b> U = 6 kV, E = 3 MV/m da havo teshiladi. d = ?</p><div class=f>d = U/E = 6·10³/(3·10⁶) = 2 mm</div>`,'rzd']]},
44:{s:[
['Yarimo‘tkazgichlarning metallardan farqi',`<p>Yarimo‘tkazgichlarda erkin zaryad tashuvchilar konsentratsiyasi o‘tkazgichlarnikidan juda kichik, dielektriklarnikidan juda katta; o‘tkazuvchanligi ham shunday oraliqda. Asosiy farq: qizdirilganda <b>metallarda qarshilik ortadi</b>, <b>yarimo‘tkazgichlarda kamayadi</b>.</p><p>Tajriba: metall va yarimo‘tkazgichni milliampermetr orqali batareyaga ulab qizdirsak, metallda ko‘rsatish kamayadi, yarimo‘tkazgichda ortadi.</p>`,'rtt'],
['Yarimo‘tkazgichli moddalar va ularning qo‘llanishi',`<p>Qizdirish, yorug‘lik yoki boshqa element atomlarini kiritish yarimo‘tkazgich o‘tkazuvchanligini keskin o‘zgartiradi; metallarda bunday sezgirlik past. Shuning uchun diodlar, tranzistorlar, mikrosxemalar, termorezistorlar, fotoelement, fotorezistorlar, yorug‘lik diodlari yaratilgan.</p><p>Eng ko‘p ishlatiladigan modda — <b>kremniy</b>: Yer qobig‘ining ≈ 27,6 % ini tashkil etadi, zaharli emas, ishlov berish oson. Kompyuter, smartfon, soat, lazer, televizor yarimo‘tkazgichlar asosida ishlaydi.</p>`,'sem'],
['Amaliy topshiriq: fotoelement',`<p><b>Maqsad:</b> yarimo‘tkazgichli fotoelement ishlashini o‘rganish. <b>Jihozlar:</b> fotoelement, milliampermetr, yorug‘lik manbai, rangli shishalar, simlar.</p><ol><li>Fotoelementni milliampermetrga ulang (qutblar mosligiga e’tibor bering).</li><li>Fonarni yoqib fotoelementni yoriting.</li><li>Kuchli va kuchsiz yorug‘likda milliampermetr ko‘rsatishini kuzating.</li><li>Turli rangli nurlar bilan yoriting va natijalarni solishtiring.</li></ol><p>Xulosa: yoritilganlik ortsa tok ortadi; tok nur rangiga ham bog‘liq.</p>`,'pho']]},
45:{s:[
['Elektron o‘tkazuvchanlik',`<p>Kremniyda kovalent bog‘lar kuchli: past temperaturada erkin elektronlar deyarli yo‘q va tok o‘tmaydi. Temperatura ortsa, ayrim bog‘lar uziladi, elektronlar atomdan ajralib butun panjara bo‘ylab erkin harakatlanadi. Tashqi maydonda ularning tartibli ko‘chishi tok hosil qiladi — <b>elektron (n-tur)</b> o‘tkazuvchanlik (lot. negativus).</p>`,'sil'],
['Kovak o‘tkazuvchanlik',`<p>Kovalent bog‘dan elektron chiqib ketsa, <b>kovak</b> (bo‘sh joy) hosil bo‘ladi; u musbat zaryadga ega: q<sub>p</sub> = +1,6·10⁻¹⁹ C. Qo‘shni elektron kelib uni to‘ldiradi, kovak esa teskari tomonga ko‘chadi. Maydonda kovaklar maydon yo‘nalishida ko‘chib tok hosil qiladi (p-tur, lot. positivus).</p><div class=f>I = I<sub>e</sub> + I<sub>k</sub></div>`,'hol'],
['Aralashmali yarimo‘tkazgichlar',`<p>Aralashmasiz (sof) yarimo‘tkazgichning o‘tkazuvchanligi <b>xususiy</b> deyiladi; undagi elektron va kovaklar kam, shuning uchun o‘tkazuvchanligi kichik.</p><p><b>Donor aralashma:</b> kremniyga 5 valentli fosfor (P) kiritilsa, beshinchi elektron bog‘da qatnashmay erkin elektronga aylanadi, P atomi musbat ionga aylanadi (ko‘chmaydi). Erkin elektronlar ko‘payadi — <b>n-tur</b>, qarshilik keskin kamayadi.</p><p><b>Akseptor aralashma:</b> 3 valentli element (masalan bor) kiritilsa, kovaklar ko‘payadi — <b>p-tur</b>.</p>`,'dop']]}});

pn:{n:'p–n o‘tish: to‘g‘ri va teskari ulanish',p:[['Ulanish: 0 teskari · 1 to‘g‘ri','f',0,1,1],['Kuchlanish U (V)','u',0,2,1,.1]],d(c,P,t,Ac){const w=P.f?Math.max(10,70-P.u*30):70+P.u*30,I=P.f?.05*(Math.exp(P.u*2.2)-1):.001*P.u,a=Math.max(20,190-w/2-10),sh=P.f?(t*40)%(w+20):0;c.strokeRect(120,100,400,100);c.fillStyle='rgba(120,160,255,.35)';c.fillRect(320-w/2,101,w,98);for(let i=0;i<9;i++){const yy=110+(i*37)%80;c.strokeStyle='#ef4444';c.beginPath();c.arc(130+(i*43)%a+sh*.3,yy,5,0,7);c.stroke();c.fillStyle='#0ea5e9';c.beginPath();c.arc(510-(i*47)%a-sh*.3,yy+4,4,0,7);c.fill()}c.fillStyle='#cbd5ff';c.fillText('p',130,95);c.fillText('n',505,95);c.fillText('berkituvchi qatlam',270,92);return (P.f?'To‘g‘ri ulanish: qatlam torayadi, qarshilik kamayadi, tok o‘tadi':'Teskari ulanish: qatlam kengayadi, qarshilik ortadi, tok deyarli o‘tmaydi')+`<br>Qatlam kengligi ≈ ${w.toFixed(0)} birlik · I ≈ ${I.toFixed(3)} mA (sxematik)`}},

lhr:{n:'chap qo‘l qoidasi',p:[['B: 0 bizdan (⊗) · 1 bizga (⊙)','b',0,1,0],['Tok: 0 yuqoriga · 1 pastga','i',0,1,0]],d(c,P,t,Ac){const bz=P.b?1:-1,iy=P.i?-1:1,fx=iy*bz;for(let i=0;i<5;i++)for(let j=0;j<3;j++){c.fillStyle='#8b9bd8';c.fillText(P.b?'⊙':'⊗',100+i*110,70+j*90)}c.lineWidth=5;c.strokeStyle=Ac;c.beginPath();c.moveTo(320,40);c.lineTo(320,260);c.stroke();c.lineWidth=2;ar(c,320,150,320,150-iy*70,'#22d3ee');const o=Math.sin(t*3)*6;ar(c,320,150,320+fx*90+fx*o,150,'#ef4444');return `Chap qo‘l qoidasi: B kaftga kirsin, to‘rt barmoq — tok yo‘nalishi, bosh barmoq — Amper kuchi<br>Hozir: kuch ${fx>0?'o‘ngga':'chapga'} yo‘nalgan (ko‘k — tok, qizil — kuch)`}},
frm:{n:'tokli ramkani aylantiruvchi moment',p:[['I (A)','I',1,10,5],['B (T)','B',.1,2,1,.1],['S (sm²)','S',10,200,50,10],['θ (°): normal va B orasida','a',0,180,90,15]],d(c,P,t,Ac){const r=P.a*Math.PI/180,M=P.I*P.B*P.S*1e-4*Math.sin(r);ar(c,140,60,500,60,'#8b9bd8');c.fillStyle='#cbd5ff';c.fillText('B',320,50);c.lineWidth=5;c.strokeStyle=Ac;c.beginPath();c.moveTo(320-90*Math.sin(r),150-90*Math.cos(r));c.lineTo(320+90*Math.sin(r),150+90*Math.cos(r));c.stroke();c.lineWidth=2;ar(c,320,150,320+70*Math.cos(r),150-70*Math.sin(r),'#22d3ee');return `M = I·B·S·sinθ = ${M.toFixed(4)} N·m (θ = ${P.a}°, ko‘k — ramka normali)<br>Ramka tekisligi maydonga parallel (θ = 90°) bo‘lganda M = IBS eng katta`}},
par2:{n:'parallel toklarning o‘zaro ta’siri',p:[['I₁ (A)','a',-20,20,10,2],['I₂ (A)','b',-20,20,10,2],['d (m)','d',.05,1,.3,.05]],d(c,P,t,Ac){const f=2e-7*P.a*P.b/P.d,s=Math.sign(f),g=60+P.d*200,x1=320-g/2,x2=320+g/2;c.lineWidth=5;c.strokeStyle=Ac;c.beginPath();c.moveTo(x1,40);c.lineTo(x1,260);c.moveTo(x2,40);c.lineTo(x2,260);c.stroke();c.lineWidth=2;ar(c,x1-20,150,x1-20,150-(P.a>=0?1:-1)*50,'#22d3ee');ar(c,x2+20,150,x2+20,150-(P.b>=0?1:-1)*50,'#22d3ee');if(s){const L=Math.min(80,Math.abs(f)*3000+15)*(.6+.4*Math.sin(t*4));ar(c,x1,100,x1+s*L,100,'#ef4444');ar(c,x2,100,x2-s*L,100,'#ef4444')}return `F/l = μ₀I₁I₂/(2πd) = ${(f*1e6).toFixed(2)} µN/m — `+(s>0?'bir yo‘nalishdagi toklar tortishadi':s<0?'qarama-qarshi toklar itarishadi':'kuch yo‘q')}},
fmr:{n:'F/l ning masofaga bog‘liqligi',p:[['I₁ (A)','a',1,20,10],['I₂ (A)','b',1,20,10]],d(c,P,t,Ac){const F=d=>2e-7*P.a*P.b/d,m=F(.05),X=d=>40+(d-.05)/.95*560,Y=f=>250-200*f/m,dm=.05+((t%6)/6)*.95;c.beginPath();c.moveTo(40,30);c.lineTo(40,250);c.lineTo(610,250);c.stroke();c.strokeStyle='#22d3ee';c.beginPath();for(let d=.05;d<=1;d+=.01)d>.05?c.lineTo(X(d),Y(F(d))):c.moveTo(X(d),Y(F(d)));c.stroke();c.fillStyle=Ac;c.beginPath();c.arc(X(dm),Y(F(dm)),7,0,7);c.fill();return `d = ${dm.toFixed(2)} m → F/l = μ₀I₁I₂/(2πd) = ${(F(dm)*1e6).toFixed(2)} µN/m<br>F/l ∝ I₁I₂ va ∝ 1/d (giperbola)`}},
amd:{n:'amperning ta’rifi',p:[['Har bir tok I (A)','I',1,20,1],['Uzunlik l (m)','l',1,100,1]],d(c,P,t,Ac){const F=2e-7*P.I*P.I*P.l;c.lineWidth=5;c.strokeStyle=Ac;c.beginPath();c.moveTo(250,40);c.lineTo(250,260);c.moveTo(390,40);c.lineTo(390,260);c.stroke();c.lineWidth=2;ar(c,250,150,262+Math.min(60,F*1e5),150,'#ef4444');ar(c,390,150,378-Math.min(60,F*1e5),150,'#ef4444');c.fillStyle='#cbd5ff';c.fillText('d = 1 m',295,140);return `d = 1 m, I₁ = I₂ = ${P.I} A, l = ${P.l} m: F = 2·10⁻⁷·I²·l = ${(F*1e6).toFixed(2)} µN<br>1 A: orasi 1 m bo‘lgan cheksiz parallel o‘tkazgichlarning har metriga 2·10⁻⁷ N kuch`}}});
Object.assign(X,{
46:{s:[
['Yarimo‘tkazgichlarda p–n o‘tish',`<p>Kristallning bir qismida n-tur, ikkinchi qismida p-tur o‘tkazuvchanlik hosil qilinsa, chegarada elektron-kovak rekombinatsiyasi yuz beradi va tashuvchilari deyarli bo‘lmagan <b>berkituvchi qatlam</b> hosil bo‘ladi. Undagi qo‘zg‘almas ionlar ichki maydon E<sub>ichki</sub> hosil qiladi (n dan p ga).</p><ul><li><b>Teskari ulanish</b> (p — manfiy, n — musbat qutbga): qatlam kengayadi, qarshilik ortadi, tok deyarli o‘tmaydi.</li><li><b>To‘g‘ri ulanish</b> (p — musbat, n — manfiy): qatlam torayadi, qarshilik bir necha o‘n–yuz marta kamayadi, tok o‘tadi.</li></ul><p>p–n o‘tish tokni <b>bir tomonlama</b> o‘tkazadi.</p>`,'pn'],
['Yarimo‘tkazgichli diod',`<p>p–n o‘tishli yarimo‘tkazgichli asbob <b>diod</b> deyiladi: u tokni bir tomonlama o‘tkazadi. Diodda p va n sohalar orasidagi masofa atomlararo masofadek kichik bo‘lishi kerak (masalan, n-Ge ga indiy kavsharlanib p-qatlam hosil qilinadi). Diodlar o‘zgaruvchan tokni to‘g‘rilashda qo‘llanadi.</p>`,'dio'],
['Tranzistor haqida tushuncha. Integral mikrosxemalar',`<p>Ikkita p–n o‘tishli yarimo‘tkazgichli sistema — <b>tranzistor</b>; uch elektrodi: emitter, baza, kollektor. p–n–p strukturada n-qatlam (baza) juda yupqa. Tranzistor elektr signallarini kuchaytiradi, tebranishlar hosil qiladi va boshqaradi.</p><div class=f>I<sub>E</sub> = I<sub>B</sub> + I<sub>K</sub>;   I<sub>K</sub> ≈ β·I<sub>B</sub></div><p><b>Integral mikrosxema</b> — bir kristallda joylashgan ko‘plab diod, tranzistor va boshqa elementlardan iborat kichik qurilma.</p>`,'trn']]},
47:{s:[
['Ishning maqsadi, asboblar va zanjirni yig‘ish',`<p><b>Maqsad:</b> yarimo‘tkazgichli dioddan o‘tuvchi tok kuchining unga qo‘yilgan kuchlanishga bog‘liqligini o‘rganish.</p><p><b>Asboblar:</b> diod (kolodkada), o‘zgarmas tok manbai (36–42 V), kalit, simlar, milliampermetr, reostat, voltmetr.</p><p><b>Zanjir:</b> manba (M), reostat (R), milliampermetr (mA), diod (D), kalit (K) ketma-ket; voltmetr (V) diodga parallel. Dastlab kalit ochiq, reostat surgichi 0 V holatida.</p>`,'pn'],
['Kuchlanish va tokni o‘lchash',`<p><b>3–5-qadam.</b> Kalitni ulab, reostat surgichini surib kuchlanishni asta orttiring; har safar voltmetr va milliampermetr ko‘rsatishlarini yozing. <b>8-qadam:</b> manba qutblarini almashtirib (teskari ulanish) takrorlang. Teskari kuchlanish diod pasportidagi qiymatdan oshmasin.</p><div class=row style='flex-wrap:wrap'><button onclick=ld(1)>1. Kalitni ulash / uzish</button><button class=s onclick=ld(2)>2. Qutblarni almashtirish</button><button onclick=ld(3)>3. Natijani yozib olish</button></div>`,'dlab'],
['Grafik, qarshilik va xulosa',`<p><b>9–10-qadam.</b> I(U) grafigini chizing. Qarshilikni toping:</p><div class=f>R = U/I</div><p><b>Savollar:</b> (1) to‘g‘ri ulanishda grafik to‘g‘ri chiziq emas, chunki p–n o‘tish qarshiligi kuchlanishga qarab o‘zgaradi (berkituvchi qatlam torayadi); (2) teskari yo‘nalishda ham juda kichik tok o‘tadi, chunki asosiy bo‘lmagan zaryad tashuvchilar bor; (3) R<sub>to‘g‘ri</sub> ≪ R<sub>teskari</sub>.</p><div id=dlt></div>`,'vax']]},
48:{s:[
['Magnit maydon induksiyasi. Tokli to‘g‘ri o‘tkazgichning maydoni',`<p>Magnit maydon kuch jihatidan <b>magnit induksiya vektori B</b> bilan tavsiflanadi. B — maydonga tik joylashgan 1 A tokli, 1 m uzunlikdagi o‘tkazgichga ta’sir qiluvchi eng katta kuchga son jihatdan teng. Birligi — tesla (T). B yo‘nalishi — erkin magnit strelkasi shimoliy qutbining ko‘rsatish yo‘nalishi.</p><div class=f>B = F<sub>max</sub>/(I·l);   1 T = 1 N/(A·m)</div><p>Cheksiz uzun to‘g‘ri tokli o‘tkazgichdan d masofada (kuch chiziqlari — aylanalar, yo‘nalishi o‘ng vintli parma qoidasi bilan):</p><div class=f>B = μ₀I/(2πd),   μ₀ = 4π·10⁻⁷ N/A²</div><p>Bir nechta tok maydoni: B = B₁ + B₂ + … (vektor yig‘indi).</p>`,'mgw'],
['Tokli aylana o‘tkazgich markazidagi maydon',`<p>Aylana o‘tkazgich markazida N o‘ramli, R radiusli, I tokli maydon induksiyasi:</p><div class=f>B = μ₀NI/(2R)</div><p>Yo‘nalishi parma qoidasi bilan: parma dastasi tok yo‘nalishida aylansa, parma uchi B yo‘nalishini ko‘rsatadi.</p>`,'mgc'],
['Tokli g‘altak va toroid maydoni',`<p>G‘altakning har bir o‘rami maydon hosil qiladi; ichida maydon bir necha barobar kuchli va kuch chiziqlari parallel (bir jinsli). Uzunligi l, o‘ramlari N, diametri d ≪ l bo‘lgan g‘altak uchun:</p><div class=f>B = μ₀NI/l</div><p>Toroid (halqa shaklidagi g‘altak) uchun, R — o‘rtacha radius:</p><div class=f>B = μ₀NI/(2πR)</div>`,'mgs']]},
49:{s:[
['Amper kuchi',`<p>Magnit maydonning tokli o‘tkazgichga ta’sirini 1820-yilda Amper tajribada aniqlagan. Bir jinsli maydonda l uzunlikdagi tokli o‘tkazgichga ta’sir etuvchi <b>Amper kuchi</b>:</p><div class=f>F = I·l·B·sinα</div><p>α — tok yo‘nalishi va B orasidagi burchak. α = 90° da F eng katta (F<sub>max</sub> = IlB), α = 0° da F = 0. Tok yoki maydon yo‘nalishi o‘zgarsa, kuch teskari tomonga yo‘naladi.</p>`,'amp'],
['Chap qo‘l qoidasi',`<p>Chap qo‘lni shunday joylashtiramiz: B kuch chiziqlari kaftga kirsin, yoyilgan to‘rt barmoq tok yo‘nalishida bo‘lsin; 90° ochilgan bosh barmoq Amper kuchi yo‘nalishini ko‘rsatadi.</p>`,'lhr'],
['Tokli ramkani aylantiruvchi moment. O‘lchash asboblari',`<p>Bir jinsli maydonga kiritilgan tokli ramka tomonlariga qarama-qarshi yo‘nalgan Amper kuchlari ta’sir qiladi va ramka buriladi. Ramka tekisligi maydonga parallel bo‘lganda moment eng katta:</p><div class=f>M = I·B·S;   umumiy holda M = I·B·S·sinθ</div><p>Bu hodisaga magnitoelektrik elektr o‘lchash asboblari (ampermetr, voltmetr) asoslangan: strelka burilish burchagi tok kuchiga proporsional.</p>`,'frm']]},
50:{s:[
['Tokli parallel to‘g‘ri o‘tkazgichlarning ta’sirlashuvi',`<p>Tokli o‘tkazgichlar orasida ham o‘zaro ta’sir kuchlari mavjud, ammo ular elektrostatik kuchlardan tabiatan farq qiladi. Bir xil yo‘nalishdagi toklar <b>tortishadi</b>, qarama-qarshi yo‘nalishdagi toklar <b>itarishadi</b>.</p>`,'par2'],
['Parallel toklarning o‘zaro ta’sir kuchi',`<p>Birinchi tok maydoni ikkinchi o‘tkazgich joyida B₁ = μ₀I₁/(2πd) hosil qiladi; Amper qonuniga ko‘ra F₂ = B₁I₂Δl. Demak, birlik uzunlikka ta’sir kuchi:</p><div class=f>F/Δl = μ₀I₁I₂/(2πd)</div><p>U toklar ko‘paytmasiga to‘g‘ri, masofaga teskari proporsional. F₁ = F₂ (3-qonun).</p><p><b>Masala.</b> I₁ = I₂ = 100 A, d = 0,1 m. F/l = ?</p><div class=f>F/l = 2·10⁻⁷·10⁴/0,1 = 0,02 N/m</div>`,'fmr'],
['Amperning ta’rifi',`<p><b>1 amper:</b> orasi 1 m bo‘lgan cheksiz uzun parallel o‘tkazgichlarning har bir metr uzunligi 2·10⁻⁷ N kuch bilan ta’sirlashsa, ulardan o‘tayotgan tok kuchi 1 A ga teng.</p><div class=f>F/l = μ₀I²/(2π·1 m) = 2·10⁻⁷ N/m   (I = 1 A)</div>`,'amd']]}});

    ['Tokli parallel o‘tkazgichlar',`<p>Tok o‘tayotgan har bir to‘g‘ri o‘tkazgich atrofida magnit maydon hosil bo‘ladi. Ikkinchi o‘tkazgich shu maydonga tushganda unga Amper kuchi ta’sir qiladi. Shu sababli parallel simlar o‘zaro ta’sirlashadi.</p><ul><li><b>Toklar bir xil yo‘nalishda:</b> simlar bir-birini tortadi.</li><li><b>Toklar qarama-qarshi yo‘nalishda:</b> simlar bir-birini itaradi.</li></ul><p>3D modelda ko‘k oqimlar tok yo‘nalishini, pushti strelkalar esa o‘zaro ta’sir kuchlarini ko‘rsatadi.</p>`],
    ['Parallel toklarning o‘zaro ta’sir kuchi',`<p>Birinchi sim hosil qilgan magnit induksiya ikkinchi sim joyida:</p><div class=f>B₁ = μ₀I₁/(2πd)</div><p>Amper kuchi F = B₁I₂l dan birlik uzunlikka kuch kelib chiqadi:</p><div class=f>F/l = μ₀|I₁I₂|/(2πd)</div><p>Bu yerda μ₀ = 4π·10⁻⁷ N/A², I₁ va I₂ — tok kuchlari, d — simlar orasidagi masofa. Kuch toklar ko‘paytmasiga to‘g‘ri, masofaga teskari proporsional.</p><p><b>Misol:</b> I₁ = I₂ = 100 A, d = 0,1 m bo‘lsa, F/l = 0,02 N/m.</p>`],
    ['Amper ta’rifi va xulosa',`<p>Klassik ta’rifga ko‘ra, vakuumda bir-biridan 1 m masofada joylashgan cheksiz uzun, juda ingichka parallel o‘tkazgichlarning har bir metrida 2·10⁻⁷ N kuch hosil qiladigan tok 1 A deb ta’riflangan.</p><div class=f>I₁ = I₂ = 1 A, d = 1 m → F/l = 2·10⁻⁷ N/m</div><p><b>Xulosa:</b> tok yo‘nalishi kuchning yo‘nalishini, tok kuchi va simlar oralig‘i esa ta’sir kuchining kattaligini belgilaydi.</p>`]
  ];
  const questions=[
