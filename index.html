<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fizika 10-sinf</title><style>
:root{--bg:#f3f5ff;--c:#fff;--tx:#14183a;--mu:#5a6192;--ac:#6d4aff;--bd:#d3d9fb;--in:#eef0ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0e2a;--c:#141b4d;--tx:#e8ebff;--mu:#a9b2e8;--ac:#9b82ff;--bd:#2f3a82;--in:#0b1030}}
:root[data-theme=dark]{--bg:#0a0e2a;--c:#141b4d;--tx:#e8ebff;--mu:#a9b2e8;--ac:#9b82ff;--bd:#2f3a82;--in:#0b1030}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,"Segoe UI",sans-serif}
#app{max-width:760px;margin:0 auto;padding:14px}
h1{margin:.2em 0;font-size:1.7rem}h2{margin:.3em 0}.mu{color:var(--mu)}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.f{font:1.15rem Cambria,Georgia,serif;background:var(--in);border-left:4px solid var(--ac);padding:8px 12px;border-radius:6px;overflow-x:auto}
.bar{height:8px;background:var(--in);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
input{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px;font:inherit;margin:4px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:9px 13px;font:inherit;cursor:pointer}
button.s{background:var(--in);color:var(--tx);border:1px solid var(--bd)}
.t{display:block;width:100%;text-align:left;background:var(--c);color:var(--tx);border:1px solid var(--bd);border-left-width:5px;margin:5px 0}
.t.d{opacity:.6}.tag{font-weight:700;letter-spacing:.04em;font-size:.85rem}
.row{display:flex;gap:8px;margin:10px 0}.row>*{flex:1}.out{margin-top:8px;font-weight:700;overflow-x:auto}
</style><style>
html:root:root{--bg:#070a1f;--c:#111a45;--tx:#e6eaff;--mu:#a9b4e8;--ac:#8b5cf6;--bd:#3b4690;--in:#0b1030;--cy:#22d3ee;--am:#fbbf24}
body{background:radial-gradient(1200px 600px at 80% -10%,#2a1b6e55,transparent),#070a1f;font-size:clamp(16px,.5vw + 12px,24px)}
#app{max-width:1280px;padding:10px 14px}
.card{background:linear-gradient(160deg,#111a45,#1a2466);border-radius:14px}
h1{font-size:clamp(1.6rem,3vw,2.6rem);margin:.2em 0}h2,h3,.card h3{color:var(--am)}
.hero{text-align:center;padding:22px 8px}.hero .tag{letter-spacing:.08em;color:var(--cy)}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;background:#070a1fee;padding:8px 0;border-bottom:1px solid #2c3566}.nav button{flex:1 1 auto}
.f{border-left-color:var(--am)}
canvas{background:#050824!important;border:1px solid #2c3566}
@media(min-width:1000px){.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}.side{position:sticky;top:64px}#lst{columns:2;column-gap:24px}.t{break-inside:avoid}}

@media(pointer:coarse){button{min-height:46px}input[type=range]{height:34px}}
.cols{display:block!important}.side{position:static!important}#app{max-width:980px}#lst{columns:1!important}</style>
<style>
/* Qo‘shimcha: 3D ko‘rinish va mavzu almashtirgich */
:root[data-theme="light"]{--bg:#f4f7ff;--c:#ffffff;--tx:#18203d;--mu:#5e6888;--ac:#6045d8;--bd:#d7def2;--in:#edf1ff;--cy:#0891b2;--am:#b45309}
:root[data-theme="dark"]{--bg:#070a1f;--c:#111a45;--tx:#e6eaff;--mu:#a9b4e8;--ac:#8b5cf6;--bd:#3b4690;--in:#0b1030;--cy:#22d3ee;--am:#fbbf24}
body, .card, button, input{transition:background .25s,color .25s,border-color .25s}
.theme-fab{position:fixed;right:12px;bottom:14px;z-index:99;border:1px solid var(--bd);box-shadow:0 5px 20px #0003}
.scene3d{height:300px;position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:14px;background:radial-gradient(ellipse at 50% 35%,#28417a,#080d27 75%);perspective:850px;margin:10px 0;color:#eaf2ff}
.scene3d .world{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(8deg)}
.scene3d .floor{position:absolute;left:8%;right:8%;bottom:25px;height:100px;transform:rotateX(62deg);background:repeating-linear-gradient(0deg,#ffffff12 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,#ffffff12 0 1px,transparent 1px 22px);border:1px solid #6e8bff55}
.wire{position:absolute;top:30px;bottom:32px;width:8px;border-radius:6px;background:linear-gradient(90deg,#8799c9,#eef5ff,#687ab5);box-shadow:0 0 18px #5bdcff99;transform:translateZ(40px)}
.wire.left{left:35%}.wire.right{left:65%}
.flow{position:absolute;top:45px;bottom:42px;width:5px;border-radius:8px;background:repeating-linear-gradient(180deg,#21d4fd 0 10px,transparent 10px 19px);filter:drop-shadow(0 0 7px #22d3ee);animation:flowDown 1s linear infinite}
.flow.left{left:calc(35% + 1px)}.flow.right{left:calc(65% + 1px)}
.flow.reverse{animation-direction:reverse;background:repeating-linear-gradient(180deg,#fb7185 0 10px,transparent 10px 19px)}
.force3d{position:absolute;top:48%;height:5px;width:28%;background:#fb7185;box-shadow:0 0 12px #fb7185;transform:translateZ(70px)}
.force3d:after{content:"";position:absolute;right:-2px;top:-6px;border-left:13px solid #fb7185;border-top:8px solid transparent;border-bottom:8px solid transparent}
.force3d.left{left:7%}.force3d.right{right:7%;transform:translateZ(70px) rotateY(180deg)}
.label3d{position:absolute;font-weight:700;font-size:13px;text-shadow:0 2px 5px #000;top:12px}.label3d.l{left:23%}.label3d.r{left:58%}
@keyframes flowDown{to{background-position:0 19px}}
.scene-caption{font-size:13px;color:var(--mu)}
.quizopt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--in);color:var(--tx);border:1px solid var(--bd)}
.quizopt.correct{background:#14532d;color:#fff}.quizopt.wrong{background:#7f1d1d;color:#fff}
</style>

proj:{n:'qiya otilgan jism',p:[['Boshlang‘ich tezlik v₀ (m/s)','v',5,30,20],['Burchak α (°)','a',10,80,45]],d(c,P,t,A){const r=P.a*Math.PI/180,vx=P.v*Math.cos(r),vy=P.v*Math.sin(r),Tt=2*vy/9.8,k=6,g0=270,tt=Math.min(t,Tt);c.beginPath();c.moveTo(20,g0);c.lineTo(620,g0);c.stroke();c.setLineDash([4,4]);c.beginPath();for(let s=0;s<=Tt;s+=.05)c.lineTo(20+vx*s*k,g0-(vy*s-4.9*s*s)*k);c.stroke();c.setLineDash([]);c.fillStyle=A;c.beginPath();c.arc(20+vx*tt*k,g0-(vy*tt-4.9*tt*tt)*k,8,0,7);c.fill();return `t = ${tt.toFixed(2)} s · uchish vaqti T = ${Tt.toFixed(2)} s · H = ${(vy*vy/19.6).toFixed(1)} m · L = ${(vx*Tt).toFixed(1)} m`}},

incl:{n:'qiya tekislikda sirpanish',p:[['Burchak α (°)','a',5,60,30],['Ishqalanish koeffitsiyenti μ','u',0,1,.2,.05]],d(c,P,t,A){const r=P.a*Math.PI/180,L=Math.min(450,240/Math.sin(r)),a=9.8*(Math.sin(r)-P.u*Math.cos(r)),s=a>0?Math.min(a*t*t*20,L-44):0;c.save();c.translate(40,270-L*Math.sin(r));c.rotate(r);c.beginPath();c.moveTo(0,0);c.lineTo(L,0);c.stroke();c.fillStyle=A;c.fillRect(s,-28,44,28);c.restore();return a>0?`a = g(sinα − μcosα) = ${a.toFixed(2)} m/s² · yo‘l s = ${(s/40).toFixed(2)} m`:`μ ≥ tgα: jism sirpanmaydi (a = 0)`}},

function rs(){T0=0;pz=0;cur.p.forEach(p=>{P[p[1]]=+$('#p_'+p[1]).value;$('#l_'+p[1]).textContent=P[p[1]]})}
function sim(i){cancelAnimationFrame(raf);cur=S[X[i].m];rs();last=performance.now();const lp=now=>{const cv=$('#cv');if(!cv)return;if(!pz)T0+=(now-last)/1000;last=now;const c=cv.getContext('2d'),st=getComputedStyle(document.documentElement);c.clearRect(0,0,640,300);c.fillStyle=c.strokeStyle=st.getPropertyValue('--tx');c.lineWidth=2;$('#ro').innerHTML=cur.d(c,P,T0,st.getPropertyValue('--ac'));raf=requestAnimationFrame(lp)};raf=requestAnimationFrame(lp)}
function ext(i){const s=X[i].s;return `<div class=card><b>Dars rejasi</b><ol>${s.map((x,j)=>`<li><a style='color:var(--ac);cursor:pointer' onclick=go2(${j})>${x[0]}</a></li>`).join('')}<li><a style='color:var(--ac);cursor:pointer' onclick=go2(${s.length})>Formulalar va kalkulyator</a></li>${Q[i]?`<li><a style='color:var(--ac);cursor:pointer' onclick=go2('q')>Test (10 ta savol)</a></li>`:''}</ol></div>`+`<div class=cols><div>`+s.map((x,j)=>`<div class=card id=s${j}><h3 style='margin:0 0 6px'>${j+1}. ${x[0]}</h3>${x[1]}</div>`).join('')+`</div><div class=side>`+sm(i)+`</div></div><span id=s${s.length}></span>`}
const X={
1:{m:'circ',s:[
['Aylana bo‘ylab tekis harakat',`<p><b>Ta’rif.</b> Jism aylana bo‘ylab tezlik moduli o‘zgarmagan holda harakatlansa, bu <b>tekis aylanma harakat</b> deyiladi. Tezlik moduli o‘zgarmasa ham, uning yo‘nalishi doim o‘zgaradi, shuning uchun harakat tezlanishlidir.</p><p>Kattaliklar: davr T (bir marta to‘liq aylanish vaqti), chastota ν = 1/T, burchak tezlik ω = 2π/T.</p><div class=f>v = 2πR/T = ωR</div>`],
['Markazga intilma tezlanish',`<p>Tezlik vektorining yo‘nalishi o‘zgarishi tufayli tezlanish paydo bo‘ladi. U aylana markaziga yo‘nalgan va tezlikka tik.</p><div class=f>a = v²/R = ω²R</div><p>Tezlik ortsa yoki radius kamaysa, tezlanish ortadi.</p>`],
['Markazga intilma kuch',`<p><b>Ta’rif.</b> Jismga aylana bo‘ylab harakatlanish uchun zarur tezlanishni beradigan, markazga yo‘nalgan teng ta’sir etuvchi kuch <b>markazga intilma kuch</b> deyiladi. Nyutonning 2-qonuniga ko‘ra:</p><div class=f>F = ma = mv²/R</div><p>Bu alohida turdagi kuch emas: ip tarangligi, ishqalanish, tortishish yoki ularning teng ta’sir etuvchisi bo‘lishi mumkin.</p>`],
['Hayotiy misollar',`<ul><li>Burilishda avtomobil: ishqalanish kuchi markazga intilma kuch vazifasini bajaradi; yetmasa mashina sirpanib ketadi.</li><li>Yer Quyosh atrofida, Oy Yer atrofida: butun olam tortishish kuchi.</li><li>Ipga bog‘lab aylantirilgan tosh: ip tarangligi.</li></ul>`]]},
2:{m:'proj',s:[
['Erkin tushish',`<p><b>Ta’rif.</b> Faqat og‘irlik kuchi ta’sirida bo‘ladigan harakat <b>erkin tushish</b> deyiladi. Yer sirti yaqinida (havo qarshiligi hisobga olinmasa) barcha jismlar bir xil g ≈ 9,8 m/s² tezlanish bilan harakatlanadi.</p><div class=f>v = v₀ + gt;  h = v₀t + gt²/2</div>`],
['Gorizontal otilgan jism',`<p>Harakat ikkita mustaqil harakatga ajraladi: gorizontal bo‘yicha tekis (vₓ = v₀), vertikal bo‘yicha erkin tushish. Traektoriya — parabola.</p><div class=f>x = v₀t;  y = gt²/2;  t = √(2h/g)</div><p>Tushish vaqti faqat balandlikka bog‘liq, boshlang‘ich tezlikka emas.</p>`],
['Burchak ostida otilgan jism',`<p>Boshlang‘ich tezlik gorizontga α burchak ostida yo‘nalgan. Proyeksiyalar: v₀ₓ = v₀cosα, v₀y = v₀sinα.</p><div class=f>x = v₀cosα·t;  y = v₀sinα·t − gt²/2</div><div class=f>T = 2v₀sinα/g;  H = v₀²sin²α/2g;  L = v₀²sin2α/g</div>`],
['Xulosalar',`<ul><li>Uchish uzoqligi α = 45° da eng katta bo‘ladi.</li><li>α va 90° − α burchaklarda uchish uzoqligi bir xil.</li><li>Traektoriyaning eng yuqori nuqtasida vertikal tezlik nolga teng, gorizontal tezlik saqlanadi.</li></ul><p>Simulyatsiyada v₀ va α ni o‘zgartirib tekshirib ko‘ring.</p>`]]},
7:{m:'incl',s:[
['Kuchlarni tahlil qilish',`<p>Qiya tekislikdagi jismga og‘irlik kuchi mg, tayanch reaksiyasi N va ishqalanish kuchi F<sub>ishq</sub> ta’sir qiladi. Og‘irlik kuchi ikki tashkil etuvchiga ajraladi:</p><div class=f>mg·sinα — tekislik bo‘ylab;  mg·cosα — tekislikka tik</div>`],
['Tayanch reaksiyasi va ishqalanish',`<p>Tekislikka tik yo‘nalishda tezlanish yo‘q, shuning uchun N = mg·cosα. <b>Sirpanish ishqalanish kuchi</b> tayanch reaksiyasiga proporsional:</p><div class=f>F<sub>ishq</sub> = μN = μmg·cosα</div>`],
['Tezlanish',`<p>Tekislik bo‘ylab Nyutonning 2-qonuni: ma = mg·sinα − μmg·cosα. Massa qisqarib ketadi:</p><div class=f>a = g(sinα − μcosα)</div><p>Demak, tezlanish jism massasiga bog‘liq emas. Agar μ ≥ tgα bo‘lsa, jism o‘z-o‘zidan sirpanmaydi.</p>`],
['Xususiy hollar',`<ul><li>μ = 0 (silliq tekislik): a = g·sinα.</li><li>α = 90°: erkin tushish, a = g.</li><li>α = 0: a = −μg (jism tormozlanadi).</li></ul>`]]},
16:{m:'pend',s:[
['Tebranma harakat kattaliklari',`<p><b>Ta’rif.</b> Muvozanat vaziyati atrofida vaqt bo‘yicha takrorlanadigan harakat <b>mexanik tebranish</b> deyiladi.</p><ul><li><b>Amplituda A</b> — muvozanat vaziyatidan eng katta og‘ish.</li><li><b>Davr T</b> — bitta to‘liq tebranish vaqti (s).</li><li><b>Chastota ν</b> — 1 sekunddagi tebranishlar soni (Hz).</li></ul><div class=f>ν = 1/T = N/t</div>`],
['Matematik mayatnik',`<p><b>Ta’rif.</b> Uzun, cho‘zilmaydigan vaznsiz ipga osilgan, o‘lchamlari ipga nisbatan juda kichik jism <b>matematik mayatnik</b> deyiladi.</p><div class=f>T = 2π√(l/g)</div><p>Kichik burchaklarda davr amplituda va massaga bog‘liq emas; uzunlik 4 marta ortsa, davr 2 marta ortadi.</p>`],
['Prujinali mayatnik',`<p>Prujinaga mahkamlangan yuk elastiklik kuchi ta’sirida tebranadi. Guk qonuni: F = −kx.</p><div class=f>T = 2π√(m/k)</div><p>Massa ortsa davr ortadi, prujina bikrligi ortsa davr kamayadi.</p>`],
['Energiya aylanishi',`<p>Tebranishda kinetik va potensial energiya bir-biriga aylanadi, to‘liq mexanik energiya saqlanadi (ishqalanishsiz).</p><div class=f>W = kA²/2 = mv²/2 + kx²/2</div><p>Chetki nuqtada energiya to‘liq potensial, muvozanat nuqtasida to‘liq kinetik.</p>`]]}};
Object.assign(S,{
vec:{n:'kuchlarni qo‘shish',p:[['F₁ (N)','f',1,10,6],['F₂ (N)','g',1,10,4],['Kuchlar orasidagi burchak α (°)','a',0,180,60]],d(c,P,t,A){const r=P.a*Math.PI/180,k=20*Math.min(t,1),ox=60,oy=250,x1=ox+k*P.f,y1=oy,x2=ox+k*P.g*Math.cos(r),y2=oy-k*P.g*Math.sin(r),sx=x1+x2-ox,sy=y1+y2-oy,Rm=Math.hypot(P.f+P.g*Math.cos(r),P.g*Math.sin(r));c.setLineDash([5,5]);c.beginPath();c.moveTo(x1,y1);c.lineTo(sx,sy);c.lineTo(x2,y2);c.stroke();c.setLineDash([]);ar(c,ox,oy,x1,y1,'#0ea5e9');ar(c,ox,oy,x2,y2,'#16a34a');ar(c,ox,oy,sx,sy,'#ef4444');return `Ko‘k — F₁, yashil — F₂, qizil — teng ta’sir etuvchi R.<br>R = √(F₁²+F₂²+2F₁F₂cosα) = ${Rm.toFixed(2)} N`}},
lift:{n:'liftdagi og‘irlik',p:[['Massa m (kg)','m',10,100,60],['Tezlanish a (m/s²), + yuqoriga','a',-9.8,10,2,.2]],d(c,P,t,A){const tt=t%3,cy=150-.5*P.a*tt*tt*1.6,Pw=P.m*(9.8+P.a),k=60/(P.m*9.8);c.strokeRect(220,cy-60,200,120);c.fillStyle=A;c.beginPath();c.arc(320,cy+5,16,0,7);c.fill();c.fillRect(312,cy+22,16,34);ar(c,320,cy+60,320,cy+60+Math.max(Pw,0)*k,'#ef4444');c.setLineDash([4,4]);c.strokeStyle='#888';c.beginPath();c.moveTo(380,cy+60);c.lineTo(380,cy+60+P.m*9.8*k);c.stroke();return `P = m(g + a) = ${Pw.toFixed(1)} N · mg = ${(P.m*9.8).toFixed(1)} N (nuqtali chiziq)<br>${P.a>0?'Og‘irlik ortdi (ortiqcha yuklanish)':P.a<0?(Pw<1?'Vaznsizlik: P ≈ 0':'Og‘irlik kamaydi'):'Tinch holat yoki tekis harakat: P = mg'}`}},
fric:{n:'ishqalanishli gorizontal harakat',p:[['Tortuvchi kuch F (N)','F',0,100,40],['Massa m (kg)','m',1,20,5],['Ishqalanish koeffitsiyenti μ','u',0,1,.3,.05]],d(c,P,t,A){const fr=P.u*P.m*9.8,a=P.F>fr?(P.F-fr)/P.m:0,x=130+Math.min(.5*a*(t%4)**2*10,340);c.beginPath();c.moveTo(10,250);c.lineTo(630,250);c.stroke();c.fillStyle=A;c.fillRect(x,210,70,40);ar(c,x+70,230,x+70+P.F*.8,230,'#0ea5e9');ar(c,x,235,x-Math.min(fr,P.F)*.8,235,'#ef4444');return `Ko‘k — tortuvchi kuch, qizil — ishqalanish kuchi.<br>F_ishq = μmg = ${fr.toFixed(1)} N · `+(a?`a = (F − μmg)/m = ${a.toFixed(2)} m/s²`:`F ≤ μmg: jism qo‘zg‘almaydi (F_ishq = F)`)}}});
Object.assign(X,{
0:{m:'vec',s:[
['Kuch — vektor kattalik',`<p><b>Ta’rif.</b> Kuch — jismlarning o‘zaro ta’sirini ifodalovchi vektor kattalik. U son qiymati, yo‘nalishi va qo‘yilish nuqtasi bilan aniqlanadi. Birligi — nyuton (N): 1 N = 1 kg·m/s². Kuch dinamometr bilan o‘lchanadi.</p><div class=f>F = ma</div>`],
['Teng ta’sir etuvchi kuch',`<p><b>Ta’rif.</b> Jismga bir vaqtda ta’sir qilayotgan bir necha kuchning ta’sirini yakka o‘zi almashtira oladigan kuch <b>teng ta’sir etuvchi kuch</b> deyiladi. Kuchlar vektor sifatida qo‘shiladi.</p><div class=f>R = F₁ + F₂ + … (vektor yig‘indi)</div>`],
['Bir to‘g‘ri chiziq bo‘ylab ta’sir qiluvchi kuchlar',`<ul><li>Bir tomonga yo‘nalgan: <b>R = F₁ + F₂</b> (α = 0°).</li><li>Qarama-qarshi yo‘nalgan: <b>R = |F₁ − F₂|</b>, yo‘nalishi kattasi tomonga (α = 180°).</li></ul><p>Simulyatsiyada α ni 0° va 180° ga qo‘yib tekshiring.</p>`],
['Parallelogramm qoidasi',`<p>Bir nuqtaga burchak ostida qo‘yilgan ikki kuchning teng ta’sir etuvchisi shu kuchlarga qurilgan parallelogrammning diagonaliga teng.</p><div class=f>R = √(F₁² + F₂² + 2F₁F₂cosα)</div><p>α = 90° bo‘lsa R = √(F₁² + F₂²) (Pifagor teoremasi). Misol: 3 N va 4 N o‘zaro tik bo‘lsa, R = 5 N.</p>`]]},
3:{m:'proj',s:[
['Masala yechish algoritmi',`<ol><li>Berilganlarni yozing va SI birliklariga o‘tkazing.</li><li>Chizma chizing, kuchlar va yo‘nalishlarni belgilang.</li><li>Kerakli formulani tanlang, noma’lumni ifodalang.</li><li>Son qiymatlarni qo‘yib hisoblang.</li><li>Birlik va javob mantiqiyligini tekshiring.</li></ol>`],
['1-masala. Kuchlarni qo‘shish',`<p><b>Berilgan:</b> F₁ = 3 N, F₂ = 4 N, α = 90°. <b>R = ?</b></p><p><b>Yechish:</b> R = √(F₁² + F₂²) = √(9 + 16) = 5 N.</p><p><b>Javob:</b> 5 N.</p>`],
['2-masala. Markazga intilma kuch',`<p><b>Berilgan:</b> m = 2 kg, R = 0,5 m, v = 5 m/s. <b>F = ?</b></p><p><b>Yechish:</b> F = mv²/R = 2·25/0,5 = 100 N.</p><p><b>Javob:</b> 100 N.</p>`],
['3-masala. Otilgan jism',`<p><b>Berilgan:</b> v₀ = 20 m/s, α = 30°, g = 9,8 m/s². <b>T, H, L = ?</b></p><p><b>Yechish:</b></p><div class=f>T = 2v₀sinα/g = 2·20·0,5/9,8 ≈ 2,04 s</div><div class=f>H = v₀²sin²α/2g = 400·0,25/19,6 ≈ 5,1 m</div><div class=f>L = v₀²sin2α/g = 400·0,866/9,8 ≈ 35,3 m</div><p>Simulyatsiyada v₀ = 20 m/s va α = 30° qo‘yib tekshiring.</p>`]]},
4:{m:'lift',s:[
['Og‘irlik kuchi va jism og‘irligi',`<p><b>Og‘irlik kuchi</b> mg — Yerning tortishi, jismga qo‘yilgan. <b>Jism og‘irligi P</b> — jismning tayanchga bosim kuchi yoki osmani cho‘zuvchi kuch, tayanch yoki osmaga qo‘yilgan. Ular turli kuchlar, tinch holatda faqat son jihatdan teng.</p>`],
['Tinch holat yoki tekis harakat',`<p>Tezlanish nol bo‘lsa, tayanch reaksiyasi N = mg, Nyutonning 3-qonuniga ko‘ra P = N.</p><div class=f>P = mg</div>`],
['Yuqoriga tezlanish bilan harakat',`<p>Lift yuqoriga a tezlanish bilan ketsa: N − mg = ma.</p><div class=f>P = m(g + a)</div><p>Og‘irlik ortadi — bu <b>ortiqcha yuklanish</b> deyiladi (raketa uchishida kosmonavtlar sezadi).</p>`],
['Pastga tezlanish va vaznsizlik',`<p>Pastga a tezlanish bilan: mg − N = ma.</p><div class=f>P = m(g − a)</div><p>a = g bo‘lsa P = 0, bu <b>vaznsizlik</b>: erkin tushayotgan jism yoki Yer atrofida aylanayotgan kosmik stansiyadagi holat.</p>`]]},
5:{m:'fric',s:[
['Nyutonning uch qonuni',`<ul><li><b>1-qonun (inersiya):</b> kuch ta’sir etmasa yoki ta’sirlar muvozanatlashsa, jism tinch yoki tekis harakatda bo‘ladi.</li><li><b>2-qonun:</b> ΣF = ma.</li><li><b>3-qonun:</b> F₁₂ = −F₂₁ (ta’sir va aks ta’sir teng va qarama-qarshi).</li></ul>`],
['Mexanikada uchraydigan kuchlar',`<ul><li>Og‘irlik kuchi: mg</li><li>Elastiklik kuchi (Guk): F = kx</li><li>Sirpanish ishqalanish kuchi: F = μN</li><li>Tayanch reaksiyasi N (sirtga tik)</li></ul>`],
['Kuchlar proyeksiyalari usuli',`<p>Koordinata o‘qlarini tanlab, har bir kuchning proyeksiyasi yoziladi: OX bo‘yicha F − F<sub>ishq</sub> = ma, OY bo‘yicha N − mg = 0, bundan N = mg.</p>`],
['Gorizontal tekislikdagi harakat',`<p>F<sub>ishq</sub> = μmg bo‘lgani uchun:</p><div class=f>a = (F − μmg)/m</div><p>Jism harakatlanishi uchun F > μmg bo‘lishi kerak. Misol: m = 5 kg, F = 40 N, μ = 0,3 bo‘lsa, F<sub>ishq</sub> = 14,7 N va a ≈ 5,06 m/s².</p>`]]}});
Object.assign(S,{lev:{n:'richag muvozanati',p:[['F₁ (N)','f',1,50,20],['Yelka d₁ (m)','d',.2,2,1,.1],['F₂ (N)','g',1,50,20],['Yelka d₂ (m)','e',.2,2,1,.1]],d(c,P,t,A){const m1=P.f*P.d,m2=P.g*P.e,th=Math.max(-.35,Math.min(.35,(m1-m2)*.02))*Math.min(t,1),k=110,lx=320-P.d*k*Math.cos(th),ly=150+P.d*k*Math.sin(th),rx=320+P.e*k*Math.cos(th),ry=150-P.e*k*Math.sin(th);c.lineWidth=5;c.beginPath();c.moveTo(lx,ly);c.lineTo(rx,ry);c.stroke();c.beginPath();c.moveTo(320,150);c.lineTo(295,215);c.lineTo(345,215);c.closePath();c.fillStyle=A;c.fill();ar(c,lx,ly,lx,ly+P.f,'#0ea5e9');ar(c,rx,ry,rx,ry+P.g,'#16a34a');return `M₁ = F₁d₁ = ${m1.toFixed(1)} N·m · M₂ = F₂d₂ = ${m2.toFixed(1)} N·m<br>`+(Math.abs(m1-m2)<.05?'Muvozanat: M₁ = M₂':m1>m2?'Chap tomon pastga tushadi (M₁ > M₂)':'O‘ng tomon pastga tushadi (M₂ > M₁)')}}});
X[12]={m:'lev',s:[
['Kuch yelkasi va kuch momenti',`<p><b>Ta’rif.</b> Aylanish o‘qidan kuch ta’sir chizig‘igacha bo‘lgan eng qisqa (perpendikulyar) masofa <b>kuch yelkasi</b> d deyiladi. Kuch va uning yelkasi ko‘paytmasi <b>kuch momenti</b>, birligi N·m.</p><div class=f>M = F·d</div>`],
['Momentlar qoidasi',`<p>Richag muvozanatda bo‘lishi uchun soat strelkasi bo‘ylab va unga qarshi ta’sir qiluvchi momentlar teng bo‘lishi kerak.</p><div class=f>M₁ = M₂  yoki  F₁d₁ = F₂d₂</div>`],
['Oddiy mexanizmlar',`<p>Richag, qo‘zg‘almas va qo‘zg‘aluvchan blok, vorot, qiya tekislik <b>oddiy mexanizmlar</b> deyiladi. Qo‘zg‘almas blok faqat kuch yo‘nalishini o‘zgartiradi, qo‘zg‘aluvchan blok kuchdan 2 marta yutuq beradi.</p>`],
['Mexanikaning oltin qoidasi',`<p>Oddiy mexanizm kuchdan necha marta yutuq bersa, yo‘lda shuncha marta yutqazadi; <b>ishdan yutuq bermaydi</b>. Misol: 100 N yuk, yelkasi 0,5 m; kuch yelkasi 2 m bo‘lsa, F = 100·0,5/2 = 25 N.</p>`]]};

18:{s:[
['Ko‘ndalang va bo‘ylama to‘lqinlar',`<p><b>Ta’rif.</b> Mexanik tebranishlarning muhitda tarqalishi <b>mexanik to‘lqin</b> deyiladi. To‘lqin tarqalganda muhit zarralari ko‘chmaydi, muvozanat vaziyati atrofida tebranadi; zarradan zarraga tebranma harakat va energiya uzatiladi.</p><ul><li><b>Bo‘ylama:</b> zarralar tarqalish yo‘nalishida tebranadi (tovush, ultratovush, suyuqlik ichidagi to‘lqin).</li><li><b>Ko‘ndalang:</b> zarralar tarqalishga tik tebranadi (suv sirti, tebranayotgan ip).</li></ul><p>Gazlarda faqat bo‘ylama, qattiq jismlarda ikkala tur ham tarqaladi.</p>`,'wt'],
['To‘lqin tavsiflari',`<p>To‘lqin <b>chastota ν</b>, <b>davr T</b>, <b>to‘lqin uzunligi λ</b> (bir davrda to‘lqin bosib o‘tgan masofa) va <b>tarqalish tezligi v</b> bilan tavsiflanadi.</p><div class=f>v = λ/T = λν</div><p>To‘lqin manbasining chastotasi muhitga bog‘liq emas; tezlik va λ muhitga bog‘liq.</p>`,'wp'],
['To‘lqin energiyani ko‘chiradi, moddani emas',`<p>Suvdagi tunukacha to‘lqin o‘tganda faqat yuqori-pastga tebranadi, to‘lqin bilan birga ketmaydi. Demak, barcha to‘lqinlarga xos xususiyat: <b>moddaning emas, energiyaning ko‘chishi</b>.</p>`,'buoy']]},
19:{s:[
['Tovush nima? Tovushning tezligi',`<p><b>Ta’rif.</b> Odam eshitadigan mexanik to‘lqinlar <b>tovush to‘lqinlari</b> deyiladi (17–20000 Hz). Tovush elastik muhitda tarqaladi, <b>vakuumda tarqalmaydi</b>.</p><p>Tezligi muhitga bog‘liq: havoda ≈ 340 m/s, suvda ≈ 1500 m/s, po‘latda ≈ 5000 m/s. Shuning uchun chaqmoq oldin ko‘rinadi, gumburlash keyin eshitiladi.</p><div class=f>s = vt</div>`,'snd'],
['Tovush kattaliklari',`<ul><li><b>Balandlik</b> — tebranish chastotasiga bog‘liq: chastota katta bo‘lsa tovush yuqori.</li><li><b>Qattiqlik</b> — amplituda (intensivlik)ga bog‘liq.</li><li><b>Tembr</b> — tovush manbasi (cholg‘u, ovoz) ni ajratadigan sifat.</li></ul>`,'tone'],
['Ultratovush va infratovush',`<p><b>Ultratovush</b> — chastotasi 20 kHz dan yuqori, <b>infratovush</b> — 17 Hz dan past to‘lqinlar. Ultratovush exolokatsiyada (suv chuqurligini o‘lchash), tibbiyotda (UTT), nuqsonlarni aniqlashda qo‘llanadi.</p><div class=f>h = vt/2</div>`,'echo']]},
21:{s:[
['Laminar va turbulent oqim',`<p><b>Laminar oqim</b> — suyuqlik yoki gazning qatlam-qatlam, qatlamlari aralashmay oqishi; nayning o‘rtasida tezlik katta, devor yonida kichik. <b>Turbulent oqim</b> — tezlik katta bo‘lganda qatlamlarning aralashib, girdob hosil qilib oqishi.</p>`,'lam'],
['Oqim uzluksizligi',`<p>Siqilmaydigan suyuqlik oqayotgan nayning har bir kesimidan vaqt birligida bir xil hajm o‘tadi. Nay torayganda tezlik ortadi.</p><div class=f>S₁v₁ = S₂v₂ = const;  Q = Sv</div>`,'cont'],
['Bosimning tezlikka bog‘liqligi',`<p>Harakatlanayotgan suyuqlik yoki gazda tezlik katta bo‘lgan joyda bosim kichik bo‘ladi (Bernulli qonuni).</p><div class=f>p + ρv²/2 + ρgh = const</div><p>ρv²/2 — dinamik bosim.</p>`,'bern']]}});
Object.assign(Q,{
18:`Mexanik to‘lqin — bu:|jismning ko‘chishi|modda oqimi|mexanik tebranishlarning muhitda tarqalishi|yorug‘lik tarqalishi|3\nTo‘lqinda ko‘chadi:|modda|energiya|zarralar|suv massasi|2\nBo‘ylama to‘lqinda zarralar:|tarqalishga tik tebranadi|tarqalish yo‘nalishida tebranadi|ko‘chadi|tebranmaydi|2\nKo‘ndalang to‘lqinga misol:|tovush|suv sirtidagi to‘lqin|ultratovush|gazdagi to‘lqin|2\nGazlarda tarqaladi:|faqat bo‘ylama to‘lqin|faqat ko‘ndalang|ikkalasi|hech biri|1\nTo‘lqin tezligi:|v = λν|v = λ/ν|v = ν/λ|v = λ + ν|1\nλ = 3 m, ν = 2 Hz bo‘lsa v =|1,5 m/s|6 m/s|0,67 m/s|5 m/s|2\nT = 0,5 s, λ = 4 m bo‘lsa v =|8 m/s|2 m/s|0,125 m/s|4,5 m/s|1\nTo‘lqin uzunligi — bu:|zarra amplitudasi|chastota|bir davrda to‘lqin bosib o‘tgan masofa|tezlik|3\nKo‘ndalang to‘lqin tarqalmaydi:|suyuqlik va gaz ichida|qattiq jismda|ip bo‘ylab|suv sirtida|1`.split('\n'),
19:`Tovush vakuumda:|tarqaladi|tarqalmaydi|tezroq tarqaladi|sekinroq tarqaladi|2\nEshitiladigan chastotalar:|1–10 Hz|20–100 kHz|17–20000 Hz|1–100 MHz|3\nHavoda tovush tezligi ≈|34 m/s|340 m/s|3400 m/s|3·10⁸ m/s|2\nTovush eng tez tarqaladi:|havoda|vakuumda|suvda|po‘latda|4\nTovush balandligi bog‘liq:|amplitudaga|chastotaga|tezlikka|massaga|2\nTovush qattiqligi bog‘liq:|chastotaga|haroratga|amplitudaga|davrga|3\nUltratovush chastotasi:|17–20000 Hz|< 17 Hz|0 Hz|> 20 kHz|4\nInfratovush chastotasi:|< 17 Hz|> 20 kHz|1 MHz|100 kHz|1\nh = 75 m, v = 1500 m/s bo‘lsa qaytish vaqti t = 2h/v =|0,05 s|0,2 s|0,1 s|1 s|3\nChaqmoq oldin ko‘rinadi, chunki:|tovush tezligi katta|yorug‘lik tezligi tovushnikidan ancha katta|ko‘z tez ishlaydi|bulut to‘sadi|2`.split('\n'),
21:`Laminar oqim:|tartibsiz aralash oqish|qatlam-qatlam oqish|to‘xtash|aylanma harakat|2\nTurbulent oqim:|qatlam-qatlam|tinch holat|faqat gazda|girdobli, aralash oqish|4\nUzluksizlik tenglamasi:|S₁v₁ = S₂v₂|S₁/v₁ = S₂/v₂|S₁ + v₁ = S₂ + v₂|v₁ = v₂|1\nS₁ = 50 sm², v₁ = 2 m/s, S₂ = 20 sm² bo‘lsa v₂ =|0,8 m/s|8 m/s|5 m/s|2 m/s|3\nQuvur torayganda tezlik:|ortadi|kamayadi|o‘zgarmaydi|nolga teng|1\nSuv sarfi Q =|S/v|Sv|v/S|S + v|2\nBernulli: tezlik katta joyda bosim:|ortadi|o‘zgarmaydi|kamayadi|nolga teng|3\nDinamik bosim:|ρgh|ρv²/2|ρ/v|mg|2\nLaminar oqimda nay o‘rtasida tezlik:|chetdan kichik|nolga teng|bir xil|chetdan katta|4\nSamolyot qanotiga ko‘taruvchi kuch, chunki:|qanot ustida havo tezroq, bosim kichikroq|qanot ostida bosim kichik|havo yo‘q|massa kam|1`.split('\n')});
Object.assign(S,{
jet:{n:'idishdagi tirqishdan oqish',p:[['Suyuqlik sathi H (m)','H',1,3,2,.25],['Tirqish chuqurligi h (m)','h',.2,1,.5,.1]],d(c,P,t,Ac){const k=80,v=Math.sqrt(19.6*P.h),y0=P.H-P.h,T=Math.sqrt(2*y0/9.8),yh=270-y0*k;c.strokeRect(40,270-P.H*k-20,160,P.H*k+20);c.fillStyle='#38bdf8';c.fillRect(41,270-P.H*k,158,P.H*k);c.fillStyle=Ac;c.fillRect(196,yh-3,8,6);c.beginPath();c.moveTo(20,270);c.lineTo(620,270);c.stroke();c.fillStyle='#38bdf8';for(let i=0;i<10;i++){const s=((t*.7+i/10)%1)*T;c.beginPath();c.arc(200+v*s*k,yh+4.9*s*s*k,4,0,7);c.fill()}return `v = √(2gh) = ${v.toFixed(2)} m/s · uzoqlik L = ${(v*T).toFixed(2)} m`}},
lift:{n:'qanotning ko‘taruvchi kuchi',p:[['Havo tezligi v (m/s)','v',20,200,80,10],['Qanot ustida tezlik ortishi (%)','e',5,30,15,5]],d(c,P,t,Ac){const vt=P.v*(1+P.e/100),dp=1.2*(vt*vt-P.v*P.v)/2;c.fillStyle=Ac;c.beginPath();c.ellipse(320,150,110,16,-.08,0,7);c.fill();c.fillStyle='#22d3ee';for(let i=0;i<8;i++){c.beginPath();c.arc((i*80+t*vt*1.2)%600+20,105+8*Math.sin(i),4,0,7);c.fill();c.beginPath();c.arc((i*80+t*P.v*1.2)%600+20,195,4,0,7);c.fill()}ar(c,320,130,320,Math.max(40,130-dp/280),'#ef4444');return `Ustida v = ${vt.toFixed(0)} m/s, ostida v = ${P.v} m/s → bosimlar farqi Δp = ρ(v²−v₀²)/2 ≈ ${dp.toFixed(0)} Pa (kuch yuqoriga)`}},
magnus:{n:'Magnus effekti',p:[['Aylanish chastotasi n (ayl/s)','n',0,10,5],['Tezlik v (m/s)','v',5,20,10]],d(c,P,t,Ac){const a=.8*P.n*P.v/10,tt=t%4,X=s=>40+7*P.v*s,Y=s=>100+.5*a*s*s;c.setLineDash([4,5]);c.beginPath();c.moveTo(40,100);c.lineTo(X(4),100);c.stroke();c.strokeStyle='#22d3ee';c.beginPath();for(let s=0;s<=4;s+=.1)s?c.lineTo(X(s),Y(s)):c.moveTo(X(0),Y(0));c.stroke();c.setLineDash([]);c.fillStyle=Ac;c.beginPath();c.arc(X(tt),Y(tt),14,0,7);c.fill();c.strokeStyle='#fff';c.beginPath();c.moveTo(X(tt),Y(tt));c.lineTo(X(tt)+12*Math.cos(P.n*tt*2*Math.PI),Y(tt)+12*Math.sin(P.n*tt*2*Math.PI));c.stroke();return `Aylanayotgan to‘p: bir tomonda havo tezroq, bosim kichik → traektoriya egiladi (Magnus effekti). Egilish ∝ n·v = ${a.toFixed(1)}`}},
enrg:{n:'tebranishda energiya aylanishi',p:[['Amplituda A (m)','A',.5,2,1,.1],['Bikrlik k (N/m)','k',10,50,20,5]],d(c,P,t,Ac){const w=Math.sqrt(P.k),x=P.A*Math.cos(w*t),W=P.k*P.A*P.A/2,Ep=P.k*x*x/2,Ek=W-Ep,px=190+x*50;c.beginPath();c.moveTo(20,100);c.lineTo(20,200);c.moveTo(20,150);c.lineTo(px-20,150);c.stroke();c.fillStyle=Ac;c.fillRect(px-20,130,40,40);c.fillStyle='#fbbf24';c.fillRect(420,270-180*Ep/W,60,180*Ep/W);c.fillStyle='#22d3ee';c.fillRect(500,270-180*Ek/W,60,180*Ek/W);c.fillStyle=c.strokeStyle;c.fillText('E_pot',425,285);c.fillText('E_kin',505,285);return `W = kA²/2 = ${W.toFixed(1)} J · E_pot = ${Ep.toFixed(1)} J · E_kin = ${Ek.toFixed(1)} J (yig‘indi o‘zgarmas)`}},
res:{n:'rezonans',p:[['Majburlovchi chastota ν (Hz)','f',1,10,3,.5],['Ishqalanish (so‘nish)','g',.2,2,.5,.1]],d(c,P,t,Ac){const A=f=>1/Math.hypot(25-f*f,2*P.g*f);let m=0;for(let f=0;f<=10;f+=.1)m=Math.max(m,A(f));c.beginPath();for(let f=0;f<=10;f+=.1){const x=40+56*f,y=270-140*A(f)/m;f?c.lineTo(x,y):c.moveTo(x,y)}c.strokeStyle='#22d3ee';c.stroke();const a=A(P.f)/m;c.fillStyle='#fbbf24';c.beginPath();c.arc(40+56*P.f,270-140*a,6,0,7);c.fill();c.fillStyle=Ac;c.beginPath();c.arc(320+120*a*Math.cos(2*Math.PI*P.f*t),50,12,0,7);c.fill();return `Xususiy chastota ν₀ = 5 Hz. ν = ${P.f} Hz da amplituda ${(a*100).toFixed(0)} % (ν = ν₀ da maksimum — rezonans)`}}});
function rg(i,g,k){const s=X[i].s;X[i]={s:g.map((a,j)=>[a.map(n=>s[n][0]).join(' va '),a.map(n=>s[n][1]).join(''),k[j]])}}

['Tebranish masalalari',`<p><b>1-masala.</b> m = 0,5 kg, k = 50 N/m. T, ν = ?</p><div class=f>T = 2π√(m/k) = 2π√0,01 ≈ 0,63 s;  ν = 1/T ≈ 1,6 Hz</div><p><b>2-masala.</b> Matematik mayatnik davri T = 2 s. l = ?</p><div class=f>l = gT²/4π² = 9,8·4/39,5 ≈ 0,99 m</div>`,'osc'],
['To‘lqin masalalari',`<p><b>1-masala.</b> ν = 2 Hz, λ = 3 m. v = ?</p><div class=f>v = λν = 6 m/s</div><p><b>2-masala.</b> v = 6 m/s, T = 2 s. λ = ?</p><div class=f>λ = vT = 12 m</div>`,'wp'],
['Tovush masalalari',`<p><b>1-masala.</b> Chaqmoqdan 3 s keyin gumburlash eshitildi. Masofa (v = 340 m/s)?</p><div class=f>s = vt = 340·3 = 1020 m</div><p><b>2-masala.</b> Exolokator signali 0,2 s da qaytdi (v = 1500 m/s). h = ?</p><div class=f>h = vt/2 = 1500·0,2/2 = 150 m</div>`,'snd']]},
22:{s:[
['Samolyot qanotini ko‘taruvchi kuch',`<p>Qanot shakli shunday bo‘ladiki, uning ustidan havo tezroq, ostidan sekinroq oqadi. Bernulli qonuniga ko‘ra tezlik katta joyda bosim kichik bo‘ladi, shuning uchun qanot ostidagi bosim katta va <b>ko‘taruvchi kuch</b> yuqoriga yo‘nalgan.</p><div class=f>Δp = ρ(v₁² − v₂²)/2</div>`,'lift'],
['Magnus effekti',`<p><b>Ta’rif.</b> Havo (suyuqlik) oqimida aylanib harakatlanayotgan jismga harakat yo‘nalishiga tik kuch ta’sir etishi <b>Magnus effekti</b> deyiladi. Aylanayotgan jismning bir tomonida havo tezligi katta, ikkinchi tomonida kichik bo‘ladi, bosimlar farqi traektoriyani egadi (futbol, tennis).</p>`,'magnus'],
['Idishdagi tirqishdan suyuqlik tezligi',`<p>Idish yon devoridagi tirqishdan, suyuqlik sirtidan h chuqurlikda, oqayotgan suyuqlik tezligi (Torichelli formulasi):</p><div class=f>v = √(2gh)</div><p>Tezlik suyuqlik zichligiga bog‘liq emas, faqat chuqurlikka bog‘liq.</p>`,'jet']]},
23:{s:[
['Uzluksizlik masalalari',`<p>S₁ = 50 sm², v₁ = 2 m/s, S₂ = 20 sm². v₂, Q = ?</p><div class=f>v₂ = S₁v₁/S₂ = 5 m/s;  Q = S₁v₁ = 10 l/s</div>`,'cont'],
['Bernulli masalalari',`<p>Gorizontal quvurda v₁ = 1 m/s, v₂ = 3 m/s, suv (ρ = 1000 kg/m³). Δp = ?</p><div class=f>Δp = ρ(v₂² − v₁²)/2 = 1000·8/2 = 4000 Pa</div>`,'bern'],
['Tirqishdan oqish masalalari',`<p>Suyuqlik sirtidan h = 1,25 m chuqurlikdagi tirqishdan oqish tezligi?</p><div class=f>v = √(2gh) = √(2·9,8·1,25) ≈ 4,95 m/s</div>`,'jet']]}});

20:`m = 0,5 kg, k = 50 N/m bo‘lsa T ≈|6,3 s|0,63 s|0,1 s|1,6 s|2\nT = 2 s bo‘lgan matematik mayatnik uzunligi (g = 9,8):|0,5 m|2 m|0,99 m|4 m|3\nT = 0,5 s bo‘lsa ν =|4 Hz|0,5 Hz|1 Hz|2 Hz|4\nl 4 marta ortsa matematik mayatnik davri:|2 marta ortadi|4 marta ortadi|2 marta kamayadi|o‘zgarmaydi|1\nν = 2 Hz, λ = 3 m bo‘lsa v =|1,5 m/s|0,67 m/s|6 m/s|5 m/s|3\nv = 6 m/s, T = 2 s bo‘lsa λ =|3 m|12 m|8 m|0,33 m|2\nChaqmoqdan 3 s keyin gumburlash eshitildi (v = 340 m/s), masofa:|113 m|340 m|1020 m|3 m|3\nExolokator 0,2 s, v = 1500 m/s bo‘lsa h =|300 m|75 m|3000 m|150 m|4\nPrujinali mayatnikda m 4 marta ortsa davr:|4 marta kamayadi|o‘zgarmaydi|4 marta ortadi|2 marta ortadi|4\nν = 5 Hz, v = 10 m/s bo‘lsa λ =|0,5 m|2 m|50 m|5 m|2`.split('\n'),
22:`Qanotga ko‘taruvchi kuch ta’sir etadi, chunki ustida:|havo tezroq, bosim kichikroq|bosim katta|havo yo‘q|massa kam|1\nBernulli: tezlik ortsa bosim:|ortadi|kamayadi|o‘zgarmaydi|nolga teng|2\nMagnus effekti:|erkin tushish|isish|aks-sado|aylanayotgan jism traektoriyasining egilishi|4\nMagnus effekti sababi:|jism rangi|havo bosimlarining farqi|haroratdan|massadan|2\nTorichelli formulasi:|v = gh|v = √(2gh)|v = 2gh|v = h/g|2\nh = 1,25 m bo‘lsa v ≈ (g = 9,8):|2,5 m/s|12,5 m/s|4,95 m/s|1,25 m/s|3\nTirqish chuqurroq bo‘lsa oqish tezligi:|kamayadi|o‘zgarmaydi|nolga teng|ortadi|4\nDinamik bosim ρv²/2: ρ = 1,2, v = 10 bo‘lsa:|120 Pa|60 Pa|6 Pa|600 Pa|2\nQanot ko‘taruvchi kuchi ortadi, agar:|tezlik ortsa|tezlik kamaysa|qanot kichik bo‘lsa|havo kamaysa|1\nMagnus effektidan foydalaniladi:|faqat suvda|faqat vakuumda|termometrda|futbol, tennis kabi sportda|4`.split('\n'),

dyn:{n:'dinamometr: F = kx',p:[['Cho‘zilish x (sm)','x',0,10,4,.5],['Bikrlik k (N/m)','k',50,500,200,10]],d(c,P,t,Ac){const xd=P.x*(1-Math.exp(-2*t)*Math.cos(8*t)),F=P.k*P.x/100,y1=50,y2=y1+60+xd*8;c.beginPath();c.moveTo(320,10);c.lineTo(320,y1);for(let i=1;i<=10;i++)c.lineTo(320+(i%2?-14:14),y1+(y2-y1)*i/11);c.lineTo(320,y2);c.stroke();c.fillStyle=Ac;c.fillRect(300,y2,40,18);for(let i=0;i<=10;i++){c.beginPath();c.moveTo(380,50+i*20);c.lineTo(i%5?390:400,50+i*20);c.stroke()}ar(c,320,y2+18,320,y2+18+Math.min(F*.9,45),'#ef4444');return `F = kx = ${P.k} · ${(P.x/100).toFixed(3)} = ${F.toFixed(1)} N (1 sm cho‘zilishga ${(P.k/100).toFixed(1)} N to‘g‘ri keladi)`}},
tug:{n:'bir to‘g‘ri chiziqdagi kuchlar',p:[['F₁ → (N)','a',0,100,60,5],['F₂ ← (N)','b',0,100,40,5],['Massa m (kg)','m',1,20,5]],d(c,P,t,Ac){const R=P.a-P.b,a=R/P.m,x=320+Math.max(-180,Math.min(180,5*a*(t%4)**2));c.beginPath();c.moveTo(20,250);c.lineTo(620,250);c.stroke();c.fillStyle=Ac;c.fillRect(x-30,210,60,40);ar(c,x+30,230,x+30+P.a*1.1,230,'#0ea5e9');ar(c,x-30,230,x-30-P.b*1.1,230,'#ef4444');return `R = F₁ − F₂ = ${R} N `+(R>0?'(o‘ngga)':R<0?'(chapga)':'(muvozanat: R = 0)')+` · a = R/m = ${a.toFixed(2)} m/s²`}},
rot:{n:'tekis aylanma harakat kattaliklari',p:[['Radius R (m)','R',1,5,2,.5],['Davr T (s)','T',1,6,3,.5]],d(c,P,t,Ac){const w=2*Math.PI/P.T,R=P.R*26,cx=320,cy=150,th=w*t,x=cx+R*Math.cos(th),y=cy-R*Math.sin(th),v=w*P.R;c.beginPath();c.arc(cx,cy,R,0,7);c.stroke();c.beginPath();c.moveTo(cx,cy);c.lineTo(x,y);c.stroke();c.strokeStyle='#fbbf24';c.beginPath();c.arc(cx,cy,20,0,-(th%(2*Math.PI)),true);c.stroke();ar(c,x,y,x-Math.sin(th)*v*4,y-Math.cos(th)*v*4,'#0ea5e9');c.fillStyle=Ac;c.beginPath();c.arc(x,y,9,0,7);c.fill();return `ν = 1/T = ${(1/P.T).toFixed(2)} Hz · ω = 2π/T = ${w.toFixed(2)} rad/s · v = ωR = 2πR/T = ${v.toFixed(2)} m/s`}},
turn:{n:'avtomobilning burilishi',p:[['Tezlik v (m/s)','v',5,30,15],['Radius R (m)','R',20,100,50,5],['Ishqalanish μ','u',.1,1,.6,.05]],d(c,P,t,Ac){const Fn=1000*P.v*P.v/P.R,Fm=1000*P.u*9.8,sk=Fn>Fm,tt=t%5,th=P.v/P.R*tt*6,cx=320,cy=150,r=100;c.beginPath();c.arc(cx,cy,r,0,7);c.stroke();const x=sk?cx+r:cx+r*Math.cos(th),y=sk?cy-tt*P.v*6:cy-r*Math.sin(th);c.fillStyle=Ac;c.fillRect(x-14,y-8,28,16);if(!sk){const q=.5*Math.min(1,Fn/Fm);ar(c,x,y,x+(cx-x)*q,y+(cy-y)*q,'#ef4444')}return `F = mv²/R = ${(Fn/1000).toFixed(1)} kN · F_ishq,max = μmg = ${(Fm/1000).toFixed(1)} kN (m = 1000 kg)<br>`+(sk?'F > μmg: ishqalanish yetmaydi, mashina sirpanib chiqib ketadi!':'F ≤ μmg: mashina burilishdan o‘tadi')}},
fall:{n:'erkin tushish',p:[['Balandlik h (m)','h',5,100,45,5],['g (m/s²): Oy 1,6 · Yer 9,8 · Yupiter 24,8','g',1.6,25,9.8,.2]],d(c,P,t,Ac){const tf=Math.sqrt(2*P.h/P.g),tt=Math.min(t%(tf+1.5),tf),y=.5*P.g*tt*tt;c.beginPath();c.moveTo(280,30);c.lineTo(280,260);c.stroke();for(let i=0;i<=4;i++)c.fillText(Math.round(P.h*i/4)+' m',230,34+i*55);c.beginPath();c.moveTo(20,260);c.lineTo(620,260);c.stroke();c.fillStyle=Ac;c.beginPath();c.arc(340,30+y/P.h*220,12,0,7);c.fill();return `T = √(2h/g) = ${tf.toFixed(2)} s · hozir t = ${tt.toFixed(2)} s: tushgan yo‘l ${y.toFixed(1)} m, v = gt = ${(P.g*tt).toFixed(1)} m/s`}},
hor:{n:'gorizontal otilgan jism',p:[['Balandlik h (m)','h',5,80,45,5],['Boshlang‘ich tezlik v₀ (m/s)','v',5,30,15]],d(c,P,t,Ac){const T=Math.sqrt(2*P.h/9.8),tt=Math.min(t%(T+1.2),T),k=4.5,y0=270-P.h*3,X=s=>40+P.v*s*k,Y=s=>y0+4.9*s*s*3;c.beginPath();c.moveTo(20,270);c.lineTo(620,270);c.stroke();c.setLineDash([4,5]);c.beginPath();for(let s=0;s<=T;s+=T/40)s?c.lineTo(X(s),Y(s)):c.moveTo(X(0),Y(0));c.stroke();c.setLineDash([]);ar(c,X(tt),Y(tt),X(tt)+P.v*2,Y(tt),'#22d3ee');ar(c,X(tt),Y(tt),X(tt),Y(tt)+9.8*tt*2,'#ef4444');c.fillStyle=Ac;c.beginPath();c.arc(X(tt),Y(tt),9,0,7);c.fill();return `t = √(2h/g) = ${T.toFixed(2)} s · L = v₀t = ${(P.v*T).toFixed(1)} m · hozir: vₓ = ${P.v} m/s, v_y = gt = ${(9.8*tt).toFixed(1)} m/s`}}});
Object.assign(X,{
0:{s:[
['Kuch — vektor kattalik. Kuch birligi va uni o‘lchash',`<p><b>Ta’rif.</b> Jismlarning bir-biriga ta’sirini ifodalovchi, jismga tezlanish beruvchi yoki uni deformatsiyalovchi vektor kattalik <b>kuch</b> deyiladi. Kuch uch narsa bilan aniqlanadi: <b>son qiymati</b>, <b>yo‘nalishi</b> va <b>qo‘yilish nuqtasi</b>.</p><p>SI da kuch birligi — <b>nyuton (N)</b>: 1 N — massasi 1 kg bo‘lgan jismga 1 m/s² tezlanish beruvchi kuch.</p><div class=f>1 N = 1 kg·m/s²</div><p>Kuch <b>dinamometr</b> bilan o‘lchanadi. Uning ishlashi Guk qonuniga asoslangan: prujinaning cho‘zilishi unga ta’sir etuvchi kuchga to‘g‘ri proporsional.</p><div class=f>F = kx</div><p>bu yerda k — prujina bikrligi (N/m), x — cho‘zilish (m). Simulyatsiyada k va x ni o‘zgartirib, shkalani kuzating.</p>`,'dyn'],
['Teng ta’sir etuvchi kuch. Bir to‘g‘ri chiziqdagi kuchlar',`<p><b>Ta’rif.</b> Jismga bir vaqtda ta’sir qilayotgan bir necha kuchning ta’sirini yakka o‘zi almashtira oladigan kuch <b>teng ta’sir etuvchi kuch</b> (R) deyiladi.</p><ul><li>Bir tomonga yo‘nalgan kuchlar: <b>R = F₁ + F₂</b></li><li>Qarama-qarshi yo‘nalgan kuchlar: <b>R = |F₁ − F₂|</b>, yo‘nalishi kattasi tomonga</li></ul><p>Teng ta’sir etuvchi tezlanishni aniqlaydi (Nyutonning 2-qonuni):</p><div class=f>a = R/m</div><p>R = 0 bo‘lsa, jism tinch yoki tekis to‘g‘ri chiziqli harakatda bo‘ladi (kuchlar muvozanatlashgan).</p>`,'tug'],
['Kuchlarni qo‘shishning parallelogramm qoidasi',`<p>Bir nuqtaga burchak ostida qo‘yilgan ikki kuchning teng ta’sir etuvchisi shu kuchlarga qurilgan parallelogrammning diagonaliga teng. Uning moduli kosinuslar teoremasidan topiladi:</p><div class=f>R = √(F₁² + F₂² + 2F₁F₂·cosα)</div><p>Yo‘nalishi F₁ ga nisbatan:</p><div class=f>tgβ = F₂·sinα / (F₁ + F₂·cosα)</div><ul><li>α = 0°: R = F₁ + F₂ (eng katta)</li><li>α = 90°: R = √(F₁² + F₂²) (Pifagor teoremasi)</li><li>α = 180°: R = |F₁ − F₂| (eng kichik)</li></ul><p>Misol: F₁ = 3 N, F₂ = 4 N, α = 90° bo‘lsa, R = 5 N.</p>`,'vec']]},
1:{s:[
['Tekis aylanma harakat va uning kattaliklari',`<p><b>Ta’rif.</b> Jism aylana bo‘ylab tezlik moduli o‘zgarmagan holda harakatlansa, bu <b>tekis aylanma harakat</b> deyiladi. Tezlik vektorining yo‘nalishi doimo o‘zgaradi (u aylanaga urinma bo‘ylab yo‘nalgan).</p><ul><li><b>Davr T</b> — bir marta to‘liq aylanish vaqti: T = t/N (s)</li><li><b>Chastota ν</b> — 1 s dagi aylanishlar soni: ν = N/t = 1/T (Hz)</li><li><b>Burchak tezlik ω</b> — burilish burchagining vaqtga nisbati (rad/s)</li><li><b>Chiziqli tezlik v</b> (m/s)</li></ul><div class=f>ω = Δφ/Δt = 2π/T = 2πν</div><div class=f>v = 2πR/T = ωR</div>`,'rot'],
['Markazga intilma tezlanish',`<p>Tezlik moduli o‘zgarmasa ham, uning yo‘nalishi o‘zgargani uchun jism <b>tezlanish</b> bilan harakatlanadi. Bu tezlanish aylana markaziga yo‘nalgan, tezlikka tik bo‘lib, tezlikning faqat yo‘nalishini o‘zgartiradi — shuning uchun u <b>markazga intilma tezlanish</b> deyiladi.</p><div class=f>a = v²/R = ω²R = 4π²R/T²</div><p>Tezlik ikki marta ortsa, a to‘rt marta ortadi; radius ikki marta ortsa (v o‘zgarmas), a ikki marta kamayadi.</p>`,'circ'],
['Markazga intilma kuch va uning tabiati',`<p><b>Ta’rif.</b> Jismga aylana bo‘ylab harakatlanishi uchun zarur markazga intilma tezlanishni beradigan, markazga yo‘nalgan teng ta’sir etuvchi kuch <b>markazga intilma kuch</b> deyiladi. Nyutonning 2-qonuniga ko‘ra:</p><div class=f>F = ma = mv²/R = mω²R</div><p>Bu alohida turdagi kuch emas: ip tarangligi, ishqalanish, butun olam tortishish kuchi yoki ularning teng ta’sir etuvchisi bo‘lishi mumkin.</p><p><b>Burilishdagi avtomobil:</b> ishqalanish kuchi F = μmg markazga intilma kuch vazifasini bajaradi. Sirpanmay burilishning eng katta tezligi:</p><div class=f>mv²/R ≤ μmg  ⟹  v<sub>max</sub> = √(μgR)</div>`,'turn']]},
2:{s:[
['Erkin tushish',`<p><b>Ta’rif.</b> Faqat og‘irlik kuchi ta’sirida sodir bo‘ladigan harakat <b>erkin tushish</b> deyiladi. Havosiz muhitda barcha jismlar bir xil g tezlanish bilan tushadi (Galiley). Yer sirti yaqinida g ≈ 9,8 m/s² (Oyda ≈ 1,6; Yupiterda ≈ 24,8 m/s²).</p><div class=f>v = v₀ + gt;   h = v₀t + gt²/2</div><p>Boshlang‘ich tezliksiz (v₀ = 0) tushganda:</p><div class=f>h = gt²/2;   t = √(2h/g);   v = gt = √(2gh)</div>`,'fall'],
['Gorizontal otilgan jism',`<p>Gorizontal otilgan jism harakati ikki mustaqil harakatning yig‘indisi: gorizontal yo‘nalishda <b>tekis</b> harakat (vₓ = v₀), vertikal yo‘nalishda <b>erkin tushish</b>.</p><div class=f>x = v₀t;   y = gt²/2;   v_y = gt</div><div class=f>v = √(v₀² + g²t²);   t = √(2h/g);   L = v₀·√(2h/g)</div><p>Traektoriya tenglamasi y = gx²/(2v₀²) — parabola. Tushish vaqti faqat balandlikka bog‘liq, tezlikka emas.</p>`,'hor'],
['Gorizontga burchak ostida otilgan jism',`<p>Boshlang‘ich tezlik gorizontga α burchak ostida yo‘nalgan. Proyeksiyalar:</p><div class=f>v₀ₓ = v₀cosα;   v₀y = v₀sinα</div><div class=f>x = v₀cosα·t;   y = v₀sinα·t − gt²/2</div><div class=f>T = 2v₀sinα/g;   H = v₀²sin²α/(2g);   L = v₀²sin2α/g</div><ul><li>Uchish uzoqligi α = 45° da eng katta.</li><li>α va 90° − α burchaklarda L bir xil.</li><li>Eng yuqori nuqtada v_y = 0, vₓ = v₀cosα saqlanadi.</li></ul>`,'proj']]}});
Object.assign(S,{
scl:{n:'og‘irlik kuchi va jism og‘irligi',p:[['Massa m (kg)','m',1,100,60],['g (m/s²)','g',1.6,25,9.8,.2]],d(c,P,t,Ac){const W=P.m*P.g,L=Math.min(90,90*W/980),dy=12*Math.exp(-2*t)*Math.cos(10*t);c.fillRect(220,250,200,12);c.fillStyle=Ac;c.beginPath();c.arc(320,150+dy,16,0,7);c.fill();c.fillRect(304,166+dy,32,70);ar(c,300,200+dy,300,200+dy+L,'#ef4444');ar(c,340,250,340,250-L,'#16a34a');ar(c,380,250,380,250+Math.min(L,35),'#22d3ee');return `mg = ${W.toFixed(0)} N (qizil, jismga qo‘yilgan) · N (yashil, jismga) · P = N = ${W.toFixed(0)} N (ko‘k, tayanchga qo‘yilgan)<br>Tinch holatda P = mg, lekin qo‘yilish nuqtalari turlicha`}},
brg:{n:'ko‘prikdagi avtomobil og‘irligi',p:[['Tezlik v (m/s)','v',0,30,10],['Radius R (m)','R',20,100,50,5],['Ko‘prik: 0 — qavariq, 1 — botiq','b',0,1,0]],d(c,P,t,Ac){const a=P.v*P.v/P.R,r=P.b?1+a/9.8:1-a/9.8,th=-.55+1.1*((t%4)/4),Rp=200,cv=!P.b,cx=320,cy=cv?350:50;c.beginPath();c.arc(cx,cy,Rp,cv?-Math.PI/2-.8:Math.PI/2-.8,cv?-Math.PI/2+.8:Math.PI/2+.8);c.stroke();const x=cx+Rp*Math.sin(th),y=cy+(cv?-1:1)*Rp*Math.cos(th)-20;c.fillStyle=Ac;c.fillRect(x-18,y,36,18);c.setLineDash([3,3]);c.beginPath();c.moveTo(x+30,y+9);c.lineTo(x+30,y+49);c.stroke();c.setLineDash([]);ar(c,x-30,y+9,x-30,y+9+Math.max(2,Math.min(120,40*r)),'#ef4444');return `a = v²/R = ${a.toFixed(2)} m/s² · P = m(g ${P.b?'+':'−'} v²/R) = ${Math.max(r,0).toFixed(2)}·mg (nuqtali chiziq — mg)`+(r<=0?'<br>P = 0: vaznsizlik (v = √(gR))':P.b?'<br>Botiq ko‘prikda og‘irlik ortadi (ortiqcha yuklanish)':'<br>Qavariq ko‘prikda og‘irlik kamayadi')}},
push:{n:'ta’sir va aks ta’sir (3-qonun)',p:[['Kuch F (N)','F',10,200,80,10],['m₁ (kg)','a',20,100,40,10],['m₂ (kg)','b',20,100,80,10]],d(c,P,t,Ac){const a1=P.F/P.a,a2=P.F/P.b,tt=t%3,x1=320-Math.min(280,18*a1*tt*tt),x2=320+Math.min(280,18*a2*tt*tt);c.fillStyle=Ac;c.beginPath();c.arc(x1,170,8+P.a/5,0,7);c.fill();c.fillStyle='#0ea5e9';c.beginPath();c.arc(x2,170,8+P.b/5,0,7);c.fill();ar(c,x1,120,x1-P.F*.5,120,'#ef4444');ar(c,x2,120,x2+P.F*.5,120,'#ef4444');return `F₁₂ = −F₂₁ = ${P.F} N (teng, qarama-qarshi)<br>a₁ = F/m₁ = ${a1.toFixed(2)} m/s² · a₂ = F/m₂ = ${a2.toFixed(2)} m/s²`}},
cmp:{n:'og‘irlik kuchining tashkil etuvchilari',p:[['Burchak α (°)','a',5,80,30],['Massa m (kg)','m',1,20,5]],d(c,P,t,Ac){const r=P.a*Math.PI/180,L=Math.min(420,220/Math.sin(r)),x0=60,y0=270-L*Math.sin(r),g=Math.min(t,1)*90,cs=Math.cos(r),sn=Math.sin(r);c.beginPath();c.moveTo(x0,y0);c.lineTo(x0+L*cs,270);c.lineTo(x0,270);c.closePath();c.stroke();const bx=x0+L/2*cs+16*sn,by=y0+L/2*sn-16*cs;c.fillStyle=Ac;c.beginPath();c.arc(bx,by,10,0,7);c.fill();ar(c,bx,by,bx,by+g,'#ef4444');ar(c,bx,by,bx+cs*g*sn,by+sn*g*sn,'#fbbf24');ar(c,bx,by,bx-sn*g*cs,by+cs*g*cs,'#22d3ee');const W=P.m*9.8;return `mg = ${W.toFixed(1)} N (qizil)<br>mg·sinα = ${(W*sn).toFixed(1)} N (sariq, tekislik bo‘ylab) · mg·cosα = ${(W*cs).toFixed(1)} N (ko‘k, tekislikka tik)`}},
crit:{n:'sirpanish sharti: μ va tgα',p:[['Burchak α (°)','a',0,60,20],['Ishqalanish koeffitsiyenti μ','u',.1,1,.5,.05]],d(c,P,t,Ac){const r=P.a*Math.PI/180,tg=Math.tan(r),a=9.8*(Math.sin(r)-P.u*Math.cos(r)),L=Math.min(300,200/Math.max(Math.sin(r),.15)),s=a>0?Math.min(a*(t%4)**2*20,L-44):0;c.save();c.translate(40,270-L*Math.sin(r));c.rotate(r);c.beginPath();c.moveTo(0,0);c.lineTo(L,0);c.stroke();c.fillStyle=Ac;c.fillRect(s,-28,44,28);c.restore();c.fillStyle='#22d3ee';c.fillRect(430,60,Math.min(tg,2)*80,20);c.fillStyle='#fbbf24';c.fillRect(430,100,P.u*80,20);c.fillStyle=c.strokeStyle;c.fillText('tgα',400,75);c.fillText('μ',410,115);return `tgα = ${tg.toFixed(2)}, μ = ${P.u} → `+(tg>P.u?`tgα > μ: jism sirpanadi, a = ${a.toFixed(2)} m/s²`:'tgα ≤ μ: jism sirpanmaydi')+`<br>Kritik burchak: α = arctg μ = ${(Math.atan(P.u)*180/Math.PI).toFixed(1)}°`}}});
Object.assign(X,{
3:{s:[
['Kuchlarni qo‘shish masalalari',`<p><b>Algoritm:</b> berilganlarni SI da yozing → chizma → formula → hisob → birlik va javobni tekshirish.</p><p><b>1-masala.</b> F₁ = 3 N, F₂ = 4 N, α = 90°. R = ?</p><div class=f>R = √(F₁² + F₂²) = √25 = 5 N</div><p><b>2-masala.</b> F₁ = 6 N, F₂ = 8 N, α = 60°. R = ?</p><div class=f>R = √(36 + 64 + 2·6·8·0,5) = √148 ≈ 12,2 N</div>`,'vec'],
['Aylanma harakat masalalari',`<p><b>1-masala.</b> m = 2 kg, R = 0,5 m, v = 5 m/s. F = ?</p><div class=f>F = mv²/R = 2·25/0,5 = 100 N</div><p><b>2-masala.</b> R = 3 m, T = 2 s. v va a = ?</p><div class=f>v = 2πR/T ≈ 9,42 m/s;  a = 4π²R/T² ≈ 29,6 m/s²</div>`,'circ'],
['Otilgan jism masalalari',`<p><b>1-masala.</b> v₀ = 20 m/s, α = 30°. T, H, L = ?</p><div class=f>T = 2v₀sinα/g ≈ 2,04 s;  H = v₀²sin²α/2g ≈ 5,1 m;  L = v₀²sin2α/g ≈ 35,3 m</div><p><b>2-masala.</b> Gorizontal otilgan: h = 45 m, v₀ = 15 m/s. t, L = ?</p><div class=f>t = √(2h/g) ≈ 3,03 s;  L = v₀t ≈ 45,5 m</div>`,'proj']]},
4:{s:[
['Og‘irlik kuchi va jism og‘irligi',`<p><b>Og‘irlik kuchi</b> — Yerning tortishi tufayli jismga ta’sir etuvchi kuch, <b>jismga</b> qo‘yilgan: F = mg.</p><p><b>Jism og‘irligi P</b> — jismning tayanchga bosim kuchi yoki osmani cho‘zuvchi kuch, <b>tayanch yoki osmaga</b> qo‘yilgan. Nyutonning 3-qonuniga ko‘ra P = N (tayanch reaksiyasi).</p><div class=f>Tinch holatda: P = N = mg</div><p>Birligi — nyuton (N). g sayyoraga bog‘liq (Yerda 9,8; Oyda 1,6 m/s²), shuning uchun og‘irlik o‘zgaradi, massa esa o‘zgarmaydi.</p>`,'scl'],
['Tezlanish bilan harakatlanayotgan jism og‘irligi',`<p>Lift yuqoriga a tezlanish bilan harakatlansa, Nyutonning 2-qonuni: N − mg = ma.</p><div class=f>P = m(g + a)  — yuqoriga tezlanish</div><p>Pastga tezlanish bilan: mg − N = ma.</p><div class=f>P = m(g − a)  — pastga tezlanish</div><p>Tezlik o‘zgarmas bo‘lsa (a = 0) P = mg.</p>`,'lift'],
['Ko‘prikdagi avtomobil. Vaznsizlik va ortiqcha yuklanish',`<p>Qavariq ko‘prik cho‘qqisida markazga intilma tezlanish pastga yo‘nalgan: mg − N = mv²/R.</p><div class=f>P = m(g − v²/R)  — qavariq ko‘prik</div><div class=f>P = m(g + v²/R)  — botiq ko‘prik</div><p><b>Vaznsizlik</b> — P = 0 holati; u jism faqat og‘irlik kuchi ta’sirida (a = g) harakatlanganda yuz beradi (kosmik stansiya, erkin tushayotgan lift). Qavariq ko‘prikda P = 0 bo‘ladigan tezlik v = √(gR). <b>Ortiqcha yuklanish</b> — P > mg (raketa uchishi, botiq ko‘prik).</p>`,'brg']]},
5:{s:[
['Nyutonning uch qonuni',`<ul><li><b>1-qonun (inersiya):</b> jismga kuch ta’sir etmasa yoki ta’sirlar muvozanatlashsa, u tinch yoki tekis to‘g‘ri chiziqli harakatda bo‘ladi: ΣF = 0 ⟹ v = const.</li><li><b>2-qonun:</b> jism tezlanishi unga ta’sir etuvchi teng ta’sir etuvchiga to‘g‘ri, massasiga teskari proporsional.</li><li><b>3-qonun:</b> jismlar bir-biriga modullari teng, yo‘nalishi qarama-qarshi kuchlar bilan ta’sir qiladi.</li></ul><div class=f>a = ΣF/m  (ΣF = ma)</div><div class=f>F₁₂ = −F₂₁</div><p>Bu kuchlar <b>turli jismlarga</b> qo‘yilgani uchun bir-birini muvozanatlamaydi.</p>`,'push'],
['Mexanikada uchraydigan kuchlar',`<ul><li><b>Og‘irlik kuchi:</b> F = mg</li><li><b>Butun olam tortishish:</b> F = G·m₁m₂/r², G = 6,67·10⁻¹¹ N·m²/kg²</li><li><b>Elastiklik kuchi (Guk):</b> F = kx</li><li><b>Sirpanish ishqalanish kuchi:</b> F = μN</li><li><b>Tayanch reaksiyasi N</b> — sirtga tik</li></ul><div class=f>F_el = kx;   F_ishq = μN</div>`,'dyn'],
['Gorizontal tekislikdagi harakat',`<p>Kuchlarni o‘qlarga proyeksiyalaymiz:</p><div class=f>OX: F − F_ishq = ma;   OY: N − mg = 0</div><p>Bundan N = mg, F_ishq = μmg:</p><div class=f>a = (F − μmg)/m</div><p>Jism harakatlanishi uchun F > μmg bo‘lishi kerak. Misol: m = 5 kg, F = 40 N, μ = 0,3 → F_ishq = 14,7 N, a ≈ 5,06 m/s².</p>`,'fric']]},
6:{s:[
['Og‘irlik masalalari',`<p><b>1-masala.</b> m = 70 kg, lift pastga a = 1,2 m/s² bilan. P = ?</p><div class=f>P = m(g − a) = 70·8,6 = 602 N</div><p><b>2-masala.</b> m = 60 kg, lift yuqoriga a = 2 m/s². P = ?</p><div class=f>P = m(g + a) = 60·11,8 = 708 N</div>`,'lift'],
['Ishqalanishli harakat masalalari',`<p>F = 30 N, m = 4 kg, μ = 0,2. a = ?</p><div class=f>F_ishq = μmg = 7,84 N;  a = (F − F_ishq)/m ≈ 5,54 m/s²</div>`,'fric'],
['Qiya tekislik masalalari',`<p>α = 30°, μ = 0,1. a = ?</p><div class=f>a = g(sinα − μcosα) = 9,8·(0,5 − 0,0866) ≈ 4,05 m/s²</div>`,'incl']]},
7:{s:[
['Qiya tekislikdagi kuchlar',`<p>Qiya tekislikdagi jismga og‘irlik kuchi mg, tayanch reaksiyasi N va ishqalanish kuchi F_ishq ta’sir qiladi. Og‘irlik kuchi ikkita tashkil etuvchiga ajratiladi:</p><div class=f>F₁ = mg·sinα  (tekislik bo‘ylab);   F₂ = mg·cosα  (tekislikka tik)</div><p>Tekislikka tik yo‘nalishda tezlanish yo‘q, shuning uchun:</p><div class=f>N = mg·cosα;   F_ishq = μN = μmg·cosα</div>`,'cmp'],
['Qiya tekislikdagi tezlanish',`<p>Tekislik bo‘ylab Nyutonning 2-qonuni: ma = mg·sinα − μmg·cosα. Massa qisqaradi:</p><div class=f>a = g(sinα − μcosα)</div><p>Tezlanish jism massasiga bog‘liq emas. Xususiy hollar: μ = 0 da a = g·sinα; α = 90° da a = g.</p>`,'incl'],
['Sirpanish sharti. Kritik burchak',`<p>Jism sirpanishi uchun mg·sinα > μmg·cosα bo‘lishi kerak:</p><div class=f>tgα > μ</div><p>Sirpanish boshlanadigan <b>kritik burchak</b>:</p><div class=f>α_k = arctg μ</div><p>tgα ≤ μ bo‘lsa, jism tinch turadi va ishqalanish kuchi mg·sinα ga teng (tekislik bo‘ylab yuqoriga yo‘nalgan).</p>`,'crit']]}});
const LB={s:0,P:null,F:null,rows:[],ns:0,ts:0};

function lb(n){const p=SIM[1]&&SIM[1].P;if(!p||!p.m)return;const al=Math.asin(p.h/p.l),Pt=p.m/1e3*9.8,Ft=Pt*(Math.sin(al)+.25*Math.cos(al)),q=x=>+(Math.round((x+((LB.rows.length%3)-1)*.03)/.05)*.05).toFixed(2);if(n==1){LB.s=1;LB.P=null;LB.F=null}if(n==2&&LB.s==1)LB.P=q(Pt);if(n==3&&LB.P!=null){LB.s=3;LB.ns=1;LB.F=null}if(n==4&&LB.s==3)LB.F=q(Ft);if(n==5&&LB.P!=null&&LB.F!=null){const l=p.l/100,h=p.h/100,At=LB.F*l,Af=LB.P*h;LB.rows.push({l,h,F:LB.F,P:LB.P,At,Af,e:Af/At*100});LB.s=0;LB.P=null;LB.F=null}if(n==6){LB.rows=[];LB.s=0;LB.P=null;LB.F=null}lt()}
function lt(){const e=$('#lbt');if(!e)return;const r=LB.rows,s=[...r].sort((a,b)=>a.h-b.h),inc=r.length>=3&&s[s.length-1].h>s[0].h&&s[s.length-1].e>s[0].e,th=`<th style='border:1px solid var(--bd);padding:4px'>`,td=`<td style='border:1px solid var(--bd);padding:4px'>`;e.innerHTML=`<div class=card><b>Natijalar jadvali</b><div style='overflow-x:auto'><table style='width:100%;border-collapse:collapse;text-align:center'><tr>${['№','l, m','h, m','F, N','P, N','A_t, J','A_f, J','η, %'].map(x=>th+x+'</th>').join('')}</tr>${r.map((o,i)=>`<tr>${[i+1,o.l.toFixed(2),o.h.toFixed(2),o.F.toFixed(2),o.P.toFixed(2),o.At.toFixed(3),o.Af.toFixed(3),o.e.toFixed(1)].map(x=>td+x+'</td>').join('')}</tr>`).join('')}</table></div><p class=mu>A_t = F·l;  A_f = P·h;  η = A_f/A_t·100%</p>`+(r.length<3?`<p class=mu>Jadvalni to‘ldirish uchun tajribani kamida 3 marta, har gal h ni o‘zgartirib bajaring (hozir ${r.length} ta).</p>`:`<p><b>Xulosa:</b> `+(inc?'qiya tekislik balandligi (qiyalik burchagi) ortganda FIK ortadi; ':'turli h uchun natijalarni solishtiring; ')+`η har doim 100 % dan kichik, chunki ishqalanish kuchini yengishga qo‘shimcha ish sarflanadi.</p>`)+`<button class=s onclick=lb(6)>Jadvalni tozalash</button></div>`}

wk:{n:'tik ko‘tarish va qiya tekislik: bajarilgan ishlar',p:[['Massa m (kg)','m',1,20,5],['Balandlik h (m)','h',.5,3,1,.5],['Burchak α (°)','a',10,80,30],['Ishqalanish μ','u',0,.6,.2,.05]],d(c,P,t,Ac){const r=P.a*Math.PI/180,A1=P.m*9.8*P.h,A2=A1*(1+P.u/Math.tan(r)),f=Math.min((t%4)/3,1),k=40,H=P.h*k,X=H/Math.tan(r),l=P.h/Math.sin(r);c.beginPath();c.moveTo(80,270);c.lineTo(80,270-H);c.stroke();c.beginPath();c.moveTo(200,270);c.lineTo(200+X,270);c.lineTo(200+X,270-H);c.closePath();c.stroke();c.fillStyle=Ac;c.fillRect(70,270-H*f-14,20,14);c.beginPath();c.arc(200+X*f,270-H*f-9,8,0,7);c.fill();c.fillStyle='#22d3ee';c.fillRect(470,270-150*A1/A2,50,150*A1/A2);c.fillStyle='#ef4444';c.fillRect(540,120,50,150);c.fillStyle=c.strokeStyle;c.fillText('A₁',485,285);c.fillText('A₂',555,285);return `A₁ = mgh = ${A1.toFixed(1)} J (tik) · l = h/sinα = ${l.toFixed(2)} m<br>A₂ = mgh + μmg·l·cosα = mgh(1 + μctgα) = ${A2.toFixed(1)} J (qiya tekislik)`}},
etag:{n:'FIK burchakka bog‘liqligi',p:[['Ishqalanish μ','u',0,.6,.25,.05],['Burchak α (°)','a',5,85,20]],d(c,P,t,Ac){const f=a=>1/(1+P.u/Math.tan(a*Math.PI/180));c.beginPath();c.moveTo(40,60);c.lineTo(40,270);c.lineTo(610,270);c.stroke();c.strokeStyle='#22d3ee';c.beginPath();for(let a=3;a<=88;a++){const x=40+a*6.3,y=270-200*f(a);a>3?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();const e=f(P.a);c.fillStyle=Ac;c.beginPath();c.arc(40+P.a*6.3,270-200*e,7,0,7);c.fill();c.fillStyle='#cbd5ff';c.fillText('η = 1',50,65);c.fillText('α, ° (0 → 90)',500,288);return `η = 1/(1 + μ·ctgα) = ${(e*100).toFixed(1)} % (α = ${P.a}°, μ = ${P.u})<br>α katta (tekislik tikroq) bo‘lsa FIK ortadi; μ katta bo‘lsa kamayadi`}},
meas:{n:'taxtani mahkamlash, l va h ni o‘lchash',p:[['Taxta uzunligi l (sm)','l',50,100,80,5],['Balandlik h (sm)','h',5,40,15,1]],d(c,P,t,Ac){const g=Math.min(t,1),k=4.5,hx=Math.sqrt(P.l*P.l-P.h*P.h)*k,H=P.h*k,x0=60,y0=270;c.lineWidth=5;c.beginPath();c.moveTo(x0,y0);c.lineTo(x0+hx,y0-H);c.stroke();c.lineWidth=2;c.beginPath();c.moveTo(x0+hx,y0);c.lineTo(x0+hx,y0-H*1.15);c.moveTo(x0-20,y0);c.lineTo(x0+hx+40,y0);c.stroke();ar(c,x0+hx+16,y0-H*g,x0+hx+16,y0,'#fbbf24');c.fillText('h = '+P.h+' sm',x0+hx+26,y0-H/2);c.fillText('l = '+P.l+' sm',x0+hx/2-40,y0-H/2-20);return `l = ${P.l} sm, h = ${P.h} sm → sinα = h/l = ${(P.h/P.l).toFixed(3)}, α = ${(Math.asin(P.h/P.l)*180/Math.PI).toFixed(1)}°<br>Jadvalga metrda yozing: l = ${(P.l/100).toFixed(2)} m, h = ${(P.h/100).toFixed(2)} m`}},
lab:{n:'virtual laboratoriya: dinamometr bilan o‘lchash',p:[['Brusok + yuk massasi (g)','m',100,400,200,50],['Balandlik h (sm)','h',5,40,15,1],['Taxta uzunligi l (sm)','l',50,100,80,5]],d(c,P,t,Ac){const m=P.m/1e3,al=Math.asin(P.h/P.l),Pt=m*9.8,Ft=Pt*(Math.sin(al)+.25*Math.cos(al)),q=x=>Math.round((x+((LB.rows.length%3)-1)*.03)/.05)*.05,k=4,ca=Math.cos(al),sa=Math.sin(al),Lp=P.l*k,x0=40,y0=270;if(LB.ns){LB.ts=t;LB.ns=0}const f=LB.s==3?Math.min((t-LB.ts)/3,1):0;c.lineWidth=4;c.beginPath();c.moveTo(x0,y0);c.lineTo(x0+Lp*ca,y0-Lp*sa);c.stroke();c.lineWidth=2;c.beginPath();c.moveTo(x0+Lp*ca,y0);c.lineTo(x0+Lp*ca,y0-Lp*sa);c.moveTo(20,y0);c.lineTo(x0+Lp*ca+20,y0);c.stroke();let rd='Brusok taxta pastida turibdi.';c.fillStyle=Ac;if(LB.s==1){c.beginPath();c.moveTo(560,20);c.lineTo(560,90);c.stroke();c.strokeRect(546,90,28,80);c.fillRect(544,170+Pt*8,32,22);c.fillStyle='#ef4444';c.fillRect(546,92+Pt*14,28,3);rd=`Dinamometr ko‘rsatishi: P = ${q(Pt).toFixed(2)} N`}else{const s=30+f*(Lp-80),bx=x0+s*ca,by=y0-s*sa;c.save();c.translate(bx,by);c.rotate(-al);c.fillRect(-22,-18,44,18);c.restore();if(LB.s==3){c.strokeStyle='#22d3ee';c.beginPath();c.moveTo(bx,by);c.lineTo(bx+60*ca,by-60*sa);c.stroke();rd=`Dinamometr ko‘rsatishi: F = ${q(Ft).toFixed(2)} N (tekis tortilmoqda)`}}const tip=LB.s==0?'1) «Brusokni dinamometrga osish» tugmasini bosing':LB.s==1?(LB.P==null?'2) Ko‘rsatishni o‘qing, «P ni yozib olish» ni bosing':'3) «Brusokni tortish» tugmasini bosing'):(LB.F==null?'4) «F ni yozib olish» ni bosing':'5) «Jadvalga qo‘shish» ni bosing');return rd+'<br>'+tip+`<br>Yozildi: P = ${LB.P??'—'} N · F = ${LB.F??'—'} N`}},
eqm:{n:'muvozanat turlari',p:[['Chetlashtirish (turtki)','d',.2,1,.6,.1]],d(c,P,t,Ac){const tau=t%5,D=P.d*60,pf=[x=>240-.012*(8100-x*x),x=>143+.012*x*x,x=>190];[0,1,2].forEach(i=>{const cx=110+i*210;c.beginPath();for(let x=-90;x<=90;x+=5){const y=pf[i](x);x>-90?c.lineTo(cx+x,y):c.moveTo(cx+x,y)}c.stroke();const bx=i==0?D*Math.exp(-.5*tau)*Math.cos(3*tau):i==1?Math.min(95,D*Math.cosh(1.5*tau)):D,y=pf[i](Math.max(-90,Math.min(90,bx)))-10;c.fillStyle=Ac;c.beginPath();c.arc(cx+bx,y,10,0,7);c.fill();c.fillStyle=c.strokeStyle;c.fillText(['turg‘un','noturg‘un','farqsiz'][i],cx-26,270)});return `Chap: chetlashtirilsa avvalgi holatga qaytadi (massa markazi ko‘tariladi). O‘rta: muvozanatdan uzoqlashadi (massa markazi pasayadi). O‘ng: yangi holatda ham muvozanatda.`}},
pair:{n:'juft kuch momenti (rul chambaragi)',p:[['Kuch F (N)','F',5,50,20,5],['Diametr D (m)','D',.2,.6,.4,.05]],d(c,P,t,Ac){const M=P.F*P.D,R=P.D*200,th=.08*M*(t%4)**1.5,cx=320,cy=150;c.beginPath();c.arc(cx,cy,R,0,7);c.stroke();[0,Math.PI/2].forEach(o=>{c.beginPath();c.moveTo(cx-R*Math.cos(th+o),cy+R*Math.sin(th+o));c.lineTo(cx+R*Math.cos(th+o),cy-R*Math.sin(th+o));c.stroke()});[0,Math.PI].forEach(o=>{const a=th+o,x=cx+R*Math.cos(a),y=cy-R*Math.sin(a);ar(c,x,y,x-Math.sin(a)*P.F*2,y-Math.cos(a)*P.F*2,'#ef4444')});return `Juft kuch: F₁ = F₂ = ${P.F} N, yelka d = D = ${P.D} m<br>M = F·D = ${M.toFixed(1)} N·m (D katta bo‘lsa, kamroq kuch yetadi)`}},
blk:{n:'bloklar: kuchdan yutuq',p:[['Yuk og‘irligi P (N)','P',20,200,100,10],['Blok: 0 — ko‘chmas, 1 — qo‘zg‘aluvchan','b',0,1,0]],d(c,P,t,Ac){const h=Math.min((t%4)/3,1)*40,mv=P.b==1,yl=200-h;c.beginPath();c.moveTo(200,30);c.lineTo(440,30);c.stroke();if(!mv){c.beginPath();c.arc(320,70,20,0,7);c.stroke();c.beginPath();c.moveTo(300,70);c.lineTo(300,yl);c.moveTo(340,70);c.lineTo(340,110+h);c.stroke();c.fillStyle=Ac;c.fillRect(280,yl,40,30);ar(c,340,110+h,340,150+h,'#ef4444')}else{c.beginPath();c.arc(320,yl-20,20,0,7);c.stroke();c.beginPath();c.moveTo(300,30);c.lineTo(300,yl-20);c.moveTo(340,yl-20);c.lineTo(340,120-2*h);c.stroke();c.fillStyle=Ac;c.fillRect(300,yl,40,30);ar(c,340,120-2*h,340,80-2*h,'#ef4444')}const F=mv?P.P/2:P.P;return (mv?`Qo‘zg‘aluvchan blok: F = P/2 = ${F} N, arqon yo‘li s = 2h`:`Ko‘chmas blok: F = P = ${F} N, arqon yo‘li s = h (faqat yo‘nalish o‘zgaradi)`)+`<br>Ish: A = Fs = Ph (ishdan yutuq yo‘q)`}}});

8:{s:[
['Jismni tik ko‘tarishda va qiya tekislik bo‘ylab ko‘chirishda bajarilgan ish',`<p>Jismni h balandlikka tik yuqoriga tekis ko‘tarishda og‘irlik kuchiga qarshi ish bajariladi:</p><div class=f>A₁ = mgh</div><p>Qiya tekislik bo‘ylab tekis ko‘tarishda og‘irlik va ishqalanish kuchlariga qarshi ish bajariladi:</p><div class=f>A₂ = mgh + F_ishq·l = mgh + μmg·l·cosα</div><p>Bunda l = h/sinα. Demak, A₂ > A₁: ishqalanishni yengishga sarflangan ish biz uchun ortiqcha, <b>zararli</b> ish hisoblanadi. Qiya tekislik kuchdan yutuq beradi, lekin ishdan yutuq bermaydi.</p>`,'wk'],
['Foydali va to‘liq ish. Qiya tekislikning FIKi',`<p><b>Foydali ish</b> A_f = mgh; <b>to‘liq (umumiy) ish</b> A_t = mgh + μmg·l·cosα (tajribada A_t = Fl, A_f = Ph).</p><p><b>Ta’rif.</b> Foydali ishning to‘liq ishga nisbati qiya tekislikning <b>foydali ish koeffitsiyenti (FIK)</b> deyiladi:</p><div class=f>η = A_f/A_t · 100% = mgh/(mgh + μmg·l·cosα) · 100%</div><p>Ishqalanish bo‘lgani uchun FIK har doim 100 % dan kichik.</p>`,'eta'],
['FIKning qiyalik burchagiga bog‘liqligi',`<p>h = l·sinα ekanini hisobga olsak, l ni qisqartirib:</p><div class=f>η = 1/(1 + μ·ctgα)</div><p>Demak, FIK <b>burchak</b> va <b>ishqalanish koeffitsiyenti</b>ga bog‘liq: α ortsa (tekislik tikroq) η ortadi; μ ortsa η kamayadi. Ishqalanish bo‘lmasa (μ = 0) η = 100 %. h/l nisbati qiya tekislikni tavsiflaydi: h/l = sinα.</p>`,'etag']]},
9:{s:[
['Ish masalalari',`<p><b>1-masala.</b> F = 50 N, s = 4 m, α = 60°. A = ?</p><div class=f>A = Fs·cosα = 50·4·0,5 = 100 J</div><p><b>2-masala.</b> m = 2 kg, h = 0,5 m, α = 30°, μ = 0,2. A₁ va A₂ = ?</p><div class=f>A₁ = mgh = 9,8 J;  A₂ = mgh(1 + μctgα) ≈ 9,8·1,346 ≈ 13,2 J</div>`,'wk'],
['FIK masalalari',`<p><b>1-masala.</b> A_f = 60 J, A_t = 75 J. η = ?</p><div class=f>η = A_f/A_t·100% = 80 %</div><p><b>2-masala.</b> η = 50 %, A_f = 30 J. A_t = ?</p><div class=f>A_t = A_f/η = 30/0,5 = 60 J</div>`,'eta'],
['Burchak va FIK masalalari',`<p>μ = 0,25. α = 30° va α = 45° da η = ?</p><div class=f>η = 1/(1 + μctgα);  30°: ≈ 69,8 %;  45°: 80 %</div><p>Burchak ortganda FIK ortadi.</p>`,'etag']]},
10:{s:[
['Ishning maqsadi, asboblar. Qiya tekislikni mahkamlash va l, h ni o‘lchash',`<p><b>Ishning maqsadi:</b> qiya tekislik va undan foydalanishni o‘rganish; foydali va to‘liq ishlar hamda FIK haqidagi bilimlarni mustahkamlash; xatoliklarni hisoblash ko‘nikmasini shakllantirish.</p><p><b>Asboblar:</b> uzun yupqa taxta, qisqichli shtativ, yog‘och brusok, chizg‘ich, yuklar to‘plami, dinamometr.</p><p><b>1-qadam.</b> Taxtani shtativga mahkamlang va qiya tekislikning uzunligi l hamda balandligi h ni chizg‘ich bilan o‘lchang. Simulyatsiyada slayderlar bilan taxtani o‘rnating.</p>`,'meas'],
['Dinamometr bilan P va F ni o‘lchash',`<p><b>2-qadam.</b> Brusokni dinamometrga osib uning og‘irligi <b>P</b> ni aniqlang.</p><p><b>3-qadam.</b> Brusokni qiya tekislikka qo‘yib, dinamometr bilan tekislik bo‘ylab <b>tekis</b> tortib, tortish kuchi <b>F</b> ni o‘lchang.</p><div class=f>A_t = F·l;   A_f = P·h</div><p>Brusok massasini (yuk qo‘shib) va h ni slayderlar bilan o‘zgartiring. Quyidagi tugmalar bilan ish tartibini bajaring:</p><div class=row style='flex-wrap:wrap'><button onclick=lb(1)>1. Brusokni dinamometrga osish</button><button class=s onclick=lb(2)>P ni yozib olish</button><button onclick=lb(3)>2. Brusokni tortish</button><button class=s onclick=lb(4)>F ni yozib olish</button><button onclick=lb(5)>Jadvalga qo‘shish</button></div>`,'lab'],
['Hisoblash, jadval va xulosa',`<p><b>4-qadam.</b> Foydali va to‘liq ishlarni hisoblang: A_f = Ph, A_t = Fl.</p><p><b>5-qadam.</b> FIK ni toping:</p><div class=f>η = A_f/A_t · 100%</div><p>Tajriba kamida uch marta, qiya tekislikning turli balandliklari uchun takrorlanadi; natijalar jadvalga yoziladi va FIKning qiyalik burchagiga bog‘liqligi haqida xulosa chiqariladi. <b>Uyga vazifa:</b> dinamometrli tarozi yordamida tajribani uyda takrorlang.</p><div id=lbt></div>`,'etag']]},
11:{s:[
['Massa markazi va uni aniqlash usullari',`<p><b>Ta’rif.</b> Jism yoki jismlar sistemasi massasining taqsimlanishini ifodalovchi, tashqi kuch ta’sirida jism go‘yo shu nuqtaga to‘plangan nuqtadek harakatlanadigan nuqta <b>massa markazi</b> deyiladi. Bir jinsli simmetrik jismlarda u geometrik markazda yotadi.</p><div class=f>x_c = (m₁x₁ + m₂x₂)/(m₁ + m₂)</div><p><b>Aniqlash usuli:</b> yassi jism turli nuqtalaridan osiladi; osish nuqtasidan o‘tuvchi vertikal chiziqlarning kesishgan joyi massa markazidir.</p>`,'cm'],
['Jismlarning muvozanat turlari',`<ul><li><b>Turg‘un:</b> chetlashtirilsa, jism avvalgi holatiga qaytadi; massa markazi ko‘tariladi.</li><li><b>Noturg‘un:</b> chetlashtirilsa, muvozanatdan uzoqlashadi; massa markazi pasayadi.</li><li><b>Farqsiz:</b> yangi holatda ham muvozanatda qoladi.</li></ul><p>Tayanch yuzi katta va massa markazi past jism barqaror bo‘ladi.</p>`,'eqm'],
['Kuch momenti va richaglar',`<p>Aylanish o‘qidan kuch ta’sir chizig‘igacha bo‘lgan perpendikulyar masofa <b>kuch yelkasi</b> d. Kuch va yelka ko‘paytmasi <b>kuch momenti</b>:</p><div class=f>M = F·d  (birligi N·m)</div><p>Richag muvozanatda bo‘lishi uchun soat strelkasi bo‘ylab va unga qarshi momentlar teng:</p><div class=f>M₁ = M₂;   F₁d₁ = F₂d₂</div><p>Richag qaychi, tarozi, qo‘l aravacha, ombir kabi qurilmalarda qo‘llanadi.</p>`,'lev']]},
12:{s:[
['Juft kuchlar',`<p><b>Ta’rif.</b> Modullari teng, bir-biriga parallel, qarama-qarshi yo‘nalgan va bir to‘g‘ri chiziqda yotmaydigan ikki kuch <b>juft kuch</b> deyiladi. Juft kuch jismni aylantiradi (rul chambaragi, vint). Uning momenti:</p><div class=f>M = F·d</div><p>d — kuchlar ta’sir chiziqlari orasidagi masofa. Rul chambaragi diametri katta bo‘lsa, o‘sha momentni olish uchun kamroq kuch kerak.</p>`,'pair'],
['Richag',`<p><b>Richag</b> — qo‘zg‘almas o‘q atrofida aylana oladigan qattiq jism. Momentlar qoidasi:</p><div class=f>F₁d₁ = F₂d₂  ⟹  F₁/F₂ = d₂/d₁</div><p>Yelka necha marta uzun bo‘lsa, kuchdan shuncha marta yutiladi, lekin yo‘lda shuncha marta yutqaziladi.</p>`,'lev'],
['Bloklar, chig‘iriq va ponalar',`<ul><li><b>Ko‘chmas blok:</b> kuchdan yutuq bermaydi, kuch yo‘nalishini o‘zgartiradi: F = P.</li><li><b>Qo‘zg‘aluvchan blok:</b> kuchdan 2 marta yutuq beradi: F = P/2, arqon yo‘li s = 2h.</li><li><b>Chig‘iriq (vorot):</b> F·R = P·r.</li><li><b>Vint, pona</b> — qiya tekislikning turlari.</li></ul><div class=f>Mexanikaning “oltin qoidasi”: A_1 = A_2 (ishdan yutuq yo‘q)</div>`,'blk']]},
13:{s:[
['Richag masalalari',`<p>F₁ = 30 N, d₁ = 0,4 m, d₂ = 0,6 m. F₂ = ?</p><div class=f>F₂ = F₁d₁/d₂ = 30·0,4/0,6 = 20 N</div>`,'lev'],
['Massa markazi masalalari',`<p>m₁ = 2 kg, m₂ = 3 kg, orasidagi masofa d = 1 m. m₁ dan massa markazigacha masofa?</p><div class=f>x = m₂d/(m₁ + m₂) = 3·1/5 = 0,6 m</div>`,'cm'],
['Blok masalalari',`<p>Yuk 200 N. Qo‘zg‘aluvchan blokda F va yuk 1 m ko‘tarilganda arqon yo‘li?</p><div class=f>F = P/2 = 100 N;  s = 2h = 2 m;  A = Fs = Ph = 200 J</div>`,'blk']]}});
const PL={run:0,ts:0,ns:0,fr:null,last:0,rows:[],cur:null};
function rs(id){const s=SIM[id];s.t=0;s.pz=0;s.m.p.forEach(p=>{s.P[p[1]]=+$('#p'+id+'_'+p[1]).value;$('#l'+id+'_'+p[1]).textContent=s.P[p[1]]});lt();lq()}
function lp(n){const p=SIM[1]&&SIM[1].P;if(!p||!p.l)return;if(n==1){PL.run=1;PL.ns=1;PL.fr=null;PL.cur=null}if(n==2&&PL.run){PL.run=0;PL.fr=PL.last;const T=2*Math.PI*Math.sqrt(p.l/9.81)*(1+Math.pow(p.a*Math.PI/180,2)/16);PL.cur={l:p.l,N:Math.round(PL.fr/T),t:+(PL.fr+((PL.rows.length%3)-1)*.08).toFixed(2)}}if(n==3&&PL.cur&&PL.cur.N>=5){const c=PL.cur,T=c.t/c.N;PL.rows.push({l:c.l,N:c.N,t:c.t,g:4*Math.PI*Math.PI*c.l/(T*T)});PL.cur=null}if(n==4){PL.rows=[];PL.cur=null}lq()}
function lq(){const e=$('#lpt');if(!e)return;const r=PL.rows,m=r.length?r.reduce((s,o)=>s+o.g,0)/r.length:0,d=r.map(o=>Math.abs(o.g-m)),dm=r.length?d.reduce((s,x)=>s+x,0)/r.length:0,th=`<th style='border:1px solid var(--bd);padding:4px'>`,td=`<td style='border:1px solid var(--bd);padding:4px'>`;e.innerHTML=`<div class=card><b>Natijalar jadvali</b><div style='overflow-x:auto'><table style='width:100%;border-collapse:collapse;text-align:center'><tr>${['l, m','N','t, s','g, m/s²','Δg, m/s²'].map(x=>th+x+'</th>').join('')}</tr>${r.map((o,i)=>`<tr>${[o.l.toFixed(2),o.N,o.t.toFixed(2),o.g.toFixed(2),d[i].toFixed(2)].map(x=>td+x+'</td>').join('')}</tr>`).join('')}</table></div>`+(r.length>=3?`<p>g<sub>o‘rt</sub> = ${m.toFixed(2)} m/s² · Δg<sub>o‘rt</sub> = ${dm.toFixed(2)} m/s² · ε = Δg<sub>o‘rt</sub>/g<sub>o‘rt</sub>·100% = ${(dm/m*100).toFixed(1)} %</p>`:`<p class=mu>Kamida 3 ta tajriba (N = 20, 30, 40) bajaring: hozir ${r.length} ta.</p>`)+`<button class=s onclick=lp(4)>Jadvalni tozalash</button></div>`}
Object.assign(S,{
pnd:{n:'virtual laboratoriya: matematik mayatnik',p:[['Ip uzunligi l (m)','l',.5,1.5,1,.1],['Og‘dirish burchagi (°), 6°–8° bo‘lsin','a',3,15,7]],d(c,P,t,Ac){if(PL.ns){PL.ts=t;PL.ns=0}const Tp=2*Math.PI*Math.sqrt(P.l/9.81)*(1+Math.pow(P.a*Math.PI/180,2)/16),el=PL.run?t-PL.ts:(PL.fr||0);if(PL.run)PL.last=el;const th=PL.run?P.a*Math.PI/180*Math.cos(2*Math.PI*el/Tp):P.a*Math.PI/180,L=P.l*160,x=320+L*Math.sin(th),y=30+L*Math.cos(th);c.fillRect(250,24,140,6);c.beginPath();c.moveTo(320,30);c.lineTo(x,y);c.stroke();c.fillStyle=Ac;c.beginPath();c.arc(x,y,12,0,7);c.fill();c.fillStyle=c.strokeStyle;c.font='22px sans-serif';c.fillText(el.toFixed(2)+' s',500,60);c.font='14px sans-serif';c.fillText('sekundomer',500,80);const n=Math.floor(el/Tp),tip=PL.run?'Tebranishlarni sanang va kerakli N ga yetganda «sekundomerni to‘xtating»':PL.cur?`To‘xtatildi: t = ${PL.cur.t} s, N = ${PL.cur.N}. «Jadvalga yozish» ni bosing`:'«Sharchani qo‘yib yuborish» ni bosing';return tip+`<br>Tebranishlar soni: ${n} · amplituda ${P.a}°`+(P.a>8?' (6°–8° tavsiya etiladi)':'')}},
tl:{n:'T² va l bog‘liqligi (turli sayyoralar)',p:[['g (m/s²): Oy 1,6 · Mars 3,7 · Yer 9,8','g',1.6,10,9.8,.2],['Ip uzunligi l (m)','l',.2,2,1,.1]],d(c,P,t,Ac){const k=4*Math.PI*Math.PI/P.g,T2=k*P.l;c.beginPath();c.moveTo(40,60);c.lineTo(40,270);c.lineTo(610,270);c.stroke();c.strokeStyle='#22d3ee';c.beginPath();c.moveTo(40,270);c.lineTo(600,270-Math.min(200,k*2*4));c.stroke();c.fillStyle=Ac;c.beginPath();c.arc(40+P.l*280,270-Math.min(200,T2*4),7,0,7);c.fill();return `T² = 4π²l/g = ${T2.toFixed(2)} s² · T = ${Math.sqrt(T2).toFixed(2)} s · g = 4π²l/T² = ${P.g}<br>Grafik to‘g‘ri chiziq; qiyaligi 4π²/g (g kichik bo‘lsa davr katta)`}},
fld:{n:'nuqtaviy zaryad maydoni',p:[['Zaryad q (nC)','q',-20,20,10,2],['Masofa r (m)','r',.1,1,.3,.05]],d(c,P,t,Ac){const E=9*P.q/(P.r*P.r),sg=E<0?-1:1,x0=150,y0=150,xt=x0+P.r*400;c.setLineDash([3,6]);c.beginPath();c.arc(x0,y0,(t*70)%380,0,7);c.stroke();c.setLineDash([]);for(let i=0;i<10;i++){const a=i*Math.PI/5,u=Math.cos(a),v=Math.sin(a);sg>0?ar(c,x0+30*u,y0+30*v,x0+85*u,y0+85*v,'#fbbf24'):ar(c,x0+85*u,y0+85*v,x0+30*u,y0+30*v,'#fbbf24')}c.fillStyle=sg>0?'#ef4444':'#0ea5e9';c.beginPath();c.arc(x0,y0,18,0,7);c.fill();c.fillStyle='#22d3ee';c.beginPath();c.arc(xt,y0,8,0,7);c.fill();ar(c,xt,y0,xt+sg*Math.min(130,40*Math.log10(1+Math.abs(E)/10)),y0,'#22d3ee');return `E = kq/r² = ${E.toFixed(0)} N/C (sinov zaryad q_s = 1 nC)<br>F = q_s·E = ${Math.abs(E).toFixed(0)} nN · yo‘nalish: `+(sg>0?'zaryaddan tashqariga':'zaryad tomonga')}},
sup:{n:'maydonlar superpozitsiyasi',p:[['q₁ (nC)','a',-20,20,10,2],['q₂ (nC)','b',-20,20,-10,2],['P nuqta balandligi h (m)','h',.05,.5,.25,.05]],d(c,P,t,Ac){const x1=170,x2=470,y0=240,px=320,py=y0-P.h*400,s=(q,x)=>{const dx=(px-x)/400,dy=(y0-py)/400,r=Math.hypot(dx,dy),e=9*q/(r*r);return[e*dx/r,-e*dy/r,Math.abs(e)]},A=s(P.a,x1),B=s(P.b,x2),Ex=A[0]+B[0],Ey=A[1]+B[1],E=Math.hypot(Ex,Ey),k=70/Math.max(A[2],B[2],E,1),g=Math.min(1,t);c.fillStyle=P.a>=0?'#ef4444':'#0ea5e9';c.beginPath();c.arc(x1,y0,14,0,7);c.fill();c.fillStyle=P.b>=0?'#ef4444':'#0ea5e9';c.beginPath();c.arc(x2,y0,14,0,7);c.fill();c.fillStyle=Ac;c.beginPath();c.arc(px,py,6,0,7);c.fill();ar(c,px,py,px+A[0]*k*g,py+A[1]*k*g,'#fbbf24');ar(c,px,py,px+B[0]*k*g,py+B[1]*k*g,'#22d3ee');ar(c,px,py,px+Ex*k*g,py+Ey*k*g,'#ef4444');return `E₁ = ${A[2].toFixed(0)} N/C (sariq) · E₂ = ${B[2].toFixed(0)} N/C (ko‘k)<br>E = E₁ + E₂ (vektor yig‘indi) = ${E.toFixed(0)} N/C (qizil)`}},
shr:{n:'zaryadlangan shar maydoni E(r)',p:[['Zaryad q (nC)','q',1,20,10],['Radius R (sm)','R',5,30,10,5]],d(c,P,t,Ac){const R=P.R/100,E0=9*P.q/(R*R),rm=(t%6)/6*3*R,E=r=>r<R?0:9*P.q/(r*r),X=r=>40+r/(3*R)*560;c.beginPath();c.moveTo(40,60);c.lineTo(40,270);c.lineTo(610,270);c.stroke();c.strokeStyle='#22d3ee';c.beginPath();c.moveTo(40,270);c.lineTo(X(R),270);c.lineTo(X(R),90);for(let r=R;r<=3*R;r+=R/30)c.lineTo(X(r),270-180*E(r)/E0);c.stroke();c.fillStyle=Ac;c.beginPath();c.arc(X(rm),270-180*E(rm)/E0,7,0,7);c.fill();c.fillStyle='#cbd5ff';c.fillText('R',X(R)-4,288);return `r = ${(rm*100).toFixed(1)} sm: `+(rm<R?'E = 0 (shar ichida)':`E = kq/r² = ${E(rm).toFixed(0)} N/C`)+`<br>Sirtda E = kq/R² = ${E0.toFixed(0)} N/C`}},
shx:{n:'sirtdan x masofadagi maydon',p:[['Zaryad q (nC)','q',1,20,10],['Radius R (sm)','R',5,30,10,5],['Sirtdan masofa x (sm)','x',0,60,20,5]],d(c,P,t,Ac){const r=(P.R+P.x)/100,E=9*P.q/(r*r),x0=150,y0=150,pr=4*P.R,xp=x0+4*(P.R+P.x);c.setLineDash([3,6]);c.beginPath();c.arc(x0,y0,pr+((t*50)%200),0,7);c.stroke();c.setLineDash([]);c.fillStyle='#ef4444';c.beginPath();c.arc(x0,y0,pr,0,7);c.fill();ar(c,x0,y0,xp,y0,'#fbbf24');c.fillStyle=Ac;c.beginPath();c.arc(xp,y0,8,0,7);c.fill();ar(c,xp,y0,xp+Math.min(120,35*Math.log10(1+E/10)),y0,'#22d3ee');return `r = R + x = ${(r*100).toFixed(0)} sm<br>E = kq/(R + x)² = ${E.toFixed(0)} N/C`}},
dlk:{n:'muhit va dielektrik singdiruvchanlik',p:[['Singdiruvchanlik ε (vakuum 1, suv 81)','e',1,81,1],['Zaryad q (nC)','q',1,20,10],['Masofa r (m)','r',.1,1,.3,.05]],d(c,P,t,Ac){const E0=9*P.q/(P.r*P.r),E=E0/P.e,g=Math.min(t,1);c.fillStyle='#fbbf24';c.fillRect(150,270-180*g,80,180*g);c.fillStyle='#22d3ee';c.fillRect(300,270-180*g/P.e,80,180*g/P.e);c.fillStyle='#cbd5ff';c.fillText('E vakuumda',150,288);c.fillText('E muhitda',300,288);for(let i=0;i<14;i++){c.fillStyle=Ac;c.beginPath();c.arc(450+(i%5)*30,60+Math.floor(i/5)*40+6*Math.sin(3*t+i),6,0,7);c.fill()}return `E₀ = kq/r² = ${E0.toFixed(0)} N/C · E = kq/(εr²) = ${E.toFixed(1)} N/C (ε = ${P.e}: ${P.e} marta kamayadi)`}}});
Object.assign(X,{
15:{s:[
['Mexanik tebranishlar. Erkin va majburiy tebranishlar',`<p><b>Ta’rif.</b> Muayyan vaqt oraliqlarida vaziyati davriy takrorlanib turadigan harakat <b>tebranma harakat</b> (tebranish) deyiladi. Tebranishlar ikki xil: <b>erkin</b> va <b>majburiy</b>.</p><p><b>Erkin tebranish</b> — jism muvozanat vaziyatidan chiqarib qo‘yib yuborilgach, tizim ichidagi kuchlar (masalan, elastiklik kuchi) ta’sirida sodir bo‘ladigan tebranish (prujina yoki ipga osilgan yuk). <b>Majburiy tebranish</b> — tashqi davriy o‘zgaruvchan kuch ta’sirida sodir bo‘ladigan tebranish (radiokarnay membranasi).</p>`,'pend'],
['Davr, chastota, siklik chastota. Garmonik tebranishlar',`<p>Bitta to‘liq tebranish vaqti <b>davr T</b> (s); 1 s dagi tebranishlar soni <b>chastota ν</b> (Hz); 2π s dagi tebranishlar soni <b>siklik chastota ω</b> (rad/s).</p><div class=f>T = t/N;   ν = N/t = 1/T;   ω = 2π/T = 2πν</div><p>Sinus yoki kosinus qonuni bo‘yicha bo‘ladigan tebranish <b>garmonik tebranish</b> deyiladi:</p><div class=f>x = A·cos(ωt);   v = −Aω·sin(ωt);   a = −ω²x</div>`,'osc'],
['Avtotebranishlar va rezonans',`<p><b>Avtotebranishlar</b> — tashqi davriy kuch ta’sirisiz, tizimning ichki energiya manbai hisobiga hosil bo‘ladigan so‘nmas tebranishlar; yo‘qotilgan energiyani to‘ldirib turishni tizimning o‘zi boshqaradi (devor soati, yurak).</p><p><b>Rezonans</b> — majburlovchi kuch chastotasi tizimning xususiy chastotasiga teng bo‘lganda majburiy tebranish amplitudasining keskin ortishi.</p><div class=f>ν_majb = ν₀  ⟹  A → maksimum</div>`,'res']]},
17:{s:[
['Ishning maqsadi, asbob-uskunalar. Ipning uzunligini o‘lchash',`<p><b>Ishning maqsadi:</b> erkin tushish tezlanishini matematik mayatnik yordamida aniqlash usulini o‘rganish.</p><p><b>Asbob-uskunalar:</b> laboratoriya universal shtativi, cho‘zilmas ip, sharcha, sekundomer, o‘lchov lentasi.</p><p><b>1–2-qadam.</b> Ipni shtativga imkon boricha uzunroq qilib mahkamlang va uzunligi l ni o‘lchov lentasi bilan o‘lchang. Shar radiusi ip uzunligidan juda kichik bo‘lgani uchun uni hisobga olmasa ham bo‘ladi.</p><div class=f>T = 2π√(l/g)  ⟹  g = 4π²l/T²</div>`,'pend'],
['Tebranishlar vaqtini o‘lchash (N = 20, 30, 40)',`<p><b>3–5-qadam.</b> Sharchani muvozanat vaziyatidan 6°–8° burchakka og‘dirib qo‘yib yuboring va shu onda sekundomerni ishga tushiring. Oldindan belgilangan (masalan 20) tebranishlar sonining to‘liq vaqti t ni yozib oling.</p><div class=f>T = t/N;   g = 4π²l/T²</div><p><b>7-qadam.</b> Ip uzunligini o‘zgartirmay, N = 30 va N = 40 uchun takrorlang.</p><div class=row style='flex-wrap:wrap'><button onclick=lp(1)>1. Sharchani qo‘yib yuborish, sekundomerni yurgizish</button><button onclick=lp(2)>2. Sekundomerni to‘xtatish</button><button class=s onclick=lp(3)>3. Jadvalga yozish</button></div>`,'pnd'],
['Natijalar jadvali va xatoliklar',`<p><b>8–10-qadam.</b> g ning o‘rtacha qiymati va xatoliklarini toping:</p><div class=f>g<sub>o‘rt</sub> = (g₁ + g₂ + g₃)/3;   Δg<sub>i</sub> = |g<sub>o‘rt</sub> − g<sub>i</sub>|</div><div class=f>Δg<sub>o‘rt</sub> = (Δg₁ + Δg₂ + Δg₃)/3;   ε = Δg<sub>o‘rt</sub>/g<sub>o‘rt</sub>·100%</div><p><b>Savollar:</b> davr sharcha massasiga bog‘liq emas (tezlanish massaga bog‘liq emas, m qisqaradi); boshqa sayyorada g boshqacha, shuning uchun natija farq qiladi; davr sharcha o‘lchamiga bog‘liq emas (l ≫ r bo‘lganda); ekvator va qutbda g turlicha, davr ham turlicha.</p><div id=lpt></div>`,'tl']]},
24:{s:[
['Elektrostatik maydon va uning kuchlanganligi',`<p>Elektr zaryadlar atrofida elektr maydoni hosil bo‘ladi; qo‘zg‘almas zaryadlar maydoni <b>elektrostatik maydon</b> deyiladi. Maydonning kuch tavsifi — <b>kuchlanganlik</b> E: sinov zaryadiga ta’sir etuvchi kuchning shu zaryadga nisbati.</p><div class=f>E = F/q_s;   [E] = 1 N/C</div><p>Yo‘nalishi musbat zaryadga ta’sir etuvchi kuch yo‘nalishi bilan bir xil. Nuqtaviy zaryad maydonida (Kulon qonunidan):</p><div class=f>E = k·q/r²,   k = 9·10⁹ N·m²/C²</div>`,'fld'],
['Elektr maydon kuchlanganligining superpozitsiya prinsipi',`<p>Bir nechta zaryad hosil qilgan maydonning biror nuqtadagi kuchlanganligi har bir zaryad alohida hosil qilgan kuchlanganliklarning <b>vektor</b> yig‘indisiga teng:</p><div class=f>E = E₁ + E₂ + … + Eₙ</div>`,'sup'],
['Natijaviy elektr maydon kuchlanganligi',`<p>Ikki kuchlanganlik orasidagi burchak α bo‘lsa (vektorlarni qo‘shish qoidasi):</p><div class=f>E = √(E₁² + E₂² + 2E₁E₂·cosα)</div><ul><li>bir yo‘nalishda: E = E₁ + E₂</li><li>qarama-qarshi: E = |E₁ − E₂|</li><li>o‘zaro tik: E = √(E₁² + E₂²)</li></ul><p>Simulyatsiyada F₁, F₂ o‘rniga E₁, E₂ deb qarang.</p>`,'vec']]},
25:{s:[
['Zaryadlangan metall sharning elektr maydoni',`<p>O‘tkazgich shar yoki sferaga berilgan q zaryad o‘zaro itarishish tufayli faqat <b>sirt</b> bo‘ylab tekis taqsimlanadi. Shuning uchun shar ichida maydon yo‘q, sirtida va tashqarisida esa maydon nuqtaviy zaryaddagidek:</p><div class=f>E<sub>ichki</sub> = 0   (r < R)</div><div class=f>E = k·q/R²   (sirtda);   E = k·q/r²   (r > R)</div><p>Shu sababli zaryadlangan metall qafas ichida elektroskop yaproqlari ochilmaydi (Faradey tajribasi).</p>`,'shr'],
['Sirtdan x masofadagi maydon kuchlanganligi',`<p>Shar markazidan masofa r = R + x bo‘lgan nuqtada (x — sirtdan masofa):</p><div class=f>E = k·q/(R + x)²</div><p>Masofa ortgan sari kuchlanganlik kvadrat qonun bo‘yicha kamayadi.</p>`,'shx'],
['Zaryadning sirt zichligi. Muhitning dielektrik singdiruvchanligi',`<p><b>Sirt zichligi</b> — zaryadning sirt yuziga nisbati. Shar uchun S = 4πR²:</p><div class=f>σ = q/S = q/(4πR²);   E<sub>sirt</sub> = 4πkσ = σ/ε₀</div><p>Dielektrik muhitda kuchlanganlik <b>dielektrik singdiruvchanlik ε</b> marta kamayadi (vakuum uchun ε = 1, suv uchun ≈ 81):</p><div class=f>E = k·q/(ε·r²)</div>`,'dlk']]}});
